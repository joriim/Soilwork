<script>
const FIELDS={phys:"Physics",chem:"Chemistry",soil:"Soil science",env:"Environment",meth:"Methods",econ:"Economics"};

/* Full articles */
const L=[
{id:"th0",sym:"0T",f:"phys",name:"Zeroth law of thermodynamics",yr:"1939 (named)",full:1,
s:"If two bodies are each in thermal equilibrium with a third, they are in thermal equilibrium with each other.",
eq:"A ~ C  and  B ~ C   ⇒   A ~ B      (~ : no net heat flow on contact)",
origin:`The idea was used silently by everyone who ever trusted a thermometer, but it was only named in the 1930s. Ralph H. Fowler gave it the label "zeroth" because the first and second laws already had their numbers, yet logically this one comes first: without it, temperature is not a well-defined quantity at all.`,
intuition:`A thermometer is the "third body". You do not compare the soil with the air directly; you let a probe settle in the soil, read it, then let it settle in the air. The zeroth law guarantees that the two readings can be compared.`,
skim:`The law makes temperature a property of a state. It turns "hotter than" into a number on a single scale.`,
math:`Thermal equilibrium is an equivalence relation: reflexive, symmetric and transitive. The equivalence classes are the isotherms, and any monotonic labelling of them is an empirical temperature. The second law later fixes a particular labelling, the absolute (Kelvin) scale.`,
field:`Every soil temperature log assumes the sensor has equilibrated with the soil around it. A probe pushed into cold clay takes minutes to settle, and a sensor in a sunlit housing is in equilibrium with its housing, not the soil. Response time and radiation shielding are practical zeroth-law problems.`,
limits:`The law speaks only about equilibrium. A soil profile on a sunny afternoon is not in equilibrium: temperature varies with depth and time, and "the soil temperature" is a field, not a single number.`,
links:["th1","th2","fourier","stefan"],
read:[["R. H. Fowler & E. A. Guggenheim, Statistical Thermodynamics (1939)","where the name appears"],["H. Chang, Inventing Temperature (2004)","how thermometry was built"],["D. Hillel, Introduction to Environmental Soil Physics (2004)","soil thermal regime"]]},

{id:"th1",sym:"1T",f:"phys",name:"First law of thermodynamics",yr:"1842–1850",full:1,
s:"Energy is conserved. The change in a system's internal energy equals the heat added to it minus the work it does.",
eq:"ΔU = Q − W\nSurface energy balance:  Rₙ = G + H + λE",
origin:`Julius Robert Mayer (1842), a ship's doctor, argued that heat and work are interconvertible after noticing that sailors' venous blood was redder in the tropics. James Joule measured the mechanical equivalent of heat with falling weights and paddle wheels in the 1840s. Hermann von Helmholtz generalised the principle in 1847, and Rudolf Clausius gave it the modern form in 1850.`,
intuition:`Energy is an account book. It can move between columns (heat, work, chemical energy, motion) but the total never changes. Any "missing" energy has gone somewhere you are not measuring.`,
skim:`Conservation of energy is the bookkeeping rule behind every energy budget, from a steam engine to a field.`,
math:`For a closed system, dU = δQ − δW. U is a state function; Q and W depend on the path. At constant pressure the useful quantity is enthalpy, H = U + pV, and ΔH = Q_p. Hess's law follows directly: reaction enthalpies add because H is a state function.`,
field:`At the land surface, net radiation Rₙ is split between ground heat flux G, sensible heat H and latent heat of evaporation λE. Eddy covariance towers measure H and λE; the imbalance that remains (often 10–30 %) is a well-known measurement problem. Evapotranspiration, frost depth, and snowmelt timing all come from this one balance.`,
limits:`The law says nothing about direction. It permits heat to flow from cold to hot, as long as the books balance. Direction is the job of the second law.`,
links:["th0","th2","hess","mass","stefan","fourier"],
read:[["J. P. Joule, On the Mechanical Equivalent of Heat (1850)","original measurement"],["T. Foken, Micrometeorology (2017)","energy-balance closure"],["G. S. Campbell & J. M. Norman, An Introduction to Environmental Biophysics (1998)",""]]},

{id:"th2",sym:"2T",f:"phys",name:"Second law of thermodynamics",yr:"1824–1865",full:1,
s:"In an isolated system, entropy never decreases. Heat flows spontaneously from hot to cold, never the reverse.",
eq:"dS ≥ δQ / T\nΔG = ΔH − TΔS   (ΔG < 0: spontaneous at constant T, p)",
origin:`Sadi Carnot (1824) analysed the ideal heat engine before anyone understood heat as energy. Clausius (1850) and William Thomson, Lord Kelvin (1851) stated the law in two equivalent forms. Clausius coined "entropy" in 1865. Boltzmann later gave it a statistical meaning: S = k ln W, the logarithm of the number of microstates.`,
intuition:`Order is improbable. A dropped bag of sugar spreads across the floor; it never gathers itself back into the bag. Ordered states exist only while something pays for them with an energy flow.`,
skim:`The law gives time a direction and explains why every real process has losses.`,
math:`For a reversible process dS = δQ_rev / T; for an irreversible one, dS > δQ / T. Combining both laws at constant temperature and pressure gives the Gibbs free energy, G = H − TS. A reaction runs spontaneously when ΔG < 0, and ΔG° = −RT ln K links thermodynamics to equilibrium constants.`,
field:`Soil organic matter is a low-entropy store of solar energy. Its decomposition to CO₂ is thermodynamically downhill, so the question in carbon farming is never "can it decompose" but "what slows it down": mineral protection, freezing, waterlogging. Living soils are open systems that keep their structure only through a continuous flux of photosynthate.`,
limits:`The law is statistical. It is exact for macroscopic systems but says nothing about rates. A thermodynamically favourable reaction can be kinetically frozen for millennia, as peat shows.`,
links:["th1","th3","gibbs","arrhenius","lindeman","redox"],
read:[["S. Carnot, Reflections on the Motive Power of Fire (1824)","short and readable"],["E. Schrödinger, What is Life? (1944)","organisms and negative entropy"],["P. Atkins, The Laws of Thermodynamics: A Very Short Introduction (2010)",""]]},

{id:"th3",sym:"3T",f:"phys",name:"Third law of thermodynamics",yr:"1906–1912",full:1,
s:"The entropy of a perfect crystal approaches zero as the temperature approaches absolute zero, and absolute zero cannot be reached in a finite number of steps.",
eq:"lim (T→0) S = 0      (perfect crystal)\nS°(T) = ∫₀ᵀ (Cₚ / T) dT",
origin:`Walther Nernst proposed his "heat theorem" in 1906 while trying to predict chemical equilibria from heat measurements alone. Max Planck sharpened it in 1911 to say the entropy itself goes to zero. Nernst received the 1920 Nobel Prize in Chemistry for this work.`,
intuition:`At absolute zero a perfect crystal has exactly one way to arrange itself. One arrangement means zero uncertainty, so zero entropy. Every step of cooling gets you closer, but each step removes less than the one before.`,
skim:`The third law gives entropy an absolute zero point, so entropies can be tabulated.`,
math:`Because S → 0 at T = 0, absolute entropies can be measured by integrating heat capacity data upward from near zero. Those tabulated S° values, together with enthalpies of formation, give ΔG° for any reaction without having to measure the equilibrium directly.`,
field:`Its relevance to soil is indirect but real. Mineral solubility products, the stability of iron oxides, and the equilibria behind pH and redox diagrams are computed from tabulated ΔG° values, and those tables exist because of the third law. Ice is an interesting exception: it keeps a "residual entropy" at 0 K because its hydrogen atoms stay disordered (Pauling, 1935).`,
limits:`Glasses, disordered solids and ice do not reach zero entropy. The law applies strictly only to perfect, internally equilibrated crystals.`,
links:["th2","gibbs","massaction","elements"],
read:[["W. Nernst, The New Heat Theorem (1926, English translation)",""],["L. Pauling, J. Am. Chem. Soc. 57 (1935)","residual entropy of ice"],["W. Stumm & J. Morgan, Aquatic Chemistry (1996)","using thermodynamic data"]]},

{id:"lechatelier",sym:"Lc",f:"chem",name:"Le Chatelier's principle",yr:"1884",full:1,
s:"When a system at equilibrium is disturbed, it shifts in the direction that partly counteracts the disturbance.",
eq:"CaCO₃ + 2 H⁺ ⇌ Ca²⁺ + CO₂ + H₂O\nNH₄⁺ ⇌ NH₃(g) + H⁺",
origin:`Henry Louis Le Chatelier, a French chemist working on cements and furnaces, stated the principle in 1884. Karl Ferdinand Braun reached it independently in 1887, so it is sometimes called the Le Chatelier–Braun principle. Le Chatelier later applied it to ammonia synthesis, and Fritz Haber's high-pressure process is its most famous industrial use.`,
intuition:`Equilibrium behaves like a stubborn spring. Push on it and it pushes back, though never all the way to where it started.`,
skim:`Add a product and the reaction runs backward; remove a product and it runs forward.`,
math:`The principle is a qualitative reading of the equilibrium constant. If Q is the reaction quotient, the system moves until Q = K. Adding product raises Q above K, so the reaction runs backward. Temperature is different: it changes K itself, following the van 't Hoff equation, d ln K / dT = ΔH° / RT².`,
field:`Liming is the classic case. Lime dissolves by consuming H⁺, and CO₂ escapes as a gas, which pulls the reaction forward. In wet, CO₂-rich soil the escape is slower and lime dissolves more slowly. The ammonia equilibrium explains why surface-applied manure and urea lose more nitrogen at high pH and warm temperatures: fewer H⁺ ions push NH₄⁺ toward volatile NH₃.`,
limits:`The principle can mislead. Adding an inert gas at constant volume does not shift a gas equilibrium, and adding a reactant can sometimes shift the system in the "wrong" direction in multi-component gas mixtures. It says nothing about how fast the shift happens. Always fall back on Q versus K.`,
links:["massaction","gibbs","ph","henry","th2","jevons","haber","birkeland"],
read:[["H. L. Le Chatelier, Comptes Rendus 99 (1884)","original statement"],["J. de Heer, J. Chem. Educ. 34 (1957)","on its failures"],["N. C. Brady & R. R. Weil, The Nature and Properties of Soils","liming chapter"]]},

{id:"ph",sym:"pH",f:"chem",name:"pH and acidity",yr:"1909",full:1,
s:"pH is the negative base-10 logarithm of hydrogen-ion activity. Each unit is a tenfold change in acidity.",
eq:"pH = −log₁₀ a(H⁺)\nKw = a(H⁺)·a(OH⁻) = 10⁻¹⁴ at 25 °C",
origin:`Søren Sørensen introduced the scale in 1909 at the Carlsberg Laboratory in Copenhagen, where enzyme activity in brewing depended sharply on acidity. Svante Arrhenius (1887) had defined acids as H⁺ producers; Brønsted and Lowry (1923) broadened this to proton donors and acceptors.`,
intuition:`pH is a pressure gauge for protons. Low pH means protons are crowding to get out, and they will push other cations off surfaces and dissolve minerals.`,
skim:`Soil pH controls nutrient availability, aluminium toxicity, and microbial activity more than any other single number.`,
math:`A pH electrode responds to activity, not concentration, through the Nernst equation: about 59 mV per pH unit at 25 °C. For a weak acid, the Henderson–Hasselbalch equation pH = pKa + log([A⁻]/[HA]) gives buffering behaviour. Soil buffering comes mostly from exchange sites and aluminium hydrolysis, not dissolved acids.`,
field:`Soil pH is always reported with its method. pH in water reads higher than pH in 0.01 M CaCl₂ or 1 M KCl, because salt solutions push exchangeable H⁺ and Al³⁺ into solution. Finnish soil tests report pH in water. Below roughly pH 5.5 in water, Al³⁺ becomes soluble and harms roots. pH also drives phosphorus fixation, molybdenum availability, and the NH₃ losses described under Le Chatelier.`,
limits:`pH measures intensity, not quantity. Two soils at the same pH can need very different amounts of lime because their buffer capacity differs. In soil suspensions, the "suspension effect" and junction potentials add method-dependent offsets.`,
links:["lechatelier","hh","redox","cec","elements","nernst","lyotropic"],
read:[["S. P. L. Sørensen, Biochem. Z. 21 (1909)","original paper"],["J. S. Rowell, Soil Science: Methods and Applications (1994)",""],["M. E. Sumner (ed.), Handbook of Soil Science","soil acidity"]]},

{id:"redox",sym:"Eh",f:"chem",name:"Redox and the redox ladder",yr:"1889–",full:1,
s:"Reduction and oxidation are electron transfers. In soil, microbes use electron acceptors in a predictable order as oxygen runs out.",
eq:"Eh = E° − (RT / nF) · ln Q\npe = −log a(e⁻) ≈ Eh(mV) / 59.2",
origin:`Lavoisier's chemistry was built around oxygen, which gave "oxidation" its name. The electron-transfer view came after the electron's discovery (1897). Walther Nernst's 1889 equation linked electrode potential to concentrations. In the 20th century, rice-paddy and wetland researchers such as W. H. Patrick mapped the sequence of reductions in flooded soils.`,
intuition:`Microbes are spending electrons from organic matter. They pay the best-rewarding acceptor first, and move down the list only when it is used up, like a shopper who spends the largest bill first.`,
skim:`When soil floods, oxygen goes first, then nitrate, manganese, iron, sulfate, and finally CO₂ becomes methane.`,
math:`The redox ladder at pH 7 (approximate Eh where each process becomes important):\n• O₂ reduction: above +330 mV\n• NO₃⁻ → N₂O, N₂ (denitrification): about +220 mV\n• Mn(IV) → Mn²⁺: about +200 mV\n• Fe(III) → Fe²⁺: about +120 mV\n• SO₄²⁻ → H₂S: about −150 mV\n• CO₂ → CH₄ (methanogenesis): below −250 mV\nThe order follows the free energy yield per electron, ΔG = −nFE.`,
field:`Grey and mottled gley colours record where iron was reduced and moved. Waterlogged compacted spots are hotspots of N₂O from incomplete denitrification. Rewetted peatlands cut CO₂ but can emit CH₄ until the redox regime stabilises. Controlled drainage tunes the water table, and with it, which rung of the ladder the soil sits on.`,
limits:`Platinum electrodes give unreliable readings in oxic soils because the system is poorly poised. Soils are full of anaerobic microsites, so denitrification can run inside an aggregate while the bulk soil is aerated. Redox in soil is a kinetic, microbial process, rarely at equilibrium.`,
links:["nernst","ph","gibbs","henry","fick","th2","cn","denitrif","n2o"],
read:[["W. H. Patrick & A. Jugsujinda, Soil Sci. Soc. Am. J. 56 (1992)","sequential reduction"],["K. R. Reddy & R. D. DeLaune, Biogeochemistry of Wetlands (2008)",""],["J. W. Fiedler et al., Soil Sci. Soc. Am. J. 71 (2007)","measuring Eh in soil"]]},

{id:"elements",sym:"Pt",f:"chem",name:"The periodic law and the elements",yr:"1869",full:1,
s:"The properties of the elements repeat periodically when they are ordered by atomic number.",
eq:"17 essential plant elements:\nC H O · N P K · Ca Mg S · Fe Mn Zn Cu B Mo Cl Ni",
origin:`Dmitri Mendeleev published his table in 1869 and left gaps for elements not yet found, predicting the properties of gallium, scandium and germanium, all discovered within 17 years. Lothar Meyer published a similar table in 1870. Henry Moseley showed in 1913 that the true ordering number is nuclear charge, the atomic number, not atomic mass.`,
intuition:`The table is a map of how atoms hold their outer electrons. Elements in the same column behave alike because their outer shells look alike.`,
skim:`Charge and size, read off the table, predict how an element behaves in soil.`,
math:`Periodicity comes from quantum mechanics: electron shells fill in the order 1s, 2s, 2p, 3s, 3p, 4s, 3d. From position you can predict valence, ionic radius and electronegativity. The ionic potential (charge ÷ radius) sorts elements into soluble cations (Na⁺, K⁺, Ca²⁺), hydrolysing cations (Al³⁺, Fe³⁺), and soluble oxyanions (NO₃⁻, SO₄²⁻, MoO₄²⁻).`,
field:`Eight elements make up about 98 % of the Earth's crust, led by O, Si, Al and Fe. Plant nutrition draws on 17 essential elements, and the law of the minimum asks which one is short. Periodic neighbours compete: cadmium mimics zinc and enters crops through the same uptake routes; potassium and ammonium have similar sizes and share fixation sites in clay interlayers.`,
limits:`The periodic law is a pattern, not an explanation; the explanation is quantum mechanics. Chemistry in soil also depends on speciation, complexation and kinetics, which the table does not show.`,
links:["minimum","ph","cec","lyotropic","goldich","isotope"],
read:[["D. Mendeleev, Z. Chem. 12 (1869)","original table"],["E. Scerri, The Periodic Table: Its Story and Its Significance (2019)",""],["H. Marschner, Mineral Nutrition of Higher Plants (2012)",""]]},

{id:"minimum",sym:"Sp",f:"soil",name:"Law of the minimum (Sprengel–Liebig)",yr:"1828 / 1840",full:1,
s:"Growth is controlled by the scarcest essential resource, not by the total of resources available.",
eq:"Y = min( f₁(N), f₂(P), f₃(K), … , f(water), f(light) )",
origin:`Carl Sprengel stated the principle in 1828, as part of his mineral theory of plant nutrition, overturning the humus theory that plants feed on organic matter. Justus von Liebig popularised it from 1840, often without crediting Sprengel. Since 1955 the German agricultural research association has called it the Sprengel–Liebig law. The famous barrel with staves of different heights is a later teaching device.`,
intuition:`A barrel holds water only up to its shortest stave. Lengthening any other stave does nothing.`,
skim:`Fertilise the limiting nutrient; adding more of anything else is wasted.`,
math:`The strict form is a minimum function: yield responds linearly to the limiting factor until another factor takes over (the "linear-plateau" model). Mitscherlich (1909) proposed instead a smooth curve of diminishing returns, y = A(1 − e^(−cx)). Field data often fit somewhere between, because nutrients interact and plants partly compensate.`,
field:`On Finnish acid soils, molybdenum can limit legumes even when nitrogen fixation looks fine on paper, because Mo availability falls at low pH. Boron limits turnip rape and clover on many soils. In nitrogen management the principle has a sharp corollary: nitrogen applied above what the limiting factor allows is surplus that can leach or turn into N₂O.`,
limits:`Co-limitation is common: nitrogen and phosphorus often limit together, and adding one raises the response to the other. Plants also reallocate roots toward the scarce resource. The law describes a single plant or crop; ecosystems and markets add trade-offs it does not capture.`,
links:["mitscherlich","shelford","elements","redfield","cn","jevons","ph","nleach"],
read:[["C. Sprengel, J. Tech. Ökon. Chem. 3 (1828)","original article"],["R. R. van der Ploeg et al., Soil Sci. Soc. Am. J. 63 (1999)","Sprengel's priority"],["W. S. Harpole et al., Ecol. Lett. 14 (2011)","co-limitation"]]},

{id:"jevons",sym:"Jv",f:"env",name:"Jevons paradox",yr:"1865",full:1,
s:"Making the use of a resource more efficient can increase its total consumption, because efficiency lowers the effective price.",
eq:"Total use = use per unit × units demanded\nRebound R = (expected saving − actual saving) / expected saving\nR > 100 %: backfire",
origin:`William Stanley Jevons argued in The Coal Question (1865) that James Watt's more efficient steam engine had increased Britain's coal use, because it made steam power cheap enough for new industries. Daniel Khazzoom and Leonard Brookes revived the argument for energy policy in the 1980s (the Khazzoom–Brookes postulate).`,
intuition:`A better engine makes each journey cheaper, so people make more journeys. Whether total fuel use falls depends on how strongly demand responds to the lower cost.`,
skim:`Efficiency gains save resources only if something caps total use.`,
math:`The size of the rebound depends on the price elasticity of demand. Direct rebound is extra use of the same service; indirect rebound is the money saved spent on other resource use; economy-wide rebound includes growth effects. When the combined rebound exceeds 100 %, efficiency increases total use.`,
field:`Irrigation is the best-documented agricultural case: drip systems use less water per hectare, but farmers often expand irrigated area, so basin-level water use rises (Grafton et al., 2018). The same logic applies to fertiliser efficiency, cheaper drone or sensor data, and land-sparing arguments for high-yield farming. For MRV and policy, it means efficiency targets need a cap or a price on the resource itself.`,
limits:`Backfire is not inevitable. For mature services with saturated demand (home lighting in rich countries), rebound is often small. The paradox is an empirical question to measure, not a law of nature.`,
links:["ipat","ekc","commons","goodhart","minimum","boundaries","lechatelier"],
read:[["W. S. Jevons, The Coal Question (1865)","chapter VII"],["R. Q. Grafton et al., Science 361 (2018)","the paradox of irrigation efficiency"],["S. Sorrell, Energy Policy 37 (2009)","review of rebound evidence"]]},

{id:"darcy",sym:"Dc",f:"phys",name:"Darcy's law",yr:"1856",full:1,
s:"Water flow through a saturated porous medium is proportional to the gradient of total hydraulic head and to the medium's hydraulic conductivity.",
eq:"q = −K · dH/dz,   H = h + z (pressure head + elevation)\nmean pore velocity v ≈ q / θ",
origin:`Henry Darcy, chief engineer of the city of Dijon, built its public water supply and tested sand filters to purify it. In his 1856 report Les fontaines publiques de la ville de Dijon he showed that the flow through a sand column is proportional to the head drop and inversely proportional to the column length. Charles Slichter (1899) generalised the law to three dimensions, q = −K∇H, and M. King Hubbert (1940, 1956) clarified its physical basis in viscous flow.`,
intuition:`Think of water pushed through a maze. A greater push (head difference) gives more flow, wider passages (higher conductivity) give more flow, and a longer maze gives less. Water does not simply flow downward or from wet to dry: it flows wherever total head decreases.`,
skim:`Flux equals conductivity times the gradient of total head.`,
math:`• q = −K dH/dz, where H = pressure head h + elevation z; only differences in H matter, so the reference level is arbitrary.\n• q is a flux per total cross-section. Water moves only through pores, so the mean pore velocity is about q/θ, and the path is longer than the column (tortuosity).\n• K = kρg/μ: intrinsic permeability k of the medium times fluid properties. Because viscosity falls with temperature, K for water roughly doubles between 5 °C and 35 °C.\n• Darcy's law has the same form as Ohm's law (current), Fourier's law (heat) and Fick's law (diffusion).`,
field:`Darcy's law underlies drain spacing formulas such as Hooghoudt's, ditch and drainage design, seepage under dams, and permeameter and infiltration measurements of Ksat. Saturated conductivity varies over orders of magnitude within a single field, mostly because of macropores: earthworm channels, cracks and old root channels. It also explains why water can flow upward toward drains or under artesian pressure.`,
limits:`The law assumes laminar, viscous flow. It holds in silts and finer soils at normal gradients but can fail in gravel, around wells and in large macropores. Swelling clays change their conductivity as they wet. Ksat measured on small cores often fails to represent a field, because a sample must be larger than the representative elementary volume. Unsaturated flow needs K to vary with suction, which leads to the Richards equation.`,
links:["richards","capillarity","fick","fourier","ohm","stokes","mass"],
read:[["H. Darcy, Les fontaines publiques de la ville de Dijon (1856)","original report"],["M. K. Hubbert, Transactions AIME 207 (1956)","Darcy's law and the field equations"],["D. Hillel, Environmental Soil Physics (1998), ch. 7",""]]},
{id:"richards",sym:"Ri",f:"phys",name:"Richards equation",yr:"1931",full:1,
s:"The Richards equation extends Darcy's law to unsaturated soil, where conductivity depends strongly on matric suction, and combines it with mass conservation to describe how water content changes in time and depth.",
eq:"∂θ/∂t = ∂/∂z [ K(h) (∂h/∂z + 1) ] − S\nPhilip infiltration:  I = S·t^½ + A·t",
origin:`Edgar Buckingham (1907) introduced the capillary potential and the idea that unsaturated conductivity depends on soil wetness. Lorenzo A. Richards (1931), in "Capillary conduction of liquids through porous mediums", combined this Buckingham–Darcy flux with the continuity equation. John Philip (1957) found analytical solutions for infiltration, and numerical models such as HYDRUS and SWAP made the equation the standard engine of soil-water simulation from the 1970s on.`,
intuition:`In unsaturated soil, water travels only through the pores that are still full. As soil dries, the largest pores empty first, so the remaining paths become thin, few and tortuous, and conductivity falls by orders of magnitude. That is why soils wet quickly but dry slowly.`,
skim:`Darcy's law for partly dry soil, where conductivity collapses as the soil dries.`,
math:`• ∂θ/∂t = ∂/∂z [K(h)(∂h/∂z + 1)] − S, with S a sink for root water uptake.\n• K(h) and θ(h) vary over several orders of magnitude, so the equation is strongly nonlinear and is normally solved numerically.\n• Retention and conductivity are usually described with van Genuchten–Mualem functions, whose parameters are often estimated by inverse modelling.\n• For ponded infiltration, Philip's solution I = S·t^½ + A·t is dominated by sorptivity S early on and by gravity later, so the infiltration rate falls toward roughly Ksat.`,
field:`The equation predicts wetting fronts, redistribution after rain, capillary rise from a water table, the stages of evaporation, and root water uptake. It is the engine of drainage, irrigation and nitrate-leaching models. Hillel shows that "field capacity" is not a fixed state but a slow phase of Richards redistribution, which in silt loam can continue for months.`,
limits:`The equation assumes Darcian flow through a rigid, continuous porous medium. Preferential flow through macropores, unstable fingering in sands, hysteresis, swelling clays and freezing all violate this, so dual-permeability or other extended models are needed. Parameters measured on laboratory cores often fail at the field scale.`,
links:["darcy","capillarity","mass","fick","inversion","equifinality"],
read:[["L. A. Richards, Physics 1 (1931)","Capillary conduction of liquids through porous mediums"],["M. Th. van Genuchten, Soil Science Society of America Journal 44 (1980)","retention and conductivity functions"],["D. Hillel, Environmental Soil Physics (1998), ch. 8 and 16",""]]},

{id:"fisher",sym:"Fi",f:"meth",name:"Fisher's principles of field experiments",yr:"1925–1935",full:1,
s:"A field trial can separate a treatment effect from soil and weather variation only if treatments are replicated, randomly allocated, and compared within blocks of similar ground.",
eq:"Yield = μ + block + treatment + error\nSE of a difference = √(2·MSE / r)",
origin:`Ronald A. Fisher joined Rothamsted Experimental Station in 1919 to analyse the records of experiments that John Bennet Lawes and Joseph Henry Gilbert had begun in 1843, including the Broadbalk wheat experiment. He found that the systematic plot layouts then in use gave no valid estimate of experimental error. In Statistical Methods for Research Workers (1925), "The arrangement of field experiments" (1926) and The Design of Experiments (1935) he set out three principles, replication, randomisation and local control (blocking), together with the analysis of variance to evaluate them.`,
intuition:`Soil varies from metre to metre. If all the fertilised plots happen to lie on the better end of the field, the soil gets the credit. Replication measures how much plots differ by chance. Randomisation makes sure that chance is not lined up with a treatment. Blocking removes the large-scale gradient before the comparison is made.`,
skim:`Replicate to measure the noise, randomise to keep it unbiased, and block to make it smaller.`,
math:`In a randomised complete block design with t treatments and r blocks, the total sum of squares splits into block, treatment and error parts, with (t−1)(r−1) error degrees of freedom.\n• The F ratio, treatment mean square divided by error mean square, tests whether treatment differences exceed plot-to-plot noise.\n• The least significant difference between two means is t_crit × √(2·MSE / r).\n• Because precision grows with √r, halving the LSD needs about four times the replication.`,
field:`Variety and fertiliser-response trials are almost always blocked, with three or four replicates. Blocks should lie across the known gradient (slope, drainage, an old field boundary) so that each block is uniform inside. Guard rows and discarded plot ends reduce edge effects, and only the harvested core of each plot is weighed. Removing the soil and weather signal this way is what lets a trial isolate the treatment.`,
limits:`Subsamples within one plot are not replicates, so the plot that received the treatment is the unit of replication. Randomisation guards against bias, not against bad luck, and a small trial can still mislead. Results apply to the soils and years tested: a three-year trial on clay says little about sand in a drought year.`,
links:["anova","pvalue","pseudorep","smithlaw","broadbalk","power","regmean"],
read:[["R. A. Fisher, J. Ministry of Agriculture 33 (1926)","The arrangement of field experiments"],["R. A. Fisher, The Design of Experiments (1935)",""],["S. H. Hurlbert, Ecological Monographs 54 (1984)","pseudoreplication"]]},

{id:"inversion",sym:"Iv",f:"meth",name:"Inverse problems and inversion modelling",yr:"1902–1963",full:1,
s:"An inversion infers causes (parameters, sources, fluxes) from their observed effects. Because different causes can produce nearly the same observations, the answer needs prior information and comes with uncertainty.",
eq:"d = G(m) + ε\nminimise ‖d − G(m)‖² + λ ‖m − m₀‖²",
origin:`Jacques Hadamard (1902) called a problem well posed if a solution exists, is unique, and changes continuously with the data. Many inverse problems fail the last two conditions. Andrey Tikhonov (1963) showed that adding a penalty that pulls the solution toward prior expectations, now called regularisation, makes them solvable. Bayesian inversion and data assimilation, developed in geophysics and weather forecasting from the 1970s, recast the same idea as combining a prior with the likelihood of the data.`,
intuition:`Forward modelling predicts the shadow of a known object. Inversion guesses the object from its shadow: a ball, a disc and a cylinder seen end-on all cast the same circle. More viewpoints, or knowing beforehand that the object is probably a ball, narrow the answer.`,
skim:`Inversion runs a model backwards. Without prior knowledge, the answer is often not unique.`,
math:`For a linear forward model d = Gm + ε with Gaussian errors, the regularised (Bayesian) estimate is\n• m̂ = (Gᵀ C_d⁻¹ G + C_m⁻¹)⁻¹ (Gᵀ C_d⁻¹ d + C_m⁻¹ m₀)\n• C_m, the prior covariance, plays the role of Tikhonov's λ.\n• The posterior covariance (Gᵀ C_d⁻¹ G + C_m⁻¹)⁻¹ shows which parameters the data actually constrain: where it stays close to the prior, the data say little.`,
field:`Soil hydraulic parameters are estimated by inverting outflow or infiltration experiments, for example with HYDRUS. Ground-penetrating radar and EMI conductivity surveys are inverted to layer depths and properties. Atmospheric inversions infer regional CO₂ fluxes from concentration measurements. Estimating field GPP or NEE from yield, weather and satellite data with a crop model is also an inversion: the yield constrains the cumulative carbon gain, but not its timing or its split into processes.`,
limits:`A good fit does not prove that the parameters are right, because different parameter sets can fit equally well (equifinality). Results depend on the prior and on the forward model, and model error is often larger than measurement error. Report posterior uncertainty, test against data not used in the fit, and check how far the result moves when the prior changes.`,
links:["bayes","equifinality","nee","harvestindex","errorprop","richards","ohm"],

{id:"marginal",sym:"MR",f:"econ",name:"Diminishing marginal returns",yr:"1767 / 1815",who:"Anne-Robert-Jacques Turgot; David Ricardo, Edward West",
s:"Adding equal increments of one input to fixed amounts of the others eventually gives smaller and smaller increments of output.",eq:"MP = dY/dx, falling as x rises",
field:"Each extra 10 kg N/ha gives less extra grain than the previous 10 kg. The same holds for labour, irrigation water and machinery.",
watch:"Diminishing returns are not negative returns. Output can still rise while each increment is worth less than it costs, or more.",
links:["mitscherlich","minimum","optimum","flatpay"]},
{id:"optimum",sym:"EO",f:"econ",name:"Economic optimum input rate",yr:"1826 / 1961",full:1,
s:"Profit from an input is highest where the value of the extra yield from its last unit equals that unit's cost. This rate is always below the rate that maximises yield.",
eq:"dY/dN = p_N / p_Y   (marginal product = price ratio)\nY = a + bN − cN²  ⇒  N* = (b − p_N/p_Y) / 2c",
origin:`Johann Heinrich von Thünen applied marginal reasoning to farm inputs in Der isolierte Staat (1826). Mitscherlich's response curve (1909) gave agronomists a function to work with, and Earl O. Heady and John L. Dillon's Agricultural Production Functions (1961) made the price-ratio rule the standard basis of fertiliser recommendations. In the US Corn Belt, the "maximum return to nitrogen" approach (Sawyer et al., 2006) pools hundreds of trials into regional response curves.`,
intuition:`Keep adding fertiliser as long as the next kilogram brings back more grain value than it costs. Near the top of the curve the extra grain is small, so the last kilograms pay only when fertiliser is cheap relative to grain.`,
skim:`Stop where the extra yield from one more kilogram is worth exactly one kilogram's price.`,
math:`For a quadratic response Y = a + bN − cN², yield peaks at N_max = b / 2c, and profit p_Y·Y − p_N·N peaks at N* = (b − p_N/p_Y) / 2c.\n• Example: Y = 3000 + 30N − 0.1N² (kg/ha). Yield peaks at 150 kg N/ha.\n• If 1 kg N costs as much as 5 kg grain (price ratio 5), N* = (30 − 5)/0.2 = 125 kg N/ha.\n• At a price ratio of 10, N* = 100 kg N/ha.\n• Yield at 125 kg N is 5188 kg/ha, only 62 kg below the maximum of 5250: the profit curve is flat near its peak.`,
field:`Optimum rates differ between fields and years because mineralisation, soil water and weather move the response curve; the price ratio moves the optimum much less. If the environmental cost of surplus nitrogen were priced into p_N, the optimum would fall further. The response is only known after harvest, so recommendations are based on average curves from many site-years.`,
limits:`The optimum depends on the model fitted to the trial data: a quadratic curve usually gives a higher optimum than a linear-plateau or quadratic-plateau curve fitted to the same data. Because the profit curve is flat, the exact optimum matters less for profit than for nitrogen losses. Average curves can be far from the optimum of any single field.`,
links:["mitscherlich","marginal","flatpay","voi","minimum","pigou","npv"],
read:[["E. O. Heady & J. L. Dillon, Agricultural Production Functions (1961)",""],["M. E. Cerrato & A. M. Blackmer, Agronomy Journal 82 (1990)","choice of response model"],["D. J. Pannell, Review of Agricultural Economics 28 (2006)","flat payoff functions"]]},
{id:"flatpay",sym:"Fp",f:"econ",name:"Flat payoff functions",yr:"2006",who:"David J. Pannell",
s:"Near the optimum, profit changes very little as the input rate changes, so a wide range of rates gives almost the same profit.",eq:"dπ/dN = 0 at N*  ⇒  π(N* ± Δ) ≈ π(N*) − ½|π''|Δ²",
field:"Being 20–30 kg N/ha away from the economic optimum usually costs little money. The stronger case for precise rates is fewer surplus nutrients, not higher profit.",
watch:"Precise targeting of the economic optimum does not usually pay much in profit. Its value lies mostly in reduced losses and risk.",

{id:"npv",sym:"PV",f:"econ",name:"Discounting and net present value",yr:"1849 / 1930",full:1,
s:"A euro in the future is worth less than a euro today, so investments are compared by discounting their future costs and benefits to the present.",
eq:"NPV = Σ (B_t − C_t) / (1 + r)ᵗ\nAnnuity:  A = H · r(1 + r)ⁿ / ((1 + r)ⁿ − 1)",
origin:`Martin Faustmann's formula for the value of forest land (1849) was an early use of discounting in land management and is still used in forestry. Irving Fisher's The Rate of Interest (1907) and The Theory of Interest (1930) gave discounting its economic foundation. Cost–benefit analysis based on net present value became standard for public water projects after the US Flood Control Act of 1936, and later for drainage and irrigation investments everywhere.`,
intuition:`Money available now can earn interest, and the future is uncertain, so a benefit 30 years away counts for less than the same benefit today. At 5 % interest, €100 received in 30 years is worth about €23 today.`,
skim:`Convert all future costs and benefits to today's value, then compare.`,
math:`• Present value of a single future amount: PV = F / (1 + r)ᵗ.\n• An annuity spreads an investment H into equal yearly payments over n years: A = H · r(1 + r)ⁿ / ((1 + r)ⁿ − 1).\n• Subsurface drainage at €1800/ha, written off over 30 years at 5 %, costs about €117/ha per year.\n• A higher discount rate raises the annuity and favours options whose benefits come early.`,
field:`Paasonen-Kivekäs et al. (2016) show farm-level drainage calculations. With support and maintenance, annual cost was about €110/ha (c. 2000 prices), set against yield gains, labour savings and avoided maintenance of open ditches. For renewal of failing drains, avoiding 30 % yield losses covered the cost. Liming, soil carbon building and peatland rewetting are also long-horizon investments where the discount rate largely decides the answer.`,
limits:`The result depends strongly on the discount rate, which is a choice rather than a measurement. Rare bad years must be counted: one total crop failure from wetness in ten years equals a 10 % average yield loss. NPV says nothing about who gains and who pays, and societal benefits such as reduced nutrient loads are hard to express in money.`,

/* ===== Nitrogen processes ===== */
{id:"nmin",sym:"Nm",f:"soil",name:"Nitrogen mineralisation",yr:"1954 / 1972",full:1,
s:"Mineralisation is the microbial conversion of organic nitrogen into ammonium as microbes decompose organic matter for energy. It is the soil's own nitrogen supply to crops.",
eq:"Organic N → NH₃ / NH₄⁺   (ammonification)\nN_min(t) = N₀ (1 − e^(−k t))",
origin:`Nineteenth-century chemists argued over whether crops took nitrogen from air or soil; Lawes and Gilbert's Rothamsted plots of the 1850s showed that soil and fertiliser nitrogen set yields. Selman Waksman's work in the 1920s tied the release of nitrogen to the decomposition of organic matter and its C:N ratio. Kirkham and Bartholomew (1954) used ¹⁵N pool dilution to separate gross mineralisation from simultaneous immobilisation, and Stanford and Smith (1972) described the soil's mineralisable pool N₀ with first-order kinetics.`,
intuition:`Microbes eat organic matter for its carbon and energy. When their food contains more nitrogen than they need to build their own cells, they excrete the surplus as ammonium, much as an animal excretes the nitrogen of a protein-rich meal.`,
skim:`Decomposers release the nitrogen they do not need, as ammonium.`,
math:`• First-order model: N_min(t) = N₀ (1 − e^(−kt)), where N₀ is potentially mineralisable N and k a rate constant that rises with temperature (Q₁₀ ≈ 2) and moisture up to about 60 % water-filled pore space.\n• Gross mineralisation and immobilisation run at the same time; only their difference, net mineralisation, adds to the plant-available pool.\n• Roughly 1–3 % of soil organic N is mineralised per year. In a Finnish field with 6000 kg organic N/ha in the root zone, 1 % is 60 kg N/ha.`,
field:`More than 90 % of topsoil nitrogen is organic, and only a few per cent is mineral at any time. In Finnish barley fields, growing-season mineralisation of 30–50 kg N/ha in the top metre has been measured, about half of what an average crop takes up, and a further 0–30 kg N/ha is released between harvest and the next spring, when no crop is there to use it (Paasonen-Kivekäs et al. 2016, pp. 192, 195). Ammonification continues under aerobic and anaerobic conditions and even in nearly frozen soil. Flushes follow rewetting of dry soil, thawing, tillage and ploughing of grass leys.`,
limits:`Mineralisation cannot be read from total N or a single soil test: it depends on temperature, moisture, aeration and the quality of recent residues, so it varies greatly from year to year. Laboratory incubations of sieved soil overestimate field rates, because sieving breaks aggregates and releases protected organic matter. A rising soil-nitrate value may reflect slower uptake or leaching rather than faster mineralisation.`,
links:["nimmob","cn","nitrif","arrhenius","priming","som","nleach","bnf"],
read:[["G. Stanford & S. J. Smith, Soil Science Society of America Proceedings 36 (1972)","nitrogen mineralisation potential"],["M. Paasonen-Kivekäs et al. (eds.), Maan vesi- ja ravinnetalous (2016), section 4.6","Finnish data"],["N. C. Brady & R. R. Weil, The Nature and Properties of Soils, ch. 13",""]]},

{id:"nimmob",sym:"Ni",f:"soil",name:"Nitrogen immobilisation",yr:"1958",full:1,
s:"Immobilisation is the uptake of mineral nitrogen into microbial cells. It happens when decomposers need more nitrogen than their food provides, and it competes directly with crops.",
eq:"NH₄⁺ / NO₃⁻ → microbial organic N\nN demand ≈ C(assimilated) / (C:N)(microbe) − N(substrate)",
origin:`Kirkham and Bartholomew's isotope work (1954) showed that mineralisation and immobilisation run side by side. Sten Jansson (1958) built this into the concept of mineralisation–immobilisation turnover: soil mineral N is constantly cycled through the microbial biomass, and only the net balance reaches the plant.`,
intuition:`A microbe feeding on straw has plenty of carbon but too little nitrogen to build its proteins. It takes the shortfall from the soil solution, competing with roots, which usually lose in the short term because microbes are faster and closer to the nitrogen.`,
skim:`Microbes feeding on nitrogen-poor residues take mineral nitrogen from the soil.`,
math:`• Worked example: 1 t of straw holds about 450 kg C and, at C:N 80, about 5.6 kg N.\n• If microbes assimilate 30 % of the carbon they use (135 kg C) at a biomass C:N of 8, they need about 17 kg N.\n• The shortfall, roughly 11 kg N per tonne of straw, is taken from soil mineral N while that straw decomposes.\n• The tipping point is a residue C:N of about 20–25: below it, net mineralisation; above it, net immobilisation.`,
field:`After straw incorporation, microbes tie up mineral nitrogen, while sugar beet tops and potato haulms, with lower C:N, release it (Paasonen-Kivekäs et al. 2016, p. 203). Immobilisation in autumn can reduce nitrate leaching, but a spring crop sown into decomposing straw may need extra N early. The nitrogen is not lost: it returns to the mineral pool as the microbes die and are grazed, typically over weeks to months.`,
limits:`Immobilisation is not the same as ammonium fixation, in which NH₄⁺ is trapped physically in the interlayers of clay minerals such as vermiculite (Brady & Weil, p. 609). Net figures hide large gross fluxes, and the outcome depends on how fast and how completely residues decompose, not only on their C:N ratio.`,
links:["nmin","cn","redfield","priming","nleach","minimum"],
read:[["S. L. Jansson, Annals of the Royal Agricultural College of Sweden 24 (1958)","mineralisation–immobilisation turnover"],["D. Kirkham & W. V. Bartholomew, Soil Science Society of America Proceedings 18 (1954)","¹⁵N pool dilution"],["Brady & Weil, ch. 13",""]]},

{id:"nitrif",sym:"Nf",f:"soil",name:"Nitrification",yr:"1877 / 1890",full:1,
s:"Nitrification is the two-step microbial oxidation of ammonium to nitrite and then to nitrate. It turns a held, positively charged form of nitrogen into a mobile anion and releases acidity.",
eq:"NH₄⁺ + 1½ O₂ → NO₂⁻ + 2 H⁺ + H₂O\nNO₂⁻ + ½ O₂ → NO₃⁻\nNet: NH₄⁺ + 2 O₂ → NO₃⁻ + 2 H⁺ + H₂O",
origin:`Théophile Schloesing and Achille Müntz (1877) showed that nitrate formation in sewage-irrigated soil stopped when the soil was treated with chloroform vapour, proving it was biological. Sergei Winogradsky (1890) isolated the nitrifying bacteria and showed they live by oxidising inorganic compounds, the first known chemoautotrophs. Ammonia-oxidising archaea were found in 2005, and bacteria that perform both steps alone (comammox) in 2015.`,
intuition:`Nitrifiers live on ammonium the way we live on sugar: they burn it with oxygen for energy and fix CO₂ for carbon. The product, nitrate, is the form of nitrogen that soil cannot hold.`,
skim:`Ammonium is oxidised to nitrate, releasing two H⁺ for each nitrogen.`,
math:`• Two H⁺ per NH₄⁺ nitrified: 1 kg of NH₄⁺-N produces 143 mol H⁺, which would take about 7.1 kg CaCO₃ to neutralise if all the nitrate were leached.\n• When a plant takes up the nitrate, it releases OH⁻ or HCO₃⁻, cancelling part of the acidity; leached nitrate leaves its acidity behind.\n• Optimum activity is near 60 % water-filled pore space and 20–30 °C; below 5 °C it is very slow (Brady & Weil, p. 612).`,
field:`In well-drained arable soils, ammonium from fertiliser, manure and mineralisation is usually nitrified within days to weeks, which is why nitrate dominates soil mineral N (Brady & Weil, p. 613). In cold, wet spring soils, acid sulfate subsoils and forest soils, ammonium accumulates instead (Paasonen-Kivekäs et al. 2016, p. 195). Nitrification inhibitors such as DMPP and DCD slow the first step to reduce leaching and N₂O, and the acidity it produces is a main reason fields need repeated liming.`,
limits:`Nitrification is not the only source of nitrate in water: dissolved organic N and nitrate from deposition also contribute. Its rate depends on oxygen, so it overlaps only narrowly with denitrification, but in aggregated soils both run side by side in neighbouring microsites. Nitrifiers also produce N₂O and NO when oxygen is marginal.`,
links:["nmin","denitrif","nleach","n2o","nox","ph","lechatelier"],
read:[["S. Winogradsky, Annales de l'Institut Pasteur 4 (1890)","isolation of nitrifiers"],["H. Daims et al., Nature 528 (2015)","comammox"],["Brady & Weil, pp. 611–613",""]]},

{id:"denitrif",sym:"Dn",f:"soil",name:"Denitrification",yr:"1882",full:1,
s:"Denitrification is the stepwise microbial reduction of nitrate to nitrite, NO, N₂O and finally N₂, by microbes that use nitrate instead of oxygen to respire organic carbon.",
eq:"NO₃⁻ → NO₂⁻ → NO → N₂O → N₂\n5 CH₂O + 4 NO₃⁻ + 4 H⁺ → 2 N₂ + 5 CO₂ + 7 H₂O",
origin:`Ulysse Gayon and Gabriel Dupetit (1882) showed that bacteria reduce nitrate to nitrogen gas, explaining nitrogen losses from manure and wet soils. The anaerobic oxidation of ammonium with nitrite (anammox) was discovered in a Delft wastewater plant in 1995, and codenitrification by fungi later, so denitrification is now seen as one of several routes from fixed nitrogen back to N₂.`,
intuition:`When oxygen runs out, many soil bacteria switch to the next best electron acceptor, nitrate, like a fire that keeps burning on a different fuel. Each step strips an oxygen from the nitrogen until only gas is left.`,
skim:`Without oxygen, microbes breathe nitrate and turn it into nitrogen gases.`,
math:`• Balanced with organic carbon as electron donor, removing 1 kg N as N₂ consumes about 1.07 kg C, so carbon supply limits the process.\n• It needs microsites with less than about 10 % O₂ in the soil air, has an optimum at 25–35 °C, and runs between 2 and 50 °C (Brady & Weil, p. 614).\n• The end-product ratio shifts toward N₂O at low pH, low carbon, high nitrate and only moderate wetness; very wet, carbon-rich conditions favour N₂.`,
field:`Denitrification is greatest in warm, wet soils with plenty of soluble carbon and pH 6–8, is higher in clays than in coarser soils, and increases with compaction (Paasonen-Kivekäs et al. 2016, p. 196). Losses are episodic: well-drained soils rarely lose more than 5–15 kg N/ha a year, but poorly aerated, heavily fertilised soils have lost 30–60 kg N/ha (Brady & Weil, pp. 616–617). It is harnessed deliberately in wetlands and controlled drainage to remove nitrate from water.`,
limits:`There is no single oxygen level above which it stops, because anaerobic microsites form inside aggregates and around residues. Its rate cannot be inferred from nitrate disappearance alone, since uptake, immobilisation and leaching also remove nitrate. Removal of nitrate from water can trade a water-quality benefit for N₂O emissions.`,
links:["redox","nitrif","n2o","n2","nox","fick","nleach"],
read:[["U. Gayon & G. Dupetit, Comptes Rendus 95 (1882)",""],["A. Mulder et al., FEMS Microbiology Ecology 16 (1995)","discovery of anammox"],["Brady & Weil, pp. 614–618",""]]},

{id:"nh3",sym:"NH₃",f:"soil",name:"Ammonia volatilisation",yr:"1982",full:1,
s:"Ammonia volatilisation is the loss of nitrogen as NH₃ gas from manure, urea and other ammonium sources when conditions push the ammonium–ammonia equilibrium toward the gas.",
eq:"NH₄⁺ + OH⁻ ⇌ NH₃(g) + H₂O\nCO(NH₂)₂ + 2 H₂O + H⁺ → 2 NH₄⁺ + HCO₃⁻   (urea hydrolysis)",
origin:`Farmers have long smelled the nitrogen leaving manure heaps. The process became an environmental issue in the early 1980s, when Nico van Breemen and colleagues (1982) showed that ammonia from intensive livestock farming in the Netherlands, deposited as ammonium, was acidifying forest soils. Ammonia is now regulated under international air-quality agreements because it also forms fine particulate matter.`,
intuition:`Ammonium in water is like a crowd waiting to leave a room: raise the pH, warm the room and open the door to the air (a surface-applied slurry), and more of it leaves as gas. Burying the source or washing it into the soil closes the door.`,
skim:`High pH, warmth and surface application turn ammonium into escaping ammonia gas.`,
math:`• Fraction present as NH₃: f = 1 / (1 + 10^(pKa − pH)), with pKa ≈ 9.25 at 25 °C, rising to about 10 near 0 °C.\n• At pH 7 about 0.6 % is NH₃, at pH 8 about 5 %: roughly tenfold per pH unit below the pKa.\n• Urea hydrolysis by the enzyme urease releases bicarbonate, raising pH around a granule even in acid soils.`,
field:`In Finnish fields, ammonia losses from mineral fertilisers are under 1 kg N/ha a year, but from livestock manure 12–16 kg N/ha (Paasonen-Kivekäs et al. 2016, p. 198). Incorporating manure or fertiliser into the top few centimetres cuts losses by 25–75 %, and about 8 mm of irrigation after surface urea reduced losses in one study from 60 % to 17 % of applied N (Brady & Weil, pp. 610–611). Trailing-shoe and injection application, slurry acidification and urease inhibitors all work on the same equilibrium.`,
limits:`Volatilised ammonia is not gone: it returns as dry and wet deposition, often within tens of kilometres, where it fertilises and acidifies ecosystems not meant to receive it. Soils and plants can also absorb ammonia from the air. Losses are hard to measure on small plots, and wind tunnels and chambers can change the very conditions that drive emission.`,
links:["hh","lechatelier","ph","henry","nitrif","pigou"],
read:[["N. van Breemen et al., Nature 299 (1982)","ammonium deposition and soil acidification"],["Brady & Weil, pp. 609–611",""],["M. A. Sutton et al. (eds.), The European Nitrogen Assessment (2011)",""]]},

{id:"nox",sym:"NOₓ",f:"soil",name:"Soil nitric oxide (NOₓ) emission",yr:"1989",full:1,
s:"Soils emit nitric oxide (NO), mainly as a by-product of nitrification in fairly dry, well-aerated conditions. In the air it forms NO₂, ozone and nitric acid.",
eq:"Flux = N cycling rate × 'leak' fraction\nNO + O₃ → NO₂ + O₂;   NO₂ + sunlight → NO + O",
origin:`Soil NO emissions were measured from the 1970s, but Mary Firestone and Eric Davidson's "hole-in-the-pipe" model (1989) gave them a framework: nitrogen flowing through nitrification and denitrification leaks out as NO and N₂O, and soil moisture sets the size of each leak. H. F. Birch (1958) had described the burst of microbial activity when dry soil is rewetted, which produces large NO pulses.`,
intuition:`Picture nitrogen flowing through a pipe from ammonium to nitrate to N₂. The pipe has two holes, one leaking NO and one N₂O. More flow means more leakage, and soil moisture decides which hole leaks more: in drier soils mostly NO, in wetter soils N₂O.`,
skim:`Nitrification in dry, aerated soil leaks NO, which drives ozone chemistry in the air.`,
math:`• Hole-in-the-pipe: emission = (rate of nitrification + denitrification) × fraction lost as gas.\n• NO dominates at low water-filled pore space (below about 60 %), N₂O at intermediate values, and N₂ in very wet soil.\n• NO is very reactive: it is oxidised to NO₂ within minutes, and part is re-absorbed by the crop canopy before reaching the open atmosphere.`,
field:`Soil emissions are an estimated tenth to a fifth of global NOₓ, and much more over rural areas, where they can control ozone formation. Emissions rise after fertilisation, on warm, dry, recently rewetted soils, and after burning. In Finland's cool, moist climate, soil NO is usually small compared with N₂O, but it adds to the nitrogen that leaves fertilised fields through the air.`,
limits:`NO is hard to measure because it reacts with ozone inside the measurement chamber and is absorbed by leaves. Global estimates rest on few measurements, scaled up with models. NO is not a greenhouse gas itself, but its effect on ozone and particulate matter matters for health and crops.`,
links:["nitrif","denitrif","n2o","redox","boundaries"],
read:[["M. K. Firestone & E. A. Davidson, in Exchange of Trace Gases between Terrestrial Ecosystems and the Atmosphere (1989)","hole-in-the-pipe model"],["E. A. Davidson et al., BioScience 50 (2000)","testing the model"],["Brady & Weil, p. 616",""]]},

{id:"n2o",sym:"N₂O",f:"soil",name:"Nitrous oxide (N₂O) emission",yr:"1970 / 2009",full:1,
s:"Soils emit nitrous oxide as an intermediate of denitrification and a by-product of nitrification. It is a long-lived greenhouse gas and today the main human-made ozone-depleting emission.",
eq:"Direct N₂O-N ≈ EF × N applied   (IPCC default EF = 1 %)\nN₂O = N₂O-N × 44/28;   CO₂-eq = N₂O × 273",
origin:`Paul Crutzen (1970) showed that N₂O reaching the stratosphere forms NO that destroys ozone. As chlorofluorocarbons were phased out, A. R. Ravishankara and colleagues (2009) found N₂O had become the dominant ozone-depleting emission. Agricultural soils were identified as its largest human source, and the IPCC adopted a default emission factor of about 1 % of applied nitrogen.`,
intuition:`N₂O is a half-finished product. When denitrifying microbes are interrupted, by acidity, too little carbon or a burst of oxygen, they stop one step short of harmless N₂ and the intermediate escapes.`,
skim:`Incomplete denitrification and stressed nitrification leak N₂O, a potent and long-lived greenhouse gas.`,
math:`• Worked example: 150 kg N/ha × 1 % = 1.5 kg N₂O-N, which is 2.4 kg N₂O or about 640 kg CO₂-equivalent per hectare (GWP 273).\n• The production source shifts from nitrification to denitrification at about 60–70 % water-filled pore space (Brady & Weil, p. 613).\n• The share of N₂O in the final product, N₂O/(N₂O + N₂), rises at low pH because the N₂O reductase enzyme works poorly in acid soil.`,
field:`In Finnish fields, typically half of the annual N₂O emission occurs between harvest and sowing, including freeze–thaw periods, and drained peat fields emit a great deal (Paasonen-Kivekäs et al. 2016, p. 196). Soil N₂O makes up about 5 % of Finland's greenhouse gas emissions. Emissions are episodic, with most of a year's flux in a few days after rain on warm, freshly fertilised soil (Brady & Weil, pp. 616–617).`,
limits:`A 1 % default hides a range of about 0.1–5 % between soils, climates and years, so field-level claims need local measurements. Chamber measurements miss hot moments if they are not frequent enough. National inventories under the Paris Agreement use the AR5 value of 265 rather than 273 (see Global warming potential). Liming acid soils can lower the N₂O share, and drying a soil reduces denitrification but can increase N₂O from partly aerated microsites.`,
links:["denitrif","nitrif","nox","n2","redox","ph","goodhart","errorprop","gwp"],
read:[["P. J. Crutzen, Quarterly Journal of the Royal Meteorological Society 96 (1970)",""],["A. R. Ravishankara et al., Science 326 (2009)","N₂O as ozone-depleting emission"],["IPCC, 2019 Refinement to the 2006 Guidelines, vol. 4, ch. 11",""]]},

{id:"n2",sym:"N₂",f:"soil",name:"Dinitrogen (N₂) loss",yr:"1772 / 1995",full:1,
s:"Complete denitrification, anammox and codenitrification return reactive nitrogen to the atmosphere as inert N₂. Environmentally harmless, it is still a loss of fertiliser nitrogen, and very hard to measure.",
eq:"NO₃⁻ → … → N₂   (complete denitrification)\nNH₄⁺ + NO₂⁻ → N₂ + 2 H₂O   (anammox)",
origin:`Daniel Rutherford isolated nitrogen in 1772 as the "noxious air" left after burning. Its return from soil to air was recognised once denitrification was described in 1882. Measuring N₂ emission against an atmosphere that is already 78 % N₂ became possible only with ¹⁵N tracer gas-flux methods and incubations in helium–oxygen atmospheres from the 1980s onward.`,
intuition:`N₂ closes the nitrogen cycle: the gas that industry and legumes pull from the air goes back to it. Because the atmosphere is a vast pool of N₂, the loss is invisible, like pouring a cup of water into the sea and trying to measure the rise.`,
skim:`Fully denitrified nitrogen returns to the air as harmless but unmeasurable N₂.`,
math:`• N₂:N₂O ratios commonly range from below 1 in acid or drying soils to 20–100 in warm, wet, carbon-rich soils (Brady & Weil, p. 617).\n• Detection: a field emission of 10 kg N/ha in a day raises N₂ in the soil air by an amount far below the variation in background N₂, so ¹⁵N labelling or N₂-free incubation is needed.\n• In nitrogen budgets, N₂ often hides in the "unaccounted" term: inputs − (crop + leaching + NH₃ + N₂O) − change in soil N.`,
field:`Much of the nitrogen in drainage water moving through streams, wetlands and riparian zones is removed as N₂, which protects lakes and coastal waters. Gaseous nitrogen produced in soil often stays dissolved in soil water until it discharges to surface water (Paasonen-Kivekäs et al. 2016, p. 196). Fungal codenitrification may be the main source of N₂ in grassland soils (Brady & Weil, p. 615).`,
limits:`Because N₂ is so rarely measured, it is often estimated by difference, which loads every other measurement error into it. Promoting complete denitrification to N₂ is the goal for N₂O mitigation, but it still removes plant-available N.`,
links:["denitrif","n2o","redox","mass","errorprop","isotope"],
read:[["K. Butterbach-Bahl et al., Philosophical Transactions B 368 (2013)","processes behind soil N₂O and N₂ emissions"],["Brady & Weil, pp. 614–617",""],["Paasonen-Kivekäs et al. 2016, pp. 196–197",""]]},

{id:"nleach",sym:"NO₃",f:"soil",name:"Nitrate leaching",yr:"1870",full:1,
s:"Nitrate leaching is the downward transport of nitrate with drainage water out of the root zone toward drains, groundwater and surface waters. It is usually the largest nitrogen loss from arable land.",
eq:"Load = concentration × drainage volume\n15 mg NO₃-N/L × 200 mm = 30 kg N/ha\n50 mg NO₃/L = 11.3 mg NO₃-N/L",
origin:`From 1870, John Bennet Lawes, Joseph Henry Gilbert and Robert Warington collected water from drain gauges at Rothamsted, blocks of undisturbed soil from which all drainage was measured, and showed that nitrate was lost in drainage, especially in autumn from bare soil. The EU Nitrates Directive of 1991 made limiting nitrate leaching from agriculture a legal requirement.`,
intuition:`Soil particles are negatively charged, so they hold ammonium but repel nitrate. Nitrate rides with the water wherever it goes. What leaves the field is decided by two things: how much nitrate is in the soil when water drains, and how much water drains.`,
skim:`Water that drains carries nitrate with it; load is concentration times volume.`,
math:`• Load = C × D. 15 mg NO₃-N/L in 200 mm of drainage is 15 g/m³ × 2000 m³/ha = 30 kg N/ha.\n• Mind the units: 50 mg nitrate/L equals 11.3 mg nitrate-N/L.\n• Travel time: with 250 mm drainage a year and 25 % water content, a nitrate front moves about 1 m a year, so groundwater beneath a 10 m unsaturated zone responds to field changes with roughly a decade's delay.`,
field:`Average agricultural N load to Finnish surface waters is about 15 kg N/ha a year (range 12–20), and on well-drained mineral soils nitrate makes up 60–80 % of it (Paasonen-Kivekäs et al. 2016, pp. 202–203). Most of the load comes at snowmelt and in autumn, but heavy rain soon after fertilisation can push drain-water nitrate from 5–10 to over 70 mg/L. Permanent grass leaches least, while ploughing a ley multiplies leaching. Subsurface drainage increased N loads by 52–410 % in the years after installation on one Finnish clay catchment (p. 204).`,
limits:`Nitrate leaching takes counter-cations such as Ca²⁺ and Mg²⁺ with it, acidifying the soil (Brady & Weil, p. 632). Health effects of nitrate in drinking water are still debated, although the 50 mg/L limit is applied as a precaution. Fields with low concentrations can still deliver large loads when drainage is high, and preferential flow in clay can bypass the soil matrix in both directions.`,
links:["nitrif","nmin","mass","darcy","doublelayer","denitrif","minimum","pigou"],
read:[["J. B. Lawes, J. H. Gilbert & R. Warington, Journal of the Royal Agricultural Society of England 17–18 (1881–82)","Rothamsted drain gauges"],["Paasonen-Kivekäs et al. 2016, pp. 199–205",""],["Brady & Weil, pp. 631–634",""]]},
{id:"gwp",sym:"GWP",f:"env",name:"Global warming potential (GWP)",yr:"1990",full:1,
s:"Global warming potential compares greenhouse gases by the extra energy a one-off emission traps over a chosen time horizon, relative to the same mass of CO₂. Multiplying an emission by its GWP gives CO₂-equivalents.",
eq:"GWP_H(x) = ∫₀ᴴ RF_x(t) dt / ∫₀ᴴ RF_CO₂(t) dt\nCO₂-eq = mass of gas × GWP_H",
origin:`The IPCC's First Assessment Report (1990) introduced GWP as a simple way to put different gases on one scale. The Kyoto Protocol (1997) fixed the 100-year horizon and the Second Assessment Report values (CH₄ 21, N₂O 310), and every later assessment revised them: AR4 gave 25 and 298, AR5 28 and 265, and AR6 27.0 for biogenic and 29.8 for fossil methane, and 273 for N₂O. Under the Paris Agreement's transparency framework, national inventories must use the AR5 100-year values unless the parties agree to switch (decisions 18/CMA.1 and 5/CMA.3). From 2016 onward, Myles Allen and colleagues proposed GWP* to treat short-lived gases differently.`,
intuition:`GWP asks how much extra heat one kilogram of a gas traps over the next H years, compared with one kilogram of CO₂. Methane absorbs strongly but disappears in about twelve years, so it scores very high over 20 years and lower over 100. N₂O lasts about a century, so its score barely depends on the horizon. CO₂ is the yardstick because part of it stays in the air for millennia.`,
skim:`CO₂-equivalent = mass × GWP, and the number depends on the time horizon you choose.`,
math:`• For a gas with a single lifetime τ and radiative efficiency A, the absolute GWP is AGWP(H) = A·τ·(1 − e^(−H/τ)); GWP divides this by the AGWP of CO₂, whose decay has several timescales.\n• AR6 values: CH₄ lifetime 11.8 years, GWP₂₀ about 81–83 and GWP₁₀₀ 27.0 (biogenic) or 29.8 (fossil); N₂O lifetime 109 years, GWP₂₀ = GWP₁₀₀ = 273.\n• Fossil methane scores higher because its carbon ends up as CO₂ that is new to the atmosphere; biogenic methane carbon was taken from the air recently.\n• Example: 1.5 kg N₂O-N = 2.36 kg N₂O = 643 kg CO₂-eq with AR6, or 625 kg with the AR5 value used in national inventories.`,
field:`GWP underlies farm carbon footprints, national inventories, carbon credits and ESG reporting. A dairy cow emitting 100 kg CH₄ a year counts as about 2.7 t CO₂-eq with GWP₁₀₀, but about 8 t with GWP₂₀. Agriculture's share of emissions therefore depends noticeably on the metric, which is why every footprint should state the GWP set and horizon used.`,
limits:`GWP is a convention, not a physical constant: the 100-year horizon is a policy choice inherited from Kyoto, and AR6 gives methane's GWP₁₀₀ an uncertainty of roughly ±40 %. GWP compares one-off pulses, so it misrepresents a steady methane source. Constant methane emissions keep the methane concentration roughly stable and add little new warming, while constant CO₂ emissions keep accumulating. GWP* compares changes in short-lived emission rates with cumulative CO₂ to capture this, and the global temperature change potential (GTP) gives methane a 100-year value of only about 5–8. Mixing values from different IPCC reports in one total gives inconsistent results.`,
links:["n2o","nee","carboncred","goodhart","stefan","boundaries","npv","errorprop"],
read:[["P. Forster et al., IPCC AR6 WG1 (2021), ch. 7, section 7.6","metrics and Table 7.15"],["M. R. Allen et al., npj Climate and Atmospheric Science 1 (2018)","GWP*"],["K. P. Shine et al., Climatic Change 68 (2005)","global temperature change potential"]]},
/* ===== Nitrogen fixation: biological and industrial ===== */
{id:"bnf",sym:"BNF",f:"soil",name:"Biological nitrogen fixation",yr:"1886",full:1,
s:"Biological nitrogen fixation is the reduction of atmospheric N₂ to ammonia by the bacterial enzyme nitrogenase, in free-living microbes or in symbiosis with plants such as legumes. It is nature's main entry route for reactive nitrogen.",
eq:"N₂ + 8 H⁺ + 8 e⁻ + 16 ATP → 2 NH₃ + H₂ + 16 ADP + 16 Pᵢ",
origin:`Hermann Hellriegel and Hermann Wilfarth showed in 1886 that legumes gain nitrogen from the air only when their root nodules are present. Martinus Beijerinck isolated the nodule bacteria in 1888. In 1939 Hideo Kubo found the red nodule pigment now called leghaemoglobin, and the Finnish biochemist A. I. Virtanen (Nobel Prize 1945, for fodder preservation) studied how legumes fix nitrogen and pass it to companion grasses.`,
intuition:`Breaking the triple bond of N₂ is hard: industry needs hundreds of degrees and hundreds of bar. Nitrogenase does it at soil temperature, but pays for it with a great deal of energy and must be kept away from oxygen, which destroys it. A legume rents this service, feeding the bacteria sugar in exchange for ammonia.`,
skim:`Nitrogenase turns air nitrogen into ammonia, at a high energy cost, without oxygen.`,
math:`• About 16 ATP are used per N₂ fixed, and part of the electron flow is lost as H₂.\n• The host pays several grams of photosynthate carbon for each gram of nitrogen fixed, so fixation competes with growth.\n• Nitrogenase contains iron and molybdenum, so Mo deficiency on acid soils limits fixation (Brady & Weil, p. 729).`,
field:`In Nordic conditions, clover and lucerne can fix a few hundred kilograms of N per hectare a year, associative fixation in grasses at most tens of kilograms, and free-living fixation from a few grams to a few tens of kilograms (Paasonen-Kivekäs et al. 2016, p. 194). Averaged over all Finnish fields, biological fixation adds only 3–7 kg N/ha a year (p. 198). Legume leys and green manures are the main nitrogen source of organic farming.`,
limits:`Legumes do not fix nitrogen when they do not need to: ammonium inhibits nitrogenase and plentiful nitrate suppresses nodule formation (Brady & Weil, p. 621), so fertilising a clover ley reduces fixation. Fixation needs the right rhizobia, a suitable pH and molybdenum. Legume nitrogen is not loss-free: it can leach or be emitted as N₂O when the ley is ploughed.`,
links:["haber","nmin","elements","minimum","nleach","n2"],
read:[["H. Hellriegel & H. Wilfarth, Untersuchungen über die Stickstoffnahrung der Gramineen und Leguminosen (1888)",""],["Brady & Weil, pp. 619–629",""],["Paasonen-Kivekäs et al. 2016, pp. 193–194",""]]},

{id:"birkeland",sym:"BE",f:"chem",name:"Birkeland–Eyde arc process",yr:"1903",full:1,
s:"The Birkeland–Eyde process fixed nitrogen by burning air in an electric arc, forming nitric oxide that was turned into nitric acid and calcium nitrate fertiliser. It was the first large-scale industrial fixation of atmospheric nitrogen.",
eq:"N₂ + O₂ ⇌ 2 NO     ΔH ≈ +180 kJ\n2 NO + O₂ → 2 NO₂;   3 NO₂ + H₂O → 2 HNO₃ + NO",
origin:`The Norwegian physicist Kristian Birkeland, who also studied the aurora, and the engineer Sam Eyde developed the process from 1903, spreading the arc into a broad flame disc with a magnetic field. Their company, Norsk Hydro, founded in 1905, built plants at Notodden and Rjukan powered by waterfalls and sold calcium nitrate as "Norwegian saltpetre". The arc process was phased out after Norsk Hydro adopted Haber–Bosch ammonia from 1927.`,
intuition:`Lightning does this naturally: a flash heats air enough to make nitrogen and oxygen combine. Birkeland made a permanent lightning bolt in a furnace, and then had to cool the gas instantly, before the NO fell apart again.`,
skim:`Air is heated in an arc to about 3000 °C, giving a few per cent NO that is turned into nitric acid.`,
math:`• The reaction is endothermic, so by Le Chatelier's principle high temperature favours NO; even near 3000 °C, equilibrium gives only a few per cent NO.\n• Two moles of gas give two moles, so pressure does not shift the equilibrium.\n• The hot gas must be quenched within milliseconds, or NO decomposes back to N₂ and O₂ as it cools.`,
field:`Calcium nitrate from the arc process supplied nitrate fertiliser before ammonia synthesis, and Norway's hydropower made it possible. The same chemistry fixes nitrogen in lightning, adding oxides of nitrogen that reach the soil with rain (Paasonen-Kivekäs et al. 2016, p. 192), and in engines and furnaces, where it is the source of NOₓ pollution.`,
limits:`The process needed several times more energy per tonne of nitrogen than Haber–Bosch, and was competitive only with very cheap electricity. Low yields per pass and the need for rapid quenching limited it. Renewed interest in plasma-based fixation using renewable power faces the same thermodynamic limits.`,
links:["haber","frankcaro","lechatelier","gibbs","nox","th2"],
read:[["V. Smil, Enriching the Earth (2001)","history of nitrogen fixation"],["G. J. Leigh, The World's Greatest Fix: A History of Nitrogen and Agriculture (2004)",""],["Paasonen-Kivekäs et al. 2016, p. 192","lightning fixation"]]},

{id:"frankcaro",sym:"FC",f:"chem",name:"Frank–Caro cyanamide process",yr:"1898",full:1,
s:"The Frank–Caro process fixed atmospheric nitrogen by passing N₂ over hot calcium carbide, giving calcium cyanamide. This was used directly as a fertiliser ('lime nitrogen') or converted into ammonia.",
eq:"CaO + 3 C → CaC₂ + CO    (electric furnace, ~2000 °C)\nCaC₂ + N₂ → CaCN₂ + C    (~1000 °C)\nCaCN₂ + 3 H₂O → CaCO₃ + 2 NH₃",
origin:`Adolph Frank and Nikodem Caro discovered in 1895–1898 that calcium carbide absorbs nitrogen at high temperature. The first factories opened around 1905, in Italy, Germany and elsewhere, followed by large plants such as American Cyanamid at Niagara Falls. Calcium cyanamide, Kalkstickstoff, was the leading synthetic nitrogen fertiliser in the 1910s, before Haber–Bosch ammonia took over.`,
intuition:`It is a two-stage trick: first store electrical energy in calcium carbide, then let the carbide grab nitrogen from the air. The fertiliser that results releases its nitrogen slowly in soil, by way of urea and ammonium.`,
skim:`Calcium carbide absorbs N₂ to form calcium cyanamide, a fertiliser that becomes ammonium in soil.`,
math:`• Pure CaCN₂ contains 35 % N; commercial lime nitrogen is about 20 % N, plus calcium.\n• Most of the energy is spent making carbide in an electric furnace, so the process, like the arc, depended on cheap power, though it used much less energy per tonne of N than the arc.\n• In soil, cyanamide is converted to urea and then ammonium over days to weeks, and the calcium carbonate formed has a liming effect.`,
field:`Calcium cyanamide is still sold in Europe as a specialty fertiliser. Its breakdown intermediates are toxic to germinating seeds, weeds, slugs and nitrifying bacteria, so it is applied some time before sowing and acts briefly as a nitrification inhibitor. Its calcium makes it the least acidifying of the historical nitrogen fertilisers.`,
limits:`Cyanamide is toxic to people, causing a strong reaction with alcohol, and to soil life at high rates. The process needed coke and electricity and could not compete on cost once Haber–Bosch ammonia was produced at scale.`,
links:["haber","birkeland","nitrif","ph","gibbs","elements"],
read:[["V. Smil, Enriching the Earth (2001)",""],["Brady & Weil, ch. 13 and 16","nitrogen fertilisers"],["G. J. Leigh, The World's Greatest Fix: A History of Nitrogen and Agriculture (2004)",""]]},

{id:"haber",sym:"HB",f:"chem",name:"Haber–Bosch ammonia synthesis",yr:"1909 / 1913",full:1,
s:"The Haber–Bosch process makes ammonia from nitrogen and hydrogen over an iron catalyst at high pressure and moderate temperature. It supplies most of the nitrogen in the world's fertilisers and so, indirectly, in a large share of human food.",
eq:"N₂ + 3 H₂ ⇌ 2 NH₃     ΔH = −92 kJ\nCH₄ + 2 H₂O → CO₂ + 4 H₂   (steam reforming, net)",
origin:`Fritz Haber demonstrated continuous ammonia synthesis on a laboratory scale in 1909. At BASF, Carl Bosch solved the engineering of high-pressure reactors and Alwin Mittasch found a cheap iron catalyst, and the first plant at Oppau started in 1913. Haber received the Nobel Prize in 1918 and Bosch in 1931. Haber also led Germany's chemical weapons programme in the First World War, which makes his legacy contested.`,
intuition:`Le Chatelier's principle sets the conditions. Four molecules of gas become two, so high pressure pushes the reaction toward ammonia. The reaction releases heat, so low temperature favours ammonia too, but then it is far too slow. The catalyst and recycling unreacted gas are the compromise.`,
skim:`High pressure and an iron catalyst at a moderate temperature combine N₂ and H₂ into ammonia.`,
math:`• Gas volume falls from 4 to 2 moles, so pressure (150–300 bar) shifts the equilibrium to NH₃.\n• Exothermic: equilibrium yield falls with temperature, but the rate needs 400–500 °C, giving only 10–20 % conversion per pass, with the rest recycled.\n• Most of the energy, roughly 28–35 GJ per tonne of ammonia in modern plants, goes into making hydrogen, usually from natural gas, releasing about 2 t CO₂ per tonne of ammonia.`,
field:`Around 180 million tonnes of ammonia are made a year, mostly for fertilisers. Estimates suggest that about half of the nitrogen in people today was fixed by Haber–Bosch. Its success has also roughly doubled the flow of reactive nitrogen on land, behind nitrate leaching, N₂O and the transgressed nitrogen planetary boundary. Ammonia made with hydrogen from water electrolysis and renewable power ("green ammonia") is the main route to fossil-free fertiliser.`,
limits:`The synthesis step is efficient; the environmental burden comes from fossil hydrogen and from what happens to the nitrogen after spreading, since crops typically take up only 40–70 % of fertiliser N (Paasonen-Kivekäs et al. 2016, p. 198). Cheap nitrogen invites over-application, a Jevons-type effect on reactive nitrogen.`,
links:["lechatelier","gibbs","massaction","bnf","birkeland","frankcaro","boundaries","jevons","nleach","n2o"],
read:[["V. Smil, Enriching the Earth: Fritz Haber, Carl Bosch, and the Transformation of World Food Production (2001)",""],["J. W. Erisman et al., Nature Geoscience 1 (2008)","how a century of ammonia synthesis changed the world"],["Brady & Weil, ch. 13",""]]}

];

/* Quiz: each question targets a common misconception. sec = article section to reread. */
const QUIZ=[
{law:"lechatelier",sec:"limits",q:"Ammonia synthesis (N₂ + 3H₂ ⇌ 2NH₃) is at equilibrium in a sealed vessel. You add argon, keeping the volume constant. What happens?",
 o:["The equilibrium shifts right, toward fewer gas molecules","The equilibrium shifts left, to raise the pressure back","Nothing: the partial pressures of the reacting gases are unchanged","The equilibrium constant K increases"],a:2,
 m:"Total pressure rose, so the system must respond.",x:"The inert gas raises total pressure but leaves each reactant's partial pressure, and so Q, unchanged. Le Chatelier is a shortcut; Q versus K is the rule."},
{law:"lechatelier",sec:"math",q:"An exothermic equilibrium is heated. Which statement is correct?",
 o:["It shifts left, and K is unchanged","It shifts left because K itself decreases","It shifts right because reactions run faster when hot","Temperature does not affect equilibrium, only rate"],a:1,
 m:"Temperature shifts the position like a concentration change does.",x:"Concentration and pressure changes move Q away from a fixed K. Temperature is different: it changes K itself (van 't Hoff). For an exothermic reaction, K falls as temperature rises."},
{law:"ph",sec:"math",q:"Soil A has pH 5.0 and soil B has pH 6.0. How do their hydrogen-ion activities compare?",
 o:["A has about 20 % more","A has twice as much","A has ten times as much","They differ by 1 mmol/l"],a:2,
 m:"pH is a linear scale.",x:"pH is logarithmic. One unit is a factor of ten in H⁺ activity, which is why a seemingly small drop in pH matters so much for aluminium solubility."},
{law:"ph",sec:"limits",q:"Two fields both test at pH 5.6. One is a sandy soil, the other a humus-rich clay. Do they need the same amount of lime to reach pH 6.5?",
 o:["Yes, same pH means same lime need","No, the clay usually needs more because it holds more exchangeable acidity","No, the sand needs more because it has less buffering","Lime need depends only on the target pH"],a:1,
 m:"pH tells you how much acid there is.",x:"pH measures intensity, not quantity. Soils with high CEC and organic matter carry a large reserve of exchangeable H⁺ and Al³⁺ that lime must neutralise before pH moves."},
{law:"ph",sec:"field",q:"The same soil is measured in water and in 0.01 M CaCl₂. What do you expect?",
 o:["The readings are identical","CaCl₂ gives a lower reading","CaCl₂ gives a higher reading","It depends only on the electrode"],a:1,
 m:"pH is pH, whatever the method.",x:"Ca²⁺ in the salt solution displaces exchangeable H⁺ and Al³⁺ into solution, so the CaCl₂ reading is typically about 0.5 to 1 unit lower. Always state the method with a soil pH."},
{law:"redox",sec:"limits",q:"A field is well drained and the bulk soil is clearly oxic. Can denitrification still produce N₂O there?",

 m:"Soil redox is uniform at the scale of a sample.",x:"Oxygen is consumed faster than it diffuses into the centre of a wet aggregate or a clump of residue. These microsites can denitrify inside an oxic soil, which is why N₂O emissions are so patchy."},
