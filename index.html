{law:"mitscherlich",sec:"field",q:"Under Mitscherlich's law, the first 50 kg of a nutrient closes half of the gap between the unfertilised yield and the maximum. What does the second 50 kg do?",
 o:["Closes the other half, reaching the maximum","Closes half of the remaining gap, reaching 75 % of the possible increase","Adds nothing","Closes a quarter of the original gap, reaching 50 %"],a:1,
 m:"Equal increments give equal yield gains until the maximum is reached.",x:"Each increment closes the same fraction of the remaining gap, y = A(1 − e^(−cx)). The maximum is approached but never reached, which is why the economic optimum is always below it."},
{law:"mitscherlich",sec:"field",q:"How does Mitscherlich's view of growth factors differ from the strict law of the minimum?",
 o:["It does not; they are the same","In Mitscherlich's model all factors act together, so improving a non-limiting factor still raises yield somewhat","Mitscherlich says only water matters","Mitscherlich says yield is linear in all factors"],a:1,
 m:"Only the single most limiting factor matters.",x:"Liebig's barrel allows response only to the limiting factor. Mitscherlich's multiplicative curves let every factor contribute, which is closer to observed co-limitation."},
{law:"goldich",sec:"field",q:"Finnish till contains biotite, muscovite and K-feldspar. Which releases potassium and magnesium fastest by weathering?",
 o:["Muscovite","Biotite","K-feldspar","All at the same rate"],a:1,
 m:"Micas all weather at the same rate.",x:"In the Goldich sequence, biotite, which forms at higher temperature than muscovite, is less stable at the surface. Biotite-rich soils therefore release more K and Mg."},
{law:"goldich",sec:"field",q:"Why are quartz-rich sandy soils naturally poor in nutrients?",
 o:["Quartz is acidic","Quartz is the most resistant common mineral and releases no nutrients when it weathers","Quartz binds all cations","Quartz soils are always young"],a:1,
 m:"Any mineral soil supplies nutrients as it weathers.",x:"Quartz (SiO₂) contains no K, Ca, Mg or P and is at the stable end of the Goldich series. Nutrient supply in such soils depends on organic matter and fertilisation."},
{law:"redfield",sec:"field",q:"Soil microbes have a C:N ratio near 8:1, yet residues above about 25:1 cause nitrogen immobilisation. Why the difference?",
 o:["Microbes ignore carbon","Microbes respire about two thirds of the carbon they use, so only one third becomes biomass; 25 × ⅓ ≈ 8","Residue nitrogen is not available","The two ratios are measured differently"],a:1,
 m:"Residue C:N should match microbial C:N to avoid immobilisation.",x:"Carbon-use efficiency links the ratios. Each unit of new microbial biomass carbon requires about three units of substrate carbon, and N to match only the third that is assimilated."},
{law:"priming",sec:"field",src:"Brady & Weil, pp. 550–551",q:"Adding fresh residue stimulates microbes so that some old humus decomposes faster (priming). What happens to total soil humus by the end of the process?",
 o:["It must fall below the starting level","In the typical case it ends somewhat higher, because new humus from the residue outweighs the primed loss","It doubles","It is unchanged"],a:1,
 m:"Priming means adding residues reduces soil carbon.",x:"Priming speeds the loss of old carbon, but residues also add new stabilised carbon. The net balance depends on residue amount, soil and conditions; in Brady & Weil's typical case the humus level rises."},
{law:"lindeman",sec:"field",q:"Why does producing food as meat need much more land than producing the same food energy as crops?",
 o:["Animals concentrate the energy in their feed","Only about 10 % of energy passes from one trophic level to the next; most is respired as heat","Meat has more energy per kilogram","Crops need more fertiliser"],a:1,
 m:"Animals turn feed into food efficiently.",x:"Each trophic step loses most of its energy to respiration. The exact efficiency varies (poultry convert better than cattle), but feeding crops to animals always adds a lossy step."},
{law:"logistic",sec:"field",q:"A population grows logistically toward carrying capacity K. At what population size is its growth rate, and thus the maximum sustainable harvest, greatest?",
 o:["Near zero","At about K/2","At K","Above K"],a:1,
 m:"A population grows fastest when it is largest.",x:"dN/dt = rN(1 − N/K) peaks at N = K/2. Harvesting to keep a fish stock or a pasture near that level gives the maximum sustainable yield in simple models."},
{law:"island",sec:"field",q:"Species number follows S = cA^z with z ≈ 0.25. A habitat patch is halved in area. Roughly what share of species is eventually lost?",
 o:["About half","About 16 %","None","About 75 %"],a:1,
 m:"Halving habitat area halves the number of species.",x:"0.5^0.25 ≈ 0.84, so about 16 % of species are eventually lost. Small losses of area matter less than proportionally, but repeated fragmentation adds up, and losses can take decades (extinction debt)."},
{law:"ipat",sec:"field",q:"Population grows by 50 % and consumption per person by 50 %. By how much must impact per unit of consumption (T) fall to keep total impact constant?",
 o:["By 50 %","By about 56 %","By 100 %","By 25 %"],a:1,
 m:"Efficiency gains just need to match growth in percentage terms.",x:"I = P × A × T. With P and A each × 1.5, T must be 1/2.25 ≈ 0.44, a 56 % cut. Growth factors multiply, so efficiency must improve faster than either alone."},
{law:"ekc",sec:"field",q:"Sulfur dioxide emissions in rich countries rose and then fell with income. Does the same inverted U reliably hold for CO₂ and nitrogen surplus?",
 o:["Yes, for all pollutants","No; the evidence is much weaker, and falling territorial emissions can partly reflect production moved abroad","Yes, but only for nitrogen","No, because CO₂ is not a pollutant"],a:1,
 m:"Economic growth automatically cleans up the environment.",x:"The curve fits local, visible pollutants with cheap abatement. For global or diffuse ones, declines often depend on policy and can be offset by imports, so consumption-based accounts matter."},
{law:"commons",sec:"field",q:"Hardin argued that shared resources are inevitably overused. What did Elinor Ostrom's field studies show?",
 o:["That Hardin was right in every case","That many communities manage commons sustainably for centuries, with clear boundaries, local rules, monitoring and graduated sanctions","That only private ownership works","That state control always works"],a:1,
 m:"A commons always ends in tragedy.",x:"Ostrom's design principles describe when collective management works. Tragedy is likely when users are many, anonymous and unable to monitor each other, as with diffuse nutrient loading."},
{law:"boundaries",sec:"field",q:"Which planetary boundary has been exceeded most clearly, according to the planetary boundaries framework?",
 o:["None of the nine has been crossed yet","Biogeochemical flows of nitrogen and phosphorus","Stratospheric ozone depletion","Atmospheric aerosol loading"],a:1,
 m:"Climate change is the only boundary already crossed.",x:"Nitrogen and phosphorus flows, largely from fertiliser use, are among the furthest beyond the safe zone, alongside biosphere integrity and climate change. Ozone depletion is recovering after the Montreal Protocol."},
/* ---- Hillel (1998), plant water uptake and irrigation ---- */
{law:"richards",sec:"field",src:"Hillel 1998, pp. 620–621",q:"An old irrigation rule held that soil water is equally available to plants from field capacity down to the wilting point. What does the evidence show?",
 o:["It is correct; plants are unaffected until wilting point","Availability falls progressively as the soil dries, and growth can suffer well before the wilting point, depending also on evaporative demand","Plants use water only near field capacity","Availability rises as the soil dries"],a:1,
 m:"Plants are unaffected by drying until the wilting point.",x:"The 'equal availability' bucket model rests on two arbitrary limits. Conductivity falls steeply as soil dries, so supply to roots shrinks gradually, and stress depends on how fast the atmosphere demands water."},
{law:"ohm",sec:"field",src:"Hillel 1998, p. 620",q:"A crop wilts at midday although the soil is quite wet, then recovers in the evening. What is happening?",
 o:["The soil is actually at wilting point","Evaporative demand briefly exceeds the rate at which water can flow through the soil–root–xylem resistances","The crop is diseased","Roots stop working at noon"],a:1,
 m:"Wilting always means the soil has run out of water.",x:"Uptake is a flow driven by a potential difference across resistances, like current in a circuit. When demand peaks, leaf water potential falls until stomata close; the soil can still hold plenty of water."},
{law:"ohm",sec:"field",src:"Hillel 1998, pp. 549–550",q:"In the soil–plant–atmosphere continuum, what is the simplest way to describe water flow through each segment?",
 o:["As a fixed daily quantity","As flow proportional to the water potential difference across the segment and inversely proportional to its resistance, with segments in series","As diffusion from roots to soil","As driven only by gravity"],a:1,
 m:"Plants pump water actively from the soil.",x:"Philip's SPAC treats soil, root, xylem, leaf and air as a chain of resistances. Transpiration pulls water passively along the potential gradient, and the most restrictive link controls the flow."},
{law:"fick",sec:"field",src:"Hillel 1998, p. 551",q:"What share of the water a plant takes up in dry weather is typically used in photosynthesis?",
 o:["About half","Most of it","Only a very small fraction; often over 98 % is lost in transpiration","None at all"],a:2,
 m:"Plants take up water mainly to build biomass.",x:"Stomata must open for CO₂ to diffuse in, and water vapour diffuses out through the same openings down a much steeper gradient. Plant physiologists call transpiration a 'necessary evil'."},
{law:"fick",sec:"field",src:"Hillel 1998, p. 551",q:"Why do plants build root systems that can total hundreds of kilometres in length?",
 o:["For anchorage only","Soil water and nutrients move toward roots very slowly through the unstirred soil solution, so roots must grow toward them","To store starch","Because water moves quickly to roots from far away"],a:1,
 m:"Water flows to roots from the whole root zone.",x:"Unlike the well-mixed atmosphere, the soil solution is sluggish. Diffusion and unsaturated flow work over millimetres to centimetres, so plants forage by proliferating roots in moist, nutrient-rich zones."},
{law:"pigou",sec:"field",src:"Hillel 1998, p. 631",q:"Irrigation schemes often run at under 50 % efficiency although 80–90 % is technically achievable. What is a common underlying reason?",
 o:["Lack of knowledge only","Water is priced below its true cost, often by subsidy, so wasting water is cheaper for the farmer than the labour or equipment to save it","Soils cannot hold more water","High efficiency harms yields"],a:1,
 m:"Wasteful irrigation is a technical problem.",x:"When a resource is underpriced, overuse is privately rational. Hillel calls such subsidies self-defeating: the costs appear as waterlogging, salinisation and drainage needs elsewhere."},
{law:"mass",sec:"field",src:"Hillel 1998, p. 643",q:"A field receives 1200 mm of irrigation during a season, with evapotranspiration of 900 mm and negligible runoff and storage change. How much water drains below the root zone?",
 o:["None","300 mm","900 mm","1200 mm"],a:1,
 m:"Water not seen at the surface has been used by the crop.",x:"By the water balance, D = I − (E + T) = 1200 − 900 = 300 mm. At 85 % efficiency the same ET would need about 1060 mm, saving roughly 140 mm."},
{law:"mass",sec:"field",src:"Hillel 1998, p. 642",q:"Salt accumulation in an irrigated root zone is prevented by leaching. Where do the salts go?",
 o:["They disappear","Down to the underlying groundwater, which can become more saline over time","Into the crop","Into the air"],a:1,
 m:"Leaching removes salts from the environment.",x:"Leaching moves salt rather than removing it. Along Israel's coastal plain, salts leached from irrigated soils have raised the salinity of well waters."},
{law:"richards",sec:"field",src:"Hillel 1998, p. 626",q:"Drip or other high-frequency irrigation supplies water daily in small amounts. How does this change the role of the soil?",
 o:["Soil water storage becomes more important","The soil's storage capacity matters much less, so even coarse sands and gravels can be irrigated efficiently","Infiltration stops mattering","Drainage is no longer possible"],a:1,
 m:"Irrigation always depends on how much water the soil can store.",x:"With supply matched to crop demand, the soil becomes a conduit rather than a reservoir. Moisture pulses damp out within a few centimetres of the surface, and flow below is nearly steady."},
/* ---- Hillel (1998) Appendix 1, spatial variability and statistics ---- */
{law:"power",sec:"watch",src:"Hillel 1998, pp. 662–663",q:"A soil property has a coefficient of variation of 100 %. How many independent samples are needed to estimate its field mean within ±10 % at 95 % confidence?",
 o:["About 10","About 40","About 384","About 1000"],a:2,
 m:"A few dozen samples always give a precise field mean.",x:"n = Z²·CV²/d² = 1.96² × 1² / 0.1² ≈ 384. Accepting 80 % confidence and ±25 % brings it down to about 26; the trade-off is a management decision, not a statistical one."},
{law:"power",sec:"field",src:"Hillel 1998, p. 663",q:"Which property typically needs the most samples to estimate its field mean to a given relative precision?",
 o:["Bulk density","Total porosity","Saturated hydraulic conductivity","Water content at saturation"],a:2,
 m:"All soil properties vary about equally across a field.",x:"Bulk density and porosity usually have CV < 15 %, texture and retention 15–50 %, while Ksat, infiltration rate, solute concentration and EC often exceed 50 %. Sampling effort should follow the property's variability."},
{law:"power",sec:"field",src:"Hillel 1998, pp. 660, 663",q:"Soil P values from 1630 points in a 256-ha field, or Ksat values with CV near 100 %, are analysed assuming a normal distribution. What is the problem?",
 o:["None, soil properties are normally distributed","Such data are right-skewed; a normal distribution with CV = 1 would imply about 16 % negative values, so log-transformation is usually more appropriate","Normal distributions cannot have a mean","The sample is too large"],a:1,
 m:"Soil data are normally distributed.",x:"Many soil properties are log-normal: many low values and a long tail of high ones. Means of large samples are still roughly normal (central limit theorem), but medians, quantiles and maps should account for skew."},
{law:"spatial",sec:"watch",src:"Hillel 1998, p. 671",q:"A variogram of soil water retention reaches its sill at a range of 3 m. What does that mean for samples taken 1 m apart?",
 o:["They are independent, so each counts fully","They are interdependent; only samples further apart than the range can be treated as independent","They must be identical","The variogram says nothing about sampling"],a:1,
 m:"Any two separate samples are independent observations.",x:"The range marks the distance beyond which observations are uncorrelated. Closely spaced samples carry overlapping information, which matters for sample-number calculations and significance tests."},
{law:"spatial",sec:"field",src:"Hillel 1998, pp. 671–672",q:"Kriging and inverse-distance weighting give different maps of sand content. How should you judge which is better?",
 o:["Kriging is always better","Cross-validation: predict each point from the others and compare errors (RMSE); if values are independent, neither beats the plain mean","Pick the smoother map","Inverse distance is always better"],a:1,
 m:"Geostatistical interpolation is always superior.",x:"Kriging uses the variogram and gives an error estimate, but it relies on a valid variogram and subjective choices. If RMSE is close to the sample standard deviation, there is no spatial structure to exploit."},
{law:"darcy",sec:"math",src:"Hillel 1998, p. 664",q:"Two 'similar media' differ only in scale: one is a twofold magnification of the other. At the same degree of saturation, how do their hydraulic conductivities compare?",
 o:["Equal","The coarser one is twice as conductive","The coarser one is four times as conductive","The coarser one is half as conductive"],a:2,
 m:"Conductivity scales in proportion to grain size.",x:"Miller and Miller (1955) showed that suction scales with 1/λ and conductivity with λ². This similar-media scaling is used to collapse many retention curves into one with a scaling factor per sample."},
/* ---- Hillel (1998) Appendix 2, contaminated sites (R. S. Baker) ---- */
{law:"napl",sec:"watch",src:"Hillel 1998, pp. 682–684",q:"A monitoring well at a fuel spill shows 50 cm of floating gasoline. What does that say about the gasoline in the surrounding soil?",
 o:["The soil holds a 50 cm oil-saturated layer","Much less: true mobile LNAPL is typically a small fraction, often under 1–10 %, of the apparent well thickness","The soil holds more than 50 cm, because wells underestimate","Nothing; wells and soil are unrelated"],a:1,
 m:"Oil thickness in a well equals the thickness of an oil layer in the soil.",x:"Fine pores stay water-filled, so oil occupies only part of the pore space over a range of heights. Reading well thickness as a 'pancake' of oil greatly overestimates the recoverable volume."},
{law:"napl",sec:"field",src:"Hillel 1998, pp. 681–682",q:"Into which pores does a spilled fuel enter first when it soaks into moist soil?",
 o:["The smallest pores, like water","The largest connected pores, because oil is non-wetting relative to water","All pores equally","Only clay pores"],a:1,
 m:"Spilled liquids soak into soil the way water does.",x:"Water wicks into fine pores first. Oil behaves like air entering wet soil: it needs a capillary entry pressure that is lowest for large pores, so it moves through the biggest interconnected pathways until a fine layer stops it."},
{law:"napl",sec:"field",src:"Hillel 1998, pp. 679–680",q:"Trichloroethene (density 1.46 g/cm³) and benzene (0.88 g/cm³) are both spilled at a site. Where will each tend to accumulate as a separate phase?",
 o:["Both float on the water table","Benzene floats on the water table (LNAPL); trichloroethene can sink below it toward low-permeability layers (DNAPL)","Both sink","Both dissolve completely"],a:1,
 m:"All oily contaminants float on groundwater.",x:"Density decides. Dense chlorinated solvents can penetrate deep into aquifers and pool on clay layers, which makes them far harder to find and remove than fuels."},
{law:"napl",sec:"field",src:"Hillel 1998, p. 682",q:"The water table at a fuel spill rises and falls each season. What happens to the contamination?",
 o:["It stays in a thin layer at the average water table","It is smeared over the whole range of water-table movement, with oil trapped below the water as it rises","It is washed out completely","It moves to the surface"],a:1,
 m:"Floating oil stays in one thin layer.",x:"Rising water traps oil as disconnected blobs; falling water leaves residual oil behind. The resulting smear zone acts as a long-lasting source of dissolved and vapour plumes."},
{law:"napl",sec:"field",src:"Hillel 1998, pp. 679, 682",q:"After free-phase oil has been pumped out, why can the site keep contaminating groundwater for years?",
 o:["Pumping adds contamination","Residual oil remains trapped in pores as disconnected blobs, and dissolves slowly into passing water","Oil regenerates in soil","It cannot; pumping removes all oil"],a:1,
 m:"Removing free product removes the source.",x:"Once oil-filled pores lose continuity, the remaining residual saturation cannot flow to wells. It stays as a slowly dissolving and volatilising source unless treated in situ."},
{law:"darcy",sec:"field",src:"Hillel 1998, pp. 685–686",q:"A soil vapour extraction well captures air from a 10 m radius. Is the soil cleaned effectively over that whole radius?",
 o:["Yes, over the full capture zone","No; air velocity and pressure gradients are greatest near the well, and cleanup effectiveness falls roughly exponentially with distance","Only beyond 10 m","Only at the surface"],a:1,
 m:"Everything within the capture zone is remediated.",x:"Gas flow follows Darcy's law with a pressure gradient that is steepest near the well. The effective zone of influence is much smaller than the capture zone, which governs well spacing."},
{law:"darcy",sec:"field",src:"Hillel 1998, p. 685",q:"Soil vapour extraction is applied at a site with interbedded sand and wet silt. Which layers are cleaned slowest?",
 o:["The sand layers","The wet silt layers, because air permeability falls steeply as liquid saturation rises, so airflow bypasses them","Both equally","The surface layer"],a:1,
 m:"Vapour extraction draws air evenly through the whole soil.",x:"Air flows only through connected air-filled pores. Wet, fine layers have low relative air permeability, so contaminants there are removed mainly by slow diffusion into the airflow in neighbouring layers."},
{law:"henry",sec:"field",src:"Hillel 1998, p. 680",q:"Tetrachloroethene has a Henry's law constant about four times that of benzene. What does that suggest for soil vapour extraction?",
 o:["PCE is harder to remove by vapour extraction","Dissolved PCE partitions more readily into soil air, so vapour extraction removes it from pore water more effectively","Henry's constant is irrelevant to vapour extraction","Both behave identically"],a:1,
 m:"Water solubility alone decides how a contaminant moves.",x:"Henry's constant sets the ratio between concentrations in air and water. Compounds with high constants strip readily from pore water into the extracted air; semivolatile compounds need other methods."},
/* ---- Nitrogen processes ---- */
{law:"nmin",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 195",q:"How much nitrogen has growing-season mineralisation been measured to supply to Finnish barley fields (0–100 cm)?",
 o:["Practically none","About 30–50 kg N/ha, around half of an average crop's uptake","More than the crop needs","About 5 kg N/ha"],a:1,
 m:"Crops get almost all their nitrogen from fertiliser.",x:"The soil's own supply is substantial, and it varies with weather. A further 0–30 kg N/ha is mineralised between harvest and spring, when there is no crop to take it up, which is why autumn leaching is a mineralisation problem as much as a fertiliser problem."},
{law:"nmin",sec:"limits",q:"Sieved soil is incubated in the laboratory at 25 °C and optimal moisture to estimate how much N the field will mineralise. What is the main caveat?",
 o:["It underestimates field rates","It usually overestimates field rates, because sieving breaks aggregates and the conditions are far better than in a cool, fluctuating field","It is exact","It measures immobilisation only"],a:1,
 m:"A laboratory mineralisation test measures what the field will supply.",x:"Incubations measure a potential under ideal conditions. Field supply depends on temperature, moisture, aeration and residue inputs, so incubation results need calibration against field trials."},
{law:"nimmob",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 203",q:"After harvest, straw is ploughed in on one field and sugar beet tops on another. What happens to soil mineral N in the following weeks?",
 o:["It rises on both","Straw causes net immobilisation (mineral N falls), while beet tops cause net mineralisation (mineral N rises)","It falls on both","Neither has any effect"],a:1,
 m:"All crop residues release nitrogen as they decompose.",x:"Residue C:N decides the direction. Straw is nitrogen-poor, so microbes draw on soil N; beet tops and potato haulms are nitrogen-rich and release it."},
{law:"nimmob",sec:"limits",src:"Brady & Weil, p. 609",q:"Ammonium disappears from soil solution in a vermiculite-rich subsoil without being taken up by microbes. What is this?",
 o:["Microbial immobilisation","Ammonium fixation: NH₄⁺ trapped in clay-mineral interlayers, a physical process","Nitrification","Denitrification"],a:1,
 m:"Any disappearance of mineral N is immobilisation.",x:"Immobilisation is biological uptake into microbial cells. Fixation traps NH₄⁺ (and K⁺) inside 2:1 clay lattices; it can hold 20–40 % of subsoil N and is released only slowly."},
{law:"nitrif",sec:"math",src:"Brady & Weil, p. 395",q:"How much acidity does nitrification of ammonium produce?",
 o:["None, nitrification is neutral","Two H⁺ for each NH₄⁺ oxidised to nitrate","One OH⁻ per NH₄⁺","It depends only on the fertiliser brand"],a:1,
 m:"Ammonium fertilisers are acidifying because of their sulfate.",x:"The H⁺ comes from oxidising the nitrogen itself, whatever the source: fertiliser, manure or mineralised organic matter. Leached nitrate leaves that acidity behind, about 7 kg CaCO₃ per kg N in the worst case."},
{law:"nitrif",sec:"field",src:"Brady & Weil, pp. 612–613",q:"Ammonium sulfate is applied to a warm, well-aerated silt loam. What do you expect after two weeks?",
 o:["Most N is still ammonium","Most of it has been converted to nitrate, with only a brief, small accumulation of nitrite","It has all become N₂","It has all been fixed by clay"],a:1,
 m:"Ammonium stays ammonium until a plant takes it up.",x:"Under favourable conditions nitrification is fast and the second step keeps pace with the first, so little toxic nitrite builds up. This is why nitrate is the dominant mineral N in most arable soils."},
{law:"denitrif",sec:"field",src:"Brady & Weil, pp. 616–617",q:"How is a field's annual denitrification loss typically distributed through the year?",
 o:["Evenly, day by day","Episodically: much of it in a few days when warm, freshly fertilised, carbon-rich soil becomes waterlogged","Only in winter","Only in dry periods"],a:1,
 m:"Gas losses happen steadily and can be estimated from a few measurements.",x:"Hot moments and hot spots dominate. A single waterlogging event can lose 10 kg N/ha in a day, and low-lying parts of a field can lose N ten times faster than the average."},
{law:"denitrif",sec:"math",q:"Denitrification of nitrate to N₂ uses organic carbon as the electron donor. Roughly how much carbon is consumed per kilogram of N removed?",
 o:["About 0.1 kg C","About 1 kg C","About 10 kg C","None"],a:1,
 m:"Denitrification needs only nitrate and low oxygen.",x:"From 5 CH₂O + 4 NO₃⁻ → 2 N₂ + 5 CO₂, removing 56 g N consumes 60 g C. Wetland and bioreactor designs for nitrate removal must therefore supply carbon, for example woodchips."},
{law:"nh3",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 198",q:"In Finnish agricultural nitrogen budgets, where does most ammonia volatilisation come from?",
 o:["Mineral fertilisers","Livestock manure: about 12–16 kg N/ha a year, against under 1 kg from mineral fertilisers","Crop residues only","Lime"],a:1,
 m:"Ammonia losses come mainly from fertilisers.",x:"Manure combines high ammonium content, high pH and surface application. Finnish mineral fertilisers are mostly nitrate-based and little urea is used, so their NH₃ losses are small."},
{law:"nh3",sec:"field",src:"Brady & Weil, p. 611",q:"Urea is broadcast on the surface of a sandy loam. In one experiment, how did a small amount of irrigation afterwards affect ammonia losses?",
 o:["No effect","About 8 mm of water cut losses from 60 % to 17 % of the applied N","It doubled the losses","It stopped all urea hydrolysis"],a:1,
 m:"Ammonia loss is decided by the fertiliser, not by how it is applied.",x:"Water moves urea and ammonium into the soil, where colloids adsorb them and the gas cannot easily escape. Incorporation of manure or fertiliser has a similar effect, cutting losses by 25–75 %."},
{law:"nox",sec:"intuition",q:"In the 'hole-in-the-pipe' model, what mainly decides whether a soil emits NO or N₂O?",
 o:["Crop species","Soil moisture: drier, aerated soil leaks mostly NO from nitrification, wetter soil mostly N₂O, and very wet soil N₂","Soil colour","Time of day only"],a:1,
 m:"All nitrogen gases come from waterlogged soils.",x:"The total leak depends on how fast nitrogen cycles; the split between gases depends on water-filled pore space, which controls oxygen supply."},
{law:"nox",sec:"field",q:"Why does soil NO emission matter for air quality, although NO is not a greenhouse gas?",
 o:["It does not matter","It is quickly oxidised to NO₂ and drives ground-level ozone and nitric acid formation, particularly in rural areas","It depletes CO₂","It is toxic only to soil microbes"],a:1,
 m:"Only N₂O from soils matters for the atmosphere.",x:"Soil NO can be a major NOₓ source where traffic and industry are few. Part of it is recaptured by the crop canopy, which is why emissions measured above canopies are smaller than at the soil surface."},
{law:"n2o",sec:"math",q:"Using the IPCC default emission factor of 1 %, what is the direct N₂O emission from 150 kg N/ha, in CO₂-equivalents (GWP 273)?",
 o:["About 41 kg CO₂-eq/ha","About 640 kg CO₂-eq/ha","About 4100 kg CO₂-eq/ha","About 1.5 kg CO₂-eq/ha"],a:1,
 m:"A 1 % loss of nitrogen is climatically negligible.",x:"1.5 kg N₂O-N × 44/28 = 2.36 kg N₂O; × 273 ≈ 640 kg CO₂-eq. Forgetting the N₂O-N to N₂O conversion understates it by over a third."},
{law:"n2o",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 196",q:"When does about half of the annual N₂O emission from Finnish arable fields typically occur?",
 o:["During peak growth in July","Between harvest and sowing, including freeze–thaw periods","Only on the day of fertilisation","Evenly through the year"],a:1,
 m:"N₂O is emitted mainly in the growing season, when fertiliser is applied.",x:"Off-season emissions, especially from thawing soils, are large in cold climates. Measurement programmes that stop in autumn underestimate annual totals."},
{law:"n2",sec:"math",src:"Brady & Weil, p. 617",q:"In an irrigated, fertilised clay soil, measured N₂O losses were small. How large were the N₂ losses?",
 o:["Negligible","20–100 times larger than the N₂O losses","Equal to the N₂O losses","Impossible to produce in clay"],a:1,
 m:"N₂O emissions show how much nitrogen is lost as gas.",x:"In warm, wet, carbon-rich conditions denitrification runs to completion. N₂ is harmless to the environment, but such losses can cause serious crop nitrogen deficiency."},
{law:"n2",sec:"intuition",q:"Why is N₂ emission from soil so rarely measured directly?",
 o:["N₂ is toxic to instruments","The atmosphere is already 78 % N₂, so a soil flux is invisible against the background without ¹⁵N tracers or N₂-free incubations","Soils never emit N₂","N₂ dissolves instantly in rain"],a:1,
 m:"Any gas a soil emits can be measured with a chamber.",x:"Because of the measurement problem, N₂ is often estimated as the unexplained remainder of a nitrogen budget, which also collects every other error."},
{law:"nleach",sec:"math",q:"Drain water averages 15 mg NO₃-N/L, and 200 mm drains through the soil in a year. What is the nitrate load?",
 o:["3 kg N/ha","30 kg N/ha","300 kg N/ha","15 kg N/ha"],a:1,
 m:"A low concentration means a small load.",x:"Load = concentration × volume: 15 g/m³ × 2000 m³/ha = 30 kg N/ha. The same concentration in a wet year with 400 mm drainage doubles the load."},
{law:"nleach",sec:"field",src:"Paasonen-Kivekäs et al. 2016, pp. 202–203",q:"Which crop typically has the lowest nitrate leaching, and what happens when it is ploughed?",
 o:["Potato; leaching stops","Permanent grass ley; ploughing it multiplies leaching as the residues mineralise","Spring cereal; nothing changes","Sugar beet; leaching halves"],a:1,
 m:"Converting grass to arable land is neutral for leaching.",x:"Long-season crops take up N late in autumn and early in spring. A ploughed ley releases a large pulse of mineral N with no crop to use it, so catch crops or spring ploughing are recommended."},
/* ---- GWP ---- */
{law:"gwp",sec:"intuition",q:"Why is methane's 20-year GWP about three times its 100-year GWP, while N₂O's is the same on both horizons?",
 o:["Methane absorbs more strongly over long periods","Methane lasts only about 12 years, so its warming is concentrated early and diluted over a longer horizon; N₂O lasts about 109 years","The values are rounding errors","N₂O does not absorb infrared radiation"],a:1,
 m:"A gas's GWP is a fixed property of the gas.",x:"GWP integrates warming over a horizon relative to long-lived CO₂. Short-lived gases look much more potent on short horizons. The horizon is a choice, so always state it."},
{law:"gwp",sec:"origin",src:"UNFCCC decisions 18/CMA.1 and 5/CMA.3",q:"A national inventory converts 1 kg N₂O to 265 kg CO₂-eq, while a research paper uses 273. Which is wrong?",
 o:["The inventory, because it is outdated","Neither: Paris Agreement inventories must use AR5 values (265), while research often uses AR6 (273)","The paper, because only official values are valid","Both, because the true value is 298"],a:1,
 m:"There is one correct GWP for each gas.",x:"GWPs are revised with each IPCC assessment. What matters is consistency: state the source, and do not mix sets in one total or comparison."},
{law:"gwp",sec:"limits",q:"A dairy farm has emitted the same amount of methane every year for 30 years. What does this do to global temperature, compared with GWP₁₀₀ accounting?",
 o:["Exactly what GWP₁₀₀ CO₂-equivalents suggest","Much less additional warming than the CO₂-equivalents suggest, because a constant methane source keeps the methane concentration roughly stable","More, because methane accumulates like CO₂","None at all, because methane is biogenic"],a:1,
 m:"Equal CO₂-equivalents mean equal effects on temperature.",x:"GWP treats each year's methane like a pulse of long-lived CO₂. A steady methane source maintains, but does not increase, its warming. GWP* represents this; rising or falling methane emissions change temperature strongly."},
{law:"gwp",sec:"math",q:"Why does fossil methane have a higher GWP₁₀₀ (29.8) than biogenic methane (27.0) in AR6?",
 o:["Fossil methane molecules absorb more infrared","When fossil methane oxidises, it adds CO₂ that is new to the atmosphere; biogenic methane's carbon was recently taken from the air","Biogenic methane has a longer lifetime","It is an error in the report"],a:1,
 m:"Methane is methane, whatever its source.",x:"The molecule is identical. The difference comes from the CO₂ it eventually becomes: fossil carbon adds to the atmospheric stock, while biogenic carbon returns where it came from."},
/* ---- Nitrogen fixation ---- */
{law:"bnf",sec:"limits",src:"Brady & Weil, p. 621",q:"A clover–grass ley receives 150 kg N/ha of mineral fertiliser. What happens to the clover's nitrogen fixation?",
 o:["It rises, because the clover grows better","It falls, because plentiful mineral N suppresses nodulation and the grass outcompetes the clover","It is unaffected","It stops the grass from growing"],a:1,
 m:"Fertilising a legume ley adds to the nitrogen it fixes.",x:"Fixation is costly, and legumes reduce it when mineral nitrogen is available. Ammonium inhibits nitrogenase and nitrate suppresses nodule formation, so fertiliser N largely replaces fixed N."},
{law:"bnf",sec:"intuition",src:"Brady & Weil, p. 621",q:"Why are actively fixing root nodules red or pink inside?",
 o:["They contain iron oxide","Leghaemoglobin binds oxygen, keeping it away from nitrogenase while still supplying respiration","The rhizobia are red","It is a sign of disease"],a:1,
 m:"Nitrogen fixation needs plenty of oxygen.",x:"Nitrogenase is destroyed by free O₂, yet the bacteria need oxygen for energy. Leghaemoglobin, almost identical to the haemoglobin in blood, resolves the conflict. White or green nodules are usually not fixing."},
{law:"bnf",sec:"field",src:"Paasonen-Kivekäs et al. 2016, pp. 194, 198",q:"Clover and lucerne can fix a few hundred kg N/ha a year in Nordic conditions. Why does biological fixation average only 3–7 kg N/ha across Finnish fields?",
 o:["Finnish clover fixes nothing","Legumes cover only a small share of the field area, and grasses and free-living fixers add little","The figure excludes all legumes","Cold soils destroy nitrogenase"],a:1,
 m:"Biological fixation is a major nitrogen input on all farmland.",x:"Fixation is concentrated where legumes grow. A field-level average hides very high inputs on leys and almost none on cereal fields."},
{law:"haber",sec:"intuition",q:"Lower temperature gives a higher equilibrium yield of ammonia. Why are Haber–Bosch reactors run at 400–500 °C?",
 o:["Higher temperature increases the equilibrium yield","At low temperature the reaction is too slow even with a catalyst, so a lower yield per pass is accepted and unreacted gas is recycled","The catalyst needs to melt","To produce more hydrogen"],a:1,
 m:"Le Chatelier's principle alone sets the best operating conditions.",x:"Equilibrium and rate pull in opposite directions for an exothermic reaction. Industrial conditions are a compromise, with only 10–20 % conversion per pass."},
{law:"haber",sec:"math",q:"Where does most of the energy use and CO₂ emission of conventional ammonia production come from?",
 o:["Compressing nitrogen","Producing hydrogen, usually from natural gas","Cooling the ammonia","Transporting the fertiliser"],a:1,
 m:"The ammonia synthesis step itself is what consumes the energy.",x:"Steam reforming of methane supplies the hydrogen and releases about 2 t CO₂ per tonne of ammonia. Hydrogen from electrolysis with renewable power removes most of that, which is why 'green ammonia' targets the hydrogen step."},
{law:"birkeland",sec:"math",q:"Raising pressure helps Haber–Bosch. Why did it not help the Birkeland–Eyde arc process?",
 o:["Arcs cannot run under pressure","N₂ + O₂ → 2 NO has the same number of gas molecules on both sides, so pressure does not shift the equilibrium; only very high temperature does, because the reaction is endothermic","Pressure destroys NO","It did help, doubling yields"],a:1,
 m:"High pressure favours every gas-phase synthesis.",x:"Le Chatelier's principle works through mole numbers and reaction enthalpy. The arc reaction is endothermic with no change in moles, so temperature is the only useful lever, followed by rapid quenching."},
{law:"birkeland",sec:"limits",q:"Why was the Birkeland–Eyde process built in Norway, and why was it abandoned?",
 o:["Norway had nitrate deposits","It needed enormous amounts of electricity, which Norwegian hydropower supplied cheaply; Haber–Bosch used several times less energy per tonne of N","It required cold air","It was banned elsewhere"],a:1,
 m:"Early industrial fixation failed because the chemistry did not work.",x:"The arc process worked, but at a very high energy cost. Norsk Hydro switched to Haber–Bosch ammonia from 1927, and the arc furnaces were shut down."},
{law:"frankcaro",sec:"field",q:"Calcium cyanamide (lime nitrogen) is spread on a field. Why is it applied some time before sowing?",
 o:["It needs to dry","Its breakdown intermediates are temporarily toxic to germinating seeds, weeds and nitrifiers before it turns into urea and ammonium","It contains no nitrogen until it rains","It is a herbicide only"],a:1,
 m:"All nitrogen fertilisers act the same way in soil.",x:"Cyanamide is hydrolysed via urea to ammonium over days to weeks. The temporary toxicity gives weed, slug and nitrification-inhibiting effects, and the calcium carbonate formed partly offsets the acidifying effect of nitrification."},
{law:"frankcaro",sec:"origin",q:"In which order did the three industrial routes for fixing atmospheric nitrogen become dominant?",
 o:["Haber–Bosch, then arc, then cyanamide","Cyanamide and the arc process in the 1900s–1910s, then Haber–Bosch from the 1920s","All three started together in the 1950s","Arc only; the others never left the laboratory"],a:1,
 m:"Haber–Bosch was the first industrial nitrogen fixation.",x:"The Frank–Caro (1898) and Birkeland–Eyde (1903) processes ran at industrial scale first. Both depended on cheap electricity, and Haber–Bosch, with its far lower energy need, displaced them between the World Wars."}

];

const SECNAMES={origin:"Origin",intuition:"Intuition",math:"The mathematics",field:"In the soil and field",limits:"Limits and misconceptions",watch:"Watch out"};
let reread={}; try{reread=JSON.parse(localStorage.getItem("gw-reread")||"{}")}catch(e){}
function saveReread(){try{localStorage.setItem("gw-reread",JSON.stringify(reread))}catch(e){}}
let quiz=null; /* {qs:[idx], i, score, answered, misses:[]} */
let brief={set:"all",i:0};

const byId=Object.fromEntries(L.map((x,i)=>[x.id,{...x,n:i+1}]));
let read={}; try{read=JSON.parse(localStorage.getItem("gw-read")||"{}")}catch(e){}
function saveRead(){try{localStorage.setItem("gw-read",JSON.stringify(read))}catch(e){}}
let view="lib",filter="all",query="",depth="skim",prevView="lib";
const main=document.getElementById("main");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=f=>`--c:var(--${f});--cb:var(--${f}-bg)`;

function progress(){const n=Object.keys(read).filter(k=>read[k]&&byId[k]).length;
  document.getElementById("progtxt").textContent=`${n} of ${L.length} read`;
  document.getElementById("progbar").style.width=(n/L.length*100)+"%";}

function setTabs(){document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view?"true":"false"))}

function renderLib(){
  const items=L.filter(x=>(filter==="all"||x.f===filter)&&(!query||(x.name+" "+x.s+" "+x.sym).toLowerCase().includes(query)));
  main.innerHTML=`<div class="filters">
    <button class="chip" data-f="all" aria-pressed="${filter==="all"}">All</button>
    ${Object.entries(FIELDS).map(([k,v])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}"><span class="dot" style="background:var(--${k})"></span>${v}</button>`).join("")}
    <input id="q" type="search" placeholder="Search laws" value="${esc(query)}" aria-label="Search laws">
  </div>
  <p class="legend-note">Shaded tiles are full articles; plain tiles are short entries. A dot marks what you have read.</p>
  <div class="grid">${items.map(tile).join("")||'<p>No laws match that search.</p>'}</div>`;
  main.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderLib()});
  const q=document.getElementById("q");q.oninput=()=>{query=q.value.toLowerCase().trim();const pos=q.selectionStart;renderLib();const nq=document.getElementById("q");nq.focus();nq.setSelectionRange(pos,pos)};
  bindOpen();
}
function tile(x){const n=byId[x.id].n;return `<button class="tile ${x.full?"full":""}" style="${col(x.f)}" data-open="${x.id}">
  ${read[x.id]?'<span class="read" aria-label="read"></span>':""}
  <span class="no"><span>${String(n).padStart(2,"0")}</span><span class="badge">${x.full?"Article":""}</span></span>
  <span class="sym">${esc(x.sym)}</span><span class="nm">${esc(x.name)}</span><span class="yr">${esc(x.yr)}</span></button>`}
function bindOpen(){main.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openArticle(b.dataset.open))}

/* concept map: deterministic force layout */
let layout=null;
function computeLayout(){
  const W=1100,H=820,centers={phys:[210,190],chem:[550,160],soil:[890,210],env:[210,630],meth:[550,660],econ:[890,620]};
  const nodes=L.map((x,i)=>{const c=centers[x.f];const a=i*2.399;return{id:x.id,f:x.f,x:c[0]+Math.cos(a)*60,y:c[1]+Math.sin(a)*60,vx:0,vy:0}});
  const idx=Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
  const es=new Set();L.forEach(x=>(x.links||[]).forEach(t=>{if(idx[t]!==undefined){es.add([x.id,t].sort().join("|"))}}));
  const edges=[...es].map(s=>s.split("|").map(k=>idx[k]));
  for(let it=0;it<400;it++){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);
      const f=3400/d2;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;}
    edges.forEach(([i,j])=>{const a=nodes[i],b=nodes[j];const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01;const f=(d-95)*.02;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;});
    nodes.forEach(n=>{const c=centers[n.f];n.vx+=(c[0]-n.x)*.012;n.vy+=(c[1]-n.y)*.012;n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.6;n.vy*=.6;
      n.x=Math.max(40,Math.min(W-40,n.x));n.y=Math.max(36,Math.min(H-40,n.y));});
  }
  layout={nodes,edges,W,H};
}
function renderMap(){
  if(!layout)computeLayout();
  const {nodes,edges,W,H}=layout;
  main.innerHTML=`<div class="filters">${Object.entries(FIELDS).map(([k,v])=>`<span class="chip" style="cursor:default"><span class="dot" style="background:var(--${k})"></span>${v}</span>`).join("")}</div>
  <div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of how the laws connect">
  ${edges.map(([i,j])=>`<line class="edge" data-a="${nodes[i].id}" data-b="${nodes[j].id}" x1="${nodes[i].x.toFixed(1)}" y1="${nodes[i].y.toFixed(1)}" x2="${nodes[j].x.toFixed(1)}" y2="${nodes[j].y.toFixed(1)}"/>`).join("")}
  ${nodes.map(n=>{const x=byId[n.id];const r=x.full?20:15;return `<g class="node${x.full?" full":""}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(x.name)}" transform="translate(${n.x.toFixed(1)},${n.y.toFixed(1)})">
    <circle r="${r}" fill="var(--${n.f}-bg)" stroke="var(--${n.f})" stroke-width="${x.full?2.5:1.5}"/>
    <text text-anchor="middle" dy="4" style="font-weight:800;font-size:${x.full?12:10}px;fill:var(--${n.f})">${esc(x.sym)}</text>
    <text class="lbl" text-anchor="middle" dy="${r+13}" style="font-size:10.5px">${esc(short(x.name))}</text></g>`}).join("")}
  </svg></div>
  <p class="mapinfo" id="mapinfo">Hover or focus a law to see its connections and their names. Click to read it. Larger, labelled rings are full articles.</p>`;
  const svg=main.querySelector("svg");
  svg.querySelectorAll("g.node").forEach(g=>{
    const id=g.dataset.id;
    const on=()=>{const nb=new Set([id]);svg.querySelectorAll(".edge").forEach(e=>{const hit=e.dataset.a===id||e.dataset.b===id;e.classList.toggle("on",hit);if(hit){nb.add(e.dataset.a);nb.add(e.dataset.b)}});
      svg.querySelectorAll("g.node").forEach(o=>{o.classList.toggle("dim",!nb.has(o.dataset.id));o.classList.toggle("lit",nb.has(o.dataset.id))});
      document.getElementById("mapinfo").textContent=`${byId[id].name}: ${byId[id].s}`};
    const off=()=>{svg.querySelectorAll(".edge").forEach(e=>e.classList.remove("on"));svg.querySelectorAll("g.node").forEach(o=>o.classList.remove("dim","lit"))};
    g.onmouseenter=on;g.onfocus=on;g.onmouseleave=off;g.onblur=off;
    g.onclick=()=>openArticle(id);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openArticle(id)}};
  });
}
function short(n){return n.replace(/ \(.*\)/,"").replace(/ law of thermodynamics/," law").replace(/ and the elements/,"").replace(/ and the redox ladder/,"").replace(/ and acidity/,"")}

function renderPaths(){
  main.innerHTML=`<div class="paths">${PATHS.map((p,pi)=>{const done=p.ids.filter(i=>read[i]).length;return `<article class="path">
    <h3>${esc(p.t)}</h3><p>${esc(p.d)}</p>
    <div class="pbar"><div class="bar"><i style="width:${done/p.ids.length*100}%"></i></div><span>${done}/${p.ids.length}</span></div>
    <ol>${p.ids.map(i=>`<li class="${read[i]?"done":""}"><button data-open="${i}" data-path="${pi}">${esc(byId[i].name)}</button>${read[i]?' <span class="ck">read</span>':""}</li>`).join("")}</ol>
  </article>`}).join("")}</div>`;
  main.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openArticle(b.dataset.open,+b.dataset.path));
}

/* Briefs: one card per law */
function briefIds(){return brief.set==="all"?L.map(x=>x.id):PATHS[+brief.set].ids}
function firstSentence(t){const m=t.match(/^.*?[.!?](\s|$)/);return m?m[0].trim():t}
function renderBrief(){
  const ids=briefIds(); if(brief.i>=ids.length)brief.i=0;
  const x=byId[ids[brief.i]];
  main.innerHTML=`<div class="bwrap">
    <div class="btools"><label for="bset">Deck</label><select id="bset"><option value="all">All laws (${L.length})</option>${PATHS.map((p,i)=>`<option value="${i}" ${brief.set===String(i)?"selected":""}>${esc(p.t)} (${p.ids.length})</option>`).join("")}</select><span style="margin-left:auto">${brief.i+1} / ${ids.length}</span></div>
    <article class="card" id="bcard" style="${col(x.f)}">
      <div class="top"><span class="bsym">${esc(x.sym)}</span><div><div class="a-meta">${FIELDS[x.f]} · ${esc(x.yr)}</div><h2>${esc(x.name)}</h2></div></div>
      <p class="lede">${esc(x.s)}</p>
      ${x.eq?`<div class="eq">${esc(x.eq)}</div>`:""}
      <div><h4>Key point</h4><p>${esc(x.full?x.skim:x.field)}</p></div>
      ${(x.full||x.watch)?`<div class="warn"><h4>Watch out</h4><p>${esc(x.full?firstSentence(x.limits):x.watch)}</p></div>`:""}
      ${reread[x.id]?`<p class="rbanner" style="margin:0">You missed a quiz question on this one.</p>`:""}
    </article>
    <div class="bnav">
      <button class="btn" id="bprev" ${brief.i===0?"disabled":""}>← Previous</button>
      <button class="btn pri" data-open="${x.id}">${x.full?"Read full article":"Open entry"}</button>
      <button class="btn" id="bnext" ${brief.i===ids.length-1?"disabled":""}>Next →</button>
    </div>
    <p class="legend-note" style="text-align:center">Swipe or use the arrow keys to move between briefs.</p>
  </div>`;
  document.getElementById("bset").onchange=e=>{brief.set=e.target.value;brief.i=0;renderBrief()};
  document.getElementById("bprev").onclick=()=>{brief.i--;renderBrief()};
  document.getElementById("bnext").onclick=()=>{brief.i++;renderBrief()};
  main.querySelector("[data-open]").onclick=()=>openArticle(x.id);
  const c=document.getElementById("bcard");let sx=null;
  c.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  c.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
    if(dx<-50&&brief.i<ids.length-1){brief.i++;renderBrief()}else if(dx>50&&brief.i>0){brief.i--;renderBrief()}});
}
document.addEventListener("keydown",e=>{if(view!=="brief"||/INPUT|SELECT/.test(document.activeElement.tagName))return;
  const n=briefIds().length;if(e.key==="ArrowRight"&&brief.i<n-1){brief.i++;renderBrief()}if(e.key==="ArrowLeft"&&brief.i>0){brief.i--;renderBrief()}});

/* Quiz */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(n,ids){let pool=QUIZ.map((_,i)=>i);if(ids)pool=pool.filter(i=>ids.includes(QUIZ[i].law));
  quiz={qs:shuffle(pool).slice(0,n||pool.length),i:0,score:0,answered:null,misses:[],perm:null};renderQuiz()}
function renderQuiz(){
  if(!quiz){
    const rr=Object.keys(reread).filter(k=>byId[k]);
    main.innerHTML=`<div class="qhome">
      <section class="panel"><h3>Misconception quiz</h3>
        <p>${QUIZ.length} questions, each built around a common mistake. A wrong answer explains the misconception and points you to the exact section to reread.</p>
        <div class="bnav" style="justify-content:flex-start"><button class="btn pri" id="q10">Quick round · 10</button><button class="btn" id="qall">All ${QUIZ.length}</button></div>
        <label class="a-meta" for="qpath" style="margin-top:6px">Or quiz one reading path</label>
        <select id="qpath"><option value="">Choose a path…</option>${PATHS.map((p,i)=>{const c=QUIZ.filter(q=>p.ids.includes(q.law)).length;return c?`<option value="${i}">${esc(p.t)} (${c})</option>`:""}).join("")}</select>
      </section>
      <section class="panel"><h3>To reread</h3>
        ${rr.length?`<p>Principles you missed. Marking the article as read clears it from this list.</p><ul class="rr">${rr.map(k=>`<li><span>${esc(byId[k].name)}<small>${esc(SECNAMES[reread[k]]||"Full article")}</small></span><button class="btn" data-rr="${k}">Reread</button></li>`).join("")}</ul>`
        :`<p>Nothing to reread yet. Principles you get wrong in the quiz will collect here.</p>`}
      </section></div>`;
    document.getElementById("q10").onclick=()=>startQuiz(10);
    document.getElementById("qall").onclick=()=>startQuiz();
    document.getElementById("qpath").onchange=e=>{if(e.target.value!=="")startQuiz(0,PATHS[+e.target.value].ids)};
    main.querySelectorAll("[data-rr]").forEach(b=>b.onclick=()=>openArticle(b.dataset.rr,undefined,reread[b.dataset.rr]));
    return;
  }
  if(quiz.i>=quiz.qs.length){
    const tot=quiz.qs.length,miss=[...new Set(quiz.misses)];
    main.innerHTML=`<div class="qwrap"><section class="panel">
      <span class="a-meta">Round complete</span><div class="score">${quiz.score} / ${tot}</div>
      <p>${quiz.score===tot?"Every misconception avoided.":`You missed ${tot-quiz.score} question${tot-quiz.score>1?"s":""}. Reread these before the next round:`}</p>
      ${miss.length?`<ul class="rr">${miss.map(m=>{const [k,s]=m.split(":");return `<li><span>${esc(byId[k].name)}<small>${esc(SECNAMES[s]||"")}</small></span><button class="btn" data-rr="${k}" data-sec="${s}">Reread</button></li>`}).join("")}</ul>`:""}
      <div class="bnav" style="justify-content:flex-start"><button class="btn pri" id="again">New round</button><button class="btn" id="qhome">Quiz home</button></div>
    </section></div>`;
    document.getElementById("again").onclick=()=>startQuiz(10);
    document.getElementById("qhome").onclick=()=>{quiz=null;renderQuiz()};
    main.querySelectorAll("[data-rr]").forEach(b=>b.onclick=()=>openArticle(b.dataset.rr,undefined,b.dataset.sec));
    return;
  }
  const Q=QUIZ[quiz.qs[quiz.i]],x=byId[Q.law],ans=quiz.answered;
  if(!quiz.perm||quiz.perm.qi!==quiz.qs[quiz.i])quiz.perm={qi:quiz.qs[quiz.i],order:shuffle(Q.o.map((_,i)=>i))};
  const ord=quiz.perm.order,shownA=ord.indexOf(Q.a);
  main.innerHTML=`<div class="qwrap">
    <div class="qhead"><span>Question ${quiz.i+1} of ${quiz.qs.length}</span><span>Score ${quiz.score}</span></div>
    <div class="bar"><i style="width:${quiz.i/quiz.qs.length*100}%"></i></div>
    <section class="qcard" style="${col(x.f)}">
      <span class="tag">${esc(x.name)}</span>
      <h2>${esc(Q.q)}</h2>
      <div class="opts">${ord.map((oi,pos)=>`<button class="opt ${ans!==null?(oi===Q.a?"right":oi===ans?"wrong":""):""}" data-i="${oi}" ${ans!==null?"disabled":""}><span class="k">${"ABCD"[pos]}</span><span>${esc(Q.o[oi])}</span></button>`).join("")}</div>
      ${ans!==null?`<div class="fb ${ans===Q.a?"":"miss"}" role="status">
        <strong>${ans===Q.a?"Correct.":"Not quite. The answer is "+"ABCD"[shownA]+"."}</strong>
        <p>${esc(Q.x)}</p>
        <p class="mc"><b>Common misconception:</b> ${esc(Q.m)}</p>
        ${Q.src?`<p class="mc"><b>Source:</b> ${esc(Q.src)}</p>`:""}
        <div class="acts">
          ${ans!==Q.a?`<button class="btn" id="qreread">Reread: ${esc(SECNAMES[Q.sec])}</button>`:""}
          <button class="btn pri" id="qnext">${quiz.i===quiz.qs.length-1?"See results":"Next question →"}</button>
        </div></div>`:""}
    </section>
    <button class="btn" id="qquit" style="align-self:flex-start">End round</button>
  </div>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;quiz.answered=i;
    if(i===Q.a)quiz.score++;else{quiz.misses.push(Q.law+":"+Q.sec);reread[Q.law]=Q.sec;saveReread()}
    renderQuiz();const f=main.querySelector(".fb");if(f)f.scrollIntoView({block:"nearest",behavior:"smooth"})});
  const nx=document.getElementById("qnext");if(nx)nx.onclick=()=>{quiz.i++;quiz.answered=null;quiz.perm=null;renderQuiz();window.scrollTo({top:0})};
  const rb=document.getElementById("qreread");if(rb)rb.onclick=()=>openArticle(Q.law,undefined,Q.sec);
  document.getElementById("qquit").onclick=()=>{quiz.qs=quiz.qs.slice(0,quiz.i+(quiz.answered!==null?1:0));quiz.i=quiz.qs.length;quiz.answered=null;if(!quiz.qs.length)quiz=null;renderQuiz()};
}

let curPath=null;
function para(t){return t.split("\n").map(l=>l.startsWith("•")?l:`<p>${esc(l)}</p>`).join("").replace(/(•[^<]*)/g,"")}
function body(t){ const lines=t.split("\n");let html="",list=[];const flush=()=>{if(list.length){html+=`<ul>${list.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`;list=[]}};lines.forEach(l=>{if(/^•/.test(l))list.push(l.replace(/^•\s*/,""));else{flush();if(l.trim())html+=`<p>${esc(l)}</p>`}});flush();return html}

function openArticle(id,pathIdx,secKey){
  const x=byId[id]; if(!x)return;
  if(secKey==="math")depth="full";
  if(view!=="article")prevView=view; view="article"; setTabs();
  if(pathIdx!==undefined)curPath=pathIdx; else if(curPath!==null&&!PATHS[curPath].ids.includes(id))curPath=null;
  try{history.replaceState(null,"","#"+id)}catch(e){}
  const links=(x.links||[]).filter(k=>byId[k]).map(k=>`<button data-open="${k}" style="--lc:var(--${byId[k].f})"><b>${esc(byId[k].sym)}</b>${esc(byId[k].name)}</button>`).join("");
  let nav="";
  if(curPath!==null){const ids=PATHS[curPath].ids,i=ids.indexOf(id);
    nav=`<span class="nav">${i>0?`<button data-open="${ids[i-1]}" data-path="${curPath}">← Previous</button>`:""}${i<ids.length-1?`<button data-open="${ids[i+1]}" data-path="${curPath}">Next →</button>`:""}</span>`}
  const sec=(k,h,c)=>`<section id="sec-${k}"><h3>${h}</h3>${c}</section>`;
  const backLbl={map:"map",paths:"reading paths",brief:"briefs",quiz:"quiz"}[prevView]||"library";
  main.innerHTML=`<div class="article" style="${col(x.f)}">
    <button class="back" id="back">← Back to ${backLbl}</button>
    ${curPath!==null?`<p class="a-meta" style="margin:-10px 0 14px">Path · ${esc(PATHS[curPath].t)} · ${PATHS[curPath].ids.indexOf(id)+1} of ${PATHS[curPath].ids.length}</p>`:""}
    <div class="a-head"><div class="a-sym">${esc(x.sym)}</div>
      <div class="a-meta">${FIELDS[x.f]} · ${esc(x.yr)}${x.who?" · "+esc(x.who):""}</div>
      <h2>${esc(x.name)}</h2></div>
    ${reread[id]?`<p class="rbanner">Flagged from the quiz. Reread <b>${esc(SECNAMES[reread[id]]||"the article")}</b>, then mark the article as read to clear it.</p>`:""}
    <p class="lede">${esc(x.s)}</p>
    ${x.eq?`<div class="eq">${esc(x.eq)}</div>`:""}
    ${x.full?`
      ${sec("origin","Origin",body(x.origin))}
      ${sec("intuition","Intuition",body(x.intuition))}
      ${sec("math","The mathematics",`<div class="depth" role="group" aria-label="Depth"><button data-d="skim" aria-pressed="${depth==="skim"}">Skim</button><button data-d="full" aria-pressed="${depth==="full"}">Full</button></div><div id="mathbody">${body(depth==="skim"?x.skim:x.math)}</div>`)}
      ${sec("field","In the soil and field",body(x.field))}
      ${sec("limits","Limits and misconceptions",body(x.limits))}
      ${sec("reading","Further reading",`<ul>${x.read.map(r=>`<li><i>${esc(r[0])}</i>${r[1]?" — "+esc(r[1]):""}</li>`).join("")}</ul>`)}
    `:`
      ${sec("field","In the soil and field",body(x.field))}
      ${x.watch?sec("watch","Watch out",body(x.watch)):""}
      <p class="stubnote">Short entry. The full article with origin, intuition, mathematics and limits is still to be written.</p>
    `}
    ${links?sec("links","Connected laws",`<div class="links">${links}</div>`):""}
    <div class="mark"><button id="markbtn" class="${read[id]?"done":""}">${read[id]?"Read ✓ (undo)":"Mark as read"}</button>${nav}</div>
  </div>`;
  const target=secKey&&document.getElementById("sec-"+secKey);
  if(target){target.scrollIntoView({block:"start"});target.classList.add("hl")}else window.scrollTo({top:0});
  document.getElementById("back").onclick=()=>{curPath=prevView==="paths"?curPath:null;try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}show(prevView)};
  main.querySelectorAll(".depth button").forEach(b=>b.onclick=()=>{depth=b.dataset.d;main.querySelectorAll(".depth button").forEach(o=>o.setAttribute("aria-pressed",o.dataset.d===depth));document.getElementById("mathbody").innerHTML=body(depth==="skim"?x.skim:x.math)});
  document.getElementById("markbtn").onclick=()=>{read[id]=!read[id];if(!read[id])delete read[id];else if(reread[id]){delete reread[id];saveReread()}saveRead();progress();openArticle(id)};
  main.querySelectorAll(".links [data-open], .nav [data-open]").forEach(b=>b.onclick=()=>openArticle(b.dataset.open,b.dataset.path!==undefined?+b.dataset.path:undefined));
}

function show(v){view=v;setTabs();window.scrollTo({top:0});({lib:renderLib,map:renderMap,paths:renderPaths,brief:renderBrief,quiz:renderQuiz}[v]||renderLib)();}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{curPath=null;try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}show(b.dataset.view)});
progress();
const h=location.hash.slice(1);
if(byId[h])openArticle(h);else if(["map","paths","brief","quiz"].includes(h))show(h);else show("lib");
</script>
