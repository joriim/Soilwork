 o:["Yes, life is a local exception to the law","No, they are open systems that export more entropy than they build, paid for by sunlight","No, because the second law only applies to gases","Yes, but only during photosynthesis"],a:1,
 m:"Order anywhere means the second law is broken.",x:"The law applies to isolated systems. Organisms take in low-entropy energy (sunlight or food) and release heat and waste, so total entropy still increases."},
{law:"th2",sec:"limits",q:"Decomposition of peat to CO₂ has a strongly negative ΔG. Why do peatlands persist for thousands of years?",
 o:["The second law does not apply to organic matter","Negative ΔG means the reaction is slow","Thermodynamics sets direction, not rate; cold, waterlogged, anoxic conditions make it kinetically very slow","Peat is at equilibrium with CO₂"],a:2,
 m:"Thermodynamically favourable means it will happen quickly.",x:"ΔG tells you whether a process can run, not how fast. Low temperature, lack of oxygen and acidity slow the microbes, so peat accumulates despite being thermodynamically unstable."},
{law:"th1",sec:"field",q:"An eddy-covariance tower finds that H + λE + G is 20 % less than net radiation. What does this mean?",
 o:["20 % of the energy was destroyed","The site violates the first law","Some energy flux is unmeasured or measured with error, such as storage or large eddies","Net radiation is always overestimated by 20 %"],a:2,
 m:"An imbalance shows energy can disappear.",x:"Energy is conserved, so a gap points to missing terms: heat storage in canopy and soil, advection, or eddies the instrument cannot capture. The energy-balance closure problem is a measurement problem."},
{law:"th0",sec:"field",q:"A soil temperature logger sits in an unshaded plastic housing at the surface. What does it actually measure?",
 o:["The soil temperature, because it touches the soil","The temperature of whatever it has reached equilibrium with, mostly its sun-heated housing","The air temperature","The average of soil and air"],a:1,
 m:"A thermometer reads the temperature of what it is placed in.",x:"A sensor reads its own temperature. It matches the soil only once it has equilibrated with the soil. Radiation heating and slow response break that assumption."},
{law:"th3",sec:"field",q:"Does ordinary ice have zero entropy at absolute zero?",
 o:["Yes, every solid does","No, its hydrogen atoms stay disordered, leaving residual entropy","No, because ice melts before 0 K","Yes, but only pure ice"],a:1,
 m:"The third law applies to every solid.",x:"The third law applies to perfect, equilibrated crystals. In ice the hydrogen atoms can sit in many arrangements, so some entropy remains at 0 K, as Pauling showed in 1935."},
{law:"minimum",sec:"field",q:"Phosphorus limits a crop. You double the nitrogen rate. What is the most likely result?",
 o:["Yield rises in proportion to the nitrogen","Little or no yield gain, and more surplus nitrogen at risk of loss","Yield falls because nitrogen blocks phosphorus","Phosphorus limitation disappears"],a:1,
 m:"More fertiliser always means more yield.",x:"Growth follows the limiting factor. Nitrogen beyond what the phosphorus supply allows is not used, and that surplus can leach or be lost as N₂O."},
{law:"minimum",sec:"origin",q:"Who first stated the law of the minimum?",
 o:["Justus von Liebig","Carl Sprengel","Eilhard Mitscherlich","Jean-Baptiste Boussingault"],a:1,
 m:"It is Liebig's law.",x:"Carl Sprengel stated it in 1828. Liebig popularised it from 1840, and the name Sprengel–Liebig law corrects the attribution."},
{law:"minimum",sec:"limits",q:"In a field experiment, adding nitrogen increases the yield response to phosphorus. What does this show?",
 o:["The experiment was faulty","Co-limitation: resources interact, so the strict single-factor law is only an approximation","Nitrogen was never limiting","The law of the minimum is false"],a:1,
 m:"Only one factor can be limiting at any time.",x:"Co-limitation is common. Plants partly compensate for a scarce resource, and nutrients interact, so real responses sit between the strict minimum function and smooth diminishing returns."},
{law:"jevons",sec:"limits",q:"A technology halves the fuel needed per unit of service. What happens to total fuel use?",
 o:["It always halves","It always increases","It depends on how much demand rises when the service becomes cheaper","It is unchanged"],a:2,
 m:"Jevons proves efficiency always backfires.",x:"The outcome depends on the rebound. Small rebound means real savings; rebound above 100 % (backfire) increases use. It must be measured case by case."},
{law:"jevons",sec:"field",q:"A region subsidises drip irrigation to save water. What has often happened at basin scale?",
 o:["Water use fell by the expected amount","Farmers expanded irrigated area or grew thirstier crops, and basin water use stayed level or rose","Groundwater recharge increased","Drip irrigation was abandoned"],a:1,
 m:"Water saved on a field is water saved in the basin.",x:"Lower water need per hectare lowered the cost of irrigating, so area and consumptive use grew, and less water returned as runoff and recharge. Efficiency needs a cap on total use."},
{law:"elements",sec:"origin",q:"What is the periodic table ordered by?",
 o:["Atomic mass","Atomic number, the number of protons","Date of discovery","Density"],a:1,
 m:"Mendeleev ordered by mass, so the table is ordered by mass.",x:"Mendeleev used atomic mass but swapped some pairs to keep families together. Moseley showed in 1913 that the true order is atomic number."},
{law:"elements",sec:"field",q:"Why can crops take up cadmium from soil even though it has no biological function?",
 o:["Cadmium is an essential micronutrient","Cadmium resembles zinc, a periodic-table neighbour, and enters through zinc uptake routes","Plants actively seek cadmium","Cadmium is only taken up through leaves"],a:1,
 m:"Plants take up only the elements they need.",x:"Elements with similar charge and size behave alike. Cd²⁺ mimics Zn²⁺, so zinc transporters take it in, especially in acid soils where it is more soluble."},
{law:"capillarity",sec:"field",q:"Which pores drain first when a saturated soil dries?",
 o:["The smallest pores","The largest pores","All pores drain together","Pores in clay before pores in sand"],a:1,
 m:"Small pores lose water first because they hold less.",x:"Capillary suction scales with 1/r. Large pores hold water weakly and empty first; small pores keep water to much higher suction."},
{law:"schulze",sec:"field",q:"Which cation helps clay flocculate and keeps soil structure stable?",
 o:["Sodium","Potassium","Calcium","Ammonium"],a:2,
 m:"Any salt will hold clay together.",x:"Flocculating power rises steeply with charge. Divalent Ca²⁺ compresses the double layer far more than monovalent ions; sodium does the opposite and disperses clay."},
{law:"cn",sec:"field",q:"Cereal straw with C:N around 80 is ploughed in before sowing. What happens to soil mineral nitrogen in the following weeks?",
 o:["It increases as the straw decomposes","It decreases because microbes immobilise nitrogen to decompose the straw","It is unaffected","It is lost as N₂ gas"],a:1,
 m:"Adding organic matter always releases nitrogen.",x:"Above a C:N of about 25, decomposers need more nitrogen than the residue supplies, so they take it from the soil. Net release only begins later."},
{law:"stokes",sec:"field",q:"A particle half the diameter of another settles in water. How does its settling speed compare?",
 o:["Half as fast","A quarter as fast","An eighth as fast","The same, if density is equal"],a:1,
 m:"Settling speed is proportional to size.",x:"Stokes' law gives speed proportional to d². Halving the diameter quarters the speed, which is why clay stays suspended for hours while sand drops in seconds."},
{law:"goodhart",sec:"field",q:"A carbon programme pays for measured soil carbon gains at a few fixed sampling points. What is the main risk?",
 o:["There is no risk if the lab is accredited","Management may target the sampled points or timing, so the metric stops reflecting the field","Carbon cannot be measured","Payment will always be too low"],a:1,
 m:"A precise measurement guarantees a good indicator.",x:"Once a metric is rewarded, behaviour adapts to it. Randomised, unannounced sampling and independent verification keep the measure honest."},
/* ---- From Paasonen-Kivekäs et al. (2016) Maan vesi- ja ravinnetalous ---- */
{law:"cec",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 133",q:"Exchangeable Ca²⁺, Mg²⁺, K⁺ and Na⁺ are traditionally called 'base cations'. Why is the term misleading?",
 o:["They are not bases; in modern terms they are non-acidic exchangeable cations, and soils rich in them are alkaline only because acidic cations are absent","They are the most basic elements in the periodic table","They react with water to form strong bases that raise pH","They are rare in Finnish soils"],a:0,
 m:"Base cations neutralise acidity by themselves.",x:"These cations do not consume H⁺. The Finnish text recommends calling them exchangeable alkali and alkaline-earth cations; base saturation simply measures how little of the CEC is held by H⁺ and Al³⁺."},
{law:"redox",sec:"field",src:"Paasonen-Kivekäs et al. 2016, pp. 152–153",q:"A field soil stays waterlogged for several weeks. What tends to happen to its pH?",
 o:["It falls, because flooding acidifies the soil","It rises toward neutral, because reduction reactions consume H⁺","It is unaffected by redox conditions","It rises far above 9"],a:1,
 m:"Waterlogging makes soil more acidic.",x:"pe + pH stays roughly constant, so as the soil becomes reduced, pH rises. Oxidation does the opposite. CO₂ that builds up in wet soil forms carbonic acid and damps the rise."},
{law:"redox",sec:"math",src:"Paasonen-Kivekäs et al. 2016, pp. 152–154",q:"As oxygen runs out in a wet soil, which reduced metal ion appears first in the soil water?",
 o:["Fe²⁺","Mn²⁺","Al³⁺","Cu⁺"],a:1,
 m:"Iron is the first metal to respond to waterlogging.",x:"Manganese is reduced at a higher redox potential than iron, so soluble Mn²⁺ rises before Fe²⁺ and stays dissolved longer as conditions improve. That makes Mn the more sensitive indicator."},
{law:"redox",sec:"field",src:"Paasonen-Kivekäs et al. 2016, pp. 154–155",q:"What is the pH of sulfide-rich Litorina sediments that still lie below the water table on the Ostrobothnian coast?",
 o:["Usually below 4","Near neutral, sometimes alkaline; acidity appears only once drainage or excavation exposes the sulfides to oxygen","Always exactly 7","Above 10, because of sea salts"],a:1,
 m:"Acid sulfate soils are acidic throughout.",x:"Pyrite is stable without oxygen. Oxidation of the sulfides produces sulfuric acid, so the acid problem is created by deep drainage, ditching and excavation, which bring these layers into contact with air."},
{law:"redox",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 348",q:"Why can controlled drainage reduce acid runoff from acid sulfate soils?",
 o:["The drain wells add lime to the water","The raised water table slows oxygen entry into the sulfide layers, so less sulfuric acid forms","Irrigation water dilutes the acid","It removes sulfate from the soil"],a:1,
 m:"Acid runoff can only be treated after it leaves the field.",x:"Keeping the potentially acidic layers water-saturated prevents sulfide oxidation at its source. The effect depends on how high and how long the water table is held up, and sub-irrigation can keep it up even in dry periods."},
{law:"redox",sec:"field",src:"Paasonen-Kivekäs et al. 2016, pp. 184–185",q:"A soil becomes anoxic. Which phosphorus-binding surfaces lose their capacity?",
 o:["Aluminium oxides","Iron(III) oxides, which dissolve as Fe²⁺","Both equally","Clay mineral edges only"],a:1,
 m:"All oxide surfaces release phosphorus when the soil is waterlogged.",x:"Reduction of Fe(III) to Fe²⁺ dissolves the iron oxides and releases their phosphate, while Al oxides keep binding P even when oxygen is poor. The same mechanism drives internal loading from anoxic lake sediments."},
{law:"mass",sec:"field",src:"Paasonen-Kivekäs et al. 2016, pp. 347–348",q:"In US field studies, controlled drainage cut nitrogen loads from drains by about 45 %. What was the main reason?",
 o:["Much lower nitrate concentrations in the drain water","Less water left through the drains, while concentrations changed little","Crops took up 45 % more nitrogen","Nitrogen was converted to ammonia"],a:1,
 m:"Water-protection measures work by cleaning the water.",x:"A load is concentration times flow. Most studies found little change in drain-water N or P concentrations; the reduction came mainly from smaller drain outflow."},
{law:"mass",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 201",q:"When does most nutrient leaching from Finnish fields happen?",
 o:["During midsummer thunderstorms","During snowmelt and autumn rains, when fields are bare or crops are dormant","In midwinter under frozen soil","Evenly through the year"],a:1,
 m:"Losses happen mainly when the crop is growing and fertiliser is fresh.",x:"Most annual runoff, and with it most nutrient load, comes at snowmelt and in autumn. Crop residues and autumn tillage add mineral nitrogen just before this period."},
{law:"pcycle",sec:"watch",src:"Paasonen-Kivekäs et al. 2016, p. 189",q:"Phosphorus binds strongly to Finnish mineral soils, yet fields lose dissolved phosphorus in runoff. How?",
 o:["Binding is weak in clay soils","Runoff surrounds soil particles with much dilute, low-salt water, so they release P to restore equilibrium, like a continuous extraction","Fertiliser P never binds in the first place","Groundwater carries P upward to the surface"],a:1,
 m:"Strongly bound phosphorus cannot be lost in dissolved form.",x:"In the soil, little water and fairly saline soil solution keep dissolved P low. A flood raises the water-to-soil ratio and dilutes the salts, so particles keep desorbing P, both on the field and after they reach the water."},
{law:"pcycle",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 188",q:"In what form is most phosphorus lost from Finnish mineral-soil fields?",
 o:["Bound to eroded particles, often over 90 % of the load","As dissolved phosphate in drain water","As phosphine gas","By leaching to groundwater"],a:0,
 m:"Phosphorus losses are mostly dissolved phosphate.",x:"Particulate P dominates losses from mineral soils. Part of it can later desorb in the water, and iron-bound P is released if the sediment becomes anoxic."},
{law:"pcycle",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 187",q:"A ploughed field is converted to permanent grass to cut erosion. What happens to dissolved phosphorus in runoff?",
 o:["It falls as sharply as particulate P","Its share rises, because P is released from plant residues and frost-damaged plant cells","It disappears entirely","Grass roots bind all the dissolved P"],a:1,
 m:"Plant cover reduces every kind of phosphorus loss.",x:"In Jokioinen trials, two thirds of the P lost from grass ley was dissolved, against one third from barley. Plant cover reduces erosion but adds dissolved P, especially at snowmelt."},
{law:"pcycle",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 187",q:"Why do thick peat soils lose readily soluble phosphorus fertiliser so easily?",
 o:["Peat has almost no Al and Fe oxides to bind phosphate","Peat is too acidic for P to dissolve","Its high CEC repels phosphate","Peat freezes more deeply"],a:0,
 m:"Organic soils hold every nutrient well.",x:"Phosphate is held by Al and Fe oxides, which peat lacks. Slow-release fertilisers are used on peat, and adding clay to peat (saveaminen) improves both P and K retention."},
{law:"pcycle",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 184",q:"A field has a good soil-test P value, but the crop shows phosphorus deficiency. Which explanation fits best?",
 o:["The soil test must be wrong","Phosphorus barely moves in soil, so compaction or wetness that limits root growth also limits P uptake","Organic matter blocks all P uptake","The phosphorus has leached away"],a:1,
 m:"A good soil-test value guarantees supply.",x:"Because P moves so little, the crop gets it mainly where roots grow. Soil structure, aeration and water availability therefore control how much of the measured P a crop can use."},
{law:"minimum",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 200",q:"Phosphorus limits algal growth in most Finnish lakes. What can happen if only the nitrogen load is cut in an already eutrophic lake?",
 o:["Algae decline in every case","Nitrogen-fixing cyanobacteria may increase, because they take nitrogen from the air","Phosphorus stops being limiting","Nothing, since nitrogen plays no role"],a:1,
 m:"Cutting any nutrient reduces algal growth.",x:"Removing nitrogen favours organisms that fix it themselves. Some cyanobacteria are toxic, which is why phosphorus control is the priority for most Finnish inland waters."},
{law:"cn",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 192",q:"What share of topsoil nitrogen is typically in organic form?",
 o:["More than 90 %","About 50 %","About 25 %","Less than 10 %"],a:0,
 m:"Most soil nitrogen is nitrate and ammonium.",x:"Only a few per cent of soil N is mineral. Roughly 1–3 % of the organic N is mineralised each year, which in Finnish barley fields supplies about half of the crop's N."},
{law:"cn",sec:"field",src:"Paasonen-Kivekäs et al. 2016, pp. 194–195",q:"Which mineral nitrogen form tends to accumulate in cold, wet spring soils?",
 o:["Nitrate","Ammonium, because mineralisation continues in cold or oxygen-poor soil while nitrification needs oxygen and warmth","Nitrite","Nitrous oxide"],a:1,
 m:"Mineral nitrogen in soil is always mostly nitrate.",x:"Ammonification works under aerobic and anaerobic conditions and even in nearly frozen soil. Nitrifying bacteria need oxygen and are sensitive to cold and acidity, so ammonium builds up."},
{law:"fick",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 195",q:"Above about what water-filled pore space does nitrification slow sharply?",
 o:["20 %","60 %","90 %","Only at 100 %"],a:1,
 m:"Wetter soil always means more microbial activity.",x:"Between wilting point and field capacity, more water speeds up N transformations. Above about 60 % water-filled pore space, oxygen diffusion into the soil drops off and nitrification slows."},
{law:"fick",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 152",q:"How much faster does oxygen diffuse through air than through water?",
 o:["About 10 times","About 100 times","About 10 000 times","At the same rate"],a:2,
 m:"A thin water film barely slows oxygen supply.",x:"Gas exchange depends on air-filled pores that drain within a day or two after rain. CO₂ is about 30 times more soluble than O₂, so wetness slows its escape less."},
{law:"capillarity",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 112",q:"Where does most of the water in frost heave come from?",
 o:["Expansion of the water already in the pores","Water drawn up by capillarity to the freezing front","Rain falling on frozen ground","Snow pressed into the soil"],a:1,
 m:"Frost heave is the 9 % expansion of freezing pore water.",x:"Freezing in place causes only small volume change. Heave comes from capillary water rising to the frost line and forming ice lenses, so silt and fine sand, with strong capillary rise, are the most frost-susceptible."},

/* ---- From Brady & Weil, The Nature and Properties of Soils (Global ed.) ---- */
{law:"capillarity",sec:"field",src:"Brady & Weil, pp. 232–233",q:"A gardener puts a gravel layer in the bottom of a plant pot 'for drainage'. What happens?",
 o:["Water drains from the soil faster","Water stays in the soil above the gravel until the soil is nearly saturated, so the soil stays wetter","Roots grow down into the gravel for air","It has no effect"],a:1,
 m:"A coarse layer underneath speeds drainage.",x:"Water moves to where it is held more tightly. The fine soil's small pores hold it more strongly than the gravel's large ones, so the wetting front stops at the interface until the soil above is close to saturation."},
{law:"richards",sec:"field",src:"Brady & Weil, p. 233",q:"A gravel lens lies at 60 cm depth under fine-textured soil, with moist subsoil below it. What does it do to water supply to roots above it?",
 o:["It speeds capillary rise","It blocks capillary rise, because its large pores cannot carry unsaturated flow, so plants above may suffer drought","It has no effect","It becomes a permanent water table"],a:1,
 m:"Coarse layers only affect downward flow.",x:"A coarse layer is a barrier to unsaturated flow in both directions. The same principle lets a gravel layer under a concrete slab stop moisture rising into a basement floor."},
{law:"ph",sec:"field",src:"Brady & Weil, pp. 427–428",q:"Gypsum (CaSO₄) is applied to a soil with an aluminium-toxic subsoil. Which statement is correct?",
 o:["It raises soil pH like lime","It does not raise pH, but its calcium moves down with the mobile sulfate and reduces subsoil aluminium toxicity","It increases CEC","It acidifies the subsoil"],a:1,
 m:"Only something that raises pH can relieve aluminium toxicity.",x:"Gypsum is more soluble than lime and supplies SO₄²⁻ as an accompanying anion, so Ca²⁺ can leach into the subsoil. In trials it reduced exchangeable Al in subsoils more effectively than lime."},
{law:"cec",sec:"field",src:"Brady & Weil, p. 426",q:"Ground limestone is mixed into the top 20 cm of a soil with high CEC. Which layer does it affect in the first years?",
 o:["The whole profile","Mainly the layer it was mixed into, because the Ca²⁺ and Mg²⁺ are held on exchange sites and move down slowly","Only the subsoil","Mainly the groundwater"],a:1,
 m:"Lime washes down and limes the subsoil too.",x:"The cations from lime replace acidic cations on the exchange complex and do not move readily down the profile. Subsoil acidity needs deep incorporation, gypsum, or time."},
{law:"ph",sec:"limits",src:"Brady & Weil, p. 426",q:"Why do textbooks warn more about overliming than about underliming?",
 o:["Because lime is expensive","Because more lime is easy to add later, but excess is hard to undo; high pH causes deficiencies of Fe, Mn, Cu, Zn and lower P availability","Because lime burns roots on contact","Because excess lime leaches away quickly"],a:1,
 m:"If some lime is good, more is better.",x:"The response to pH is not one-directional. Above the optimum range, micronutrient and phosphate availability fall, and correcting an overlimed soil takes years."},
{law:"ph",sec:"field",src:"Brady & Weil, p. 431",q:"In a 53-year Swedish trial on clay loam starting at pH 6.5, which nitrogen fertiliser raised soil pH?",
 o:["Ammonium sulfate","Calcium nitrate","Both of them","Neither of them"],a:1,
 m:"All nitrogen fertilisers acidify soil.",x:"Acidity comes from nitrification of ammonium, which releases H⁺. Nitrate fertiliser skips that step, and the plant's uptake of nitrate releases OH⁻ or HCO₃⁻, so calcium nitrate slowly raised pH."},
{law:"arrhenius",sec:"field",src:"Brady & Weil, p. 328",q:"Does microbial decomposition stop when soil freezes?",
 o:["Yes, at 0 °C","No, low rates continue well below 0 °C, and have been measured near −20 °C in permafrost","Only below −5 °C","It stops at +5 °C"],a:1,
 m:"Frozen soil is biologically inactive.",x:"Unfrozen water films persist in frozen soil and many microbes are adapted to cold. Winter respiration and N₂O emissions from frozen and thawing soils are significant in northern climates."},
{law:"som",sec:"watch",src:"Brady & Weil, p. 566",q:"Why does a large share of soil organic matter persist for centuries?",
 o:["Because most of it consists of giant, chemically resistant humic molecules","Mainly because it is protected inside aggregates or bound to mineral surfaces, out of reach of microbes","Because microbes cannot digest organic carbon","Because soil below 20 cm is sterile"],a:1,
 m:"Humus is made of large, recalcitrant humic molecules.",x:"Direct in-situ measurements found few humic macromolecules in mineral soils; the alkali extraction itself appears to create them. Persistence depends mainly on physical and mineral protection."},
{law:"som",sec:"field",src:"Brady & Weil, p. 588",q:"Studies sampling the top 5–20 cm often find more soil carbon under no-till than under ploughing. What do the few studies sampling to 1 m tend to show?",
 o:["Even larger gains under no-till","The difference shrinks or disappears, because ploughed soils can store more carbon deeper","No-till loses carbon at all depths","Exactly the same gain as in the topsoil"],a:1,
 m:"No-till always sequesters carbon.",x:"Tillage redistributes carbon in the profile. A shallow sampling depth can turn a redistribution into an apparent gain, which matters for carbon credits."},
{law:"fick",sec:"field",src:"Brady & Weil, pp. 807–808",q:"Does a nutrient need to be mixed through the whole root zone for the plant to get enough of it?",
 o:["Yes, otherwise the plant becomes deficient","No; a plant can take up its entire supply from a concentrated band that touches only a small part of its root system","Only nitrogen can be banded","Only in sandy soils"],a:1,
 m:"Nutrients must be spread evenly through the root zone.",x:"Roots proliferate in a fertiliser band. Banding also reduces contact between the nutrient and the soil, so less phosphorus is fixed before the plant can use it."},

/* ---- Methods: plot trials, statistics, yield, inversion ---- */
{law:"fisher",sec:"origin",q:"Treatments in a trial alternate regularly down a slope: A, B, A, B. Why did Fisher reject such systematic layouts?",
 o:["They are too expensive to harvest","They give no valid estimate of error, because the layout can line up with soil patterns","They need more fertiliser","They make the analysis impossible to compute"],a:1,
 m:"A neat, regular layout is the fairest comparison.",x:"A regular layout can coincide with a gradient or a periodic feature such as old drains, biasing both the comparison and the error estimate. Random allocation makes the error estimate valid."},
{law:"fisher",sec:"field",q:"A field slopes from a wet lower edge to a dry ridge. How should the blocks be laid out?",
 o:["Each block runs the full length of the slope","Each block lies across the slope, at one elevation, so plots inside a block are similar","Blocks do not matter if treatments are randomised","All treatments go on the middle of the slope"],a:1,
 m:"Each block should cover the full range of conditions.",x:"A block should be as uniform as possible inside, so the gradient appears between blocks and is removed from the error term."},
{law:"fisher",sec:"math",q:"About how much more replication is needed to halve the least significant difference in a blocked trial?",
 o:["Twice as much","Four times as much","Eight times as much","1.4 times as much"],a:1,
 m:"Twice the replicates gives twice the precision.",x:"The standard error of a difference falls with √r, so halving it needs four times the replication."},
{law:"pseudorep",sec:"field",q:"You compare one limed field with one unlimed neighbouring field by taking 20 soil cores from each. How many true replicates per treatment does this give?",
 o:["One","Twenty","Ten","Forty"],a:0,
 m:"Each soil core is a replicate.",x:"The treatment was applied once per field, so any difference between the fields, liming or not, is confounded with field. The cores only describe each field more precisely."},
{law:"pvalue",sec:"watch",q:"A trial gives p = 0.03 for a fertiliser effect. What does this mean?",
 o:["There is a 3 % chance that the fertiliser has no effect","If the fertiliser had no effect, data this extreme would occur about 3 % of the time","The effect is large","97 % of farms will see the effect"],a:1,
 m:"p is the probability that the null hypothesis is true.",x:"A p-value is calculated assuming the null hypothesis. Turning it into the probability of a hypothesis needs a prior, as in Bayes' theorem."},
{law:"pvalue",sec:"watch",q:"A small trial finds a 6 % yield increase with p = 0.20. What is the correct conclusion?",
 o:["The treatment has no effect","The data fit no effect, but also a worthwhile effect; the trial lacked power to tell them apart","The effect is certainly 6 %","The trial is invalid"],a:1,
 m:"Non-significant means no effect.",x:"Absence of evidence is not evidence of absence. A confidence interval shows the range of effects the data allow, and for a small trial it is often wide."},
{law:"power",sec:"watch",q:"You increase the number of soil cores per field from 10 to 40. What happens to the standard error of the field mean?",
 o:["It falls to about one half","It falls to about one quarter","It falls to about 70 %","It stays the same"],a:0,
 m:"Error falls in proportion to the number of samples.",x:"SE = σ/√n. Four times the cores halves the standard error, assuming independent samples."},
{law:"smithlaw",sec:"watch",q:"Soil at a site is strongly correlated over tens of metres. What does doubling plot length do to the variance between plots?",
 o:["Halves it","Reduces it much less than half, because the added ground is similar to what is already in the plot","Increases it","Has no effect on precision"],a:1,
 m:"Bigger plots average out variation in proportion to their size.",x:"Fairfield Smith's exponent b is small when neighbouring soil is correlated. Then more, smaller, well-blocked plots usually beat fewer large ones."},
{law:"spatial",sec:"watch",q:"A hundred yield-map points 2 m apart show a correlation r = 0.4 (p < 0.001) between soil EC and yield. Why may the p-value overstate the evidence?",
 o:["Yield maps are always wrong","Points closer than the variogram range are not independent, so the effective sample size is far below 100","r = 0.4 is too small to test","EC cannot affect yield"],a:1,
 m:"Every map pixel is an independent observation.",x:"Spatial autocorrelation inflates the apparent sample size. Methods that account for it, such as spatial regression or thinning to beyond the range, give honest uncertainty."},
{law:"regmean",sec:"watch",q:"The five lowest-yielding zones of 2024 receive extra lime and yield more in 2025. Without untreated comparison zones, what could explain part or all of the gain?",
 o:["The lime, certainly","Regression to the mean: zones selected for an extreme low tend to be closer to average next year","Better soil sampling","The law of the minimum"],a:1,
 m:"Improvement after treatment proves the treatment worked.",x:"Part of last year's low was noise (weather, measurement error) that will not repeat. Untreated zones of the same type show how much improvement would have happened anyway."},
{law:"simpson",sec:"watch",q:"Across regions, those using more fertiliser also have higher yields. Can you conclude that within any one farm extra fertiliser raises yield by the same amount?",
 o:["Yes","No; regional differences in soil, climate and crops confound the comparison","Yes, if more than 30 regions are included","No, because fertiliser never affects yield"],a:1,
 m:"A pattern across regions holds for each farm.",x:"This is the ecological fallacy. Within-farm effects need within-farm comparisons, ideally randomised trials."},
{law:"broadbalk",sec:"watch",q:"Yields on fertilised Broadbalk plots rose sharply after 1968, when short-straw varieties were introduced. What does the rise mainly reflect?",
 o:["A delayed effect of fertilisers applied since 1843","Changes in varieties and management, which is why treatments are compared within the same years","Climate warming alone","Soil carbon saturation"],a:1,
 m:"A yield trend in a long-term trial shows the treatment effect.",x:"Short-straw varieties, fungicides and herbicides changed the yield potential of every plot. The treatment effect is the difference between plots in the same year."},
{law:"anova",sec:"watch",q:"An ANOVA of six varieties gives a significant F. What can you conclude?",
 o:["All six varieties differ from each other","At least one differs; which ones needs a comparison of means","The best variety is significantly better than the second best","The trial had no experimental error"],a:1,
 m:"A significant F ranks the treatments.",x:"F tests the null hypothesis that all means are equal. Pairwise differences need an LSD or a multiple-comparison test."},
{law:"yieldmeas",sec:"field",q:"Plot A yields 6.0 t/ha at 25 % moisture and plot B 5.6 t/ha at 15 % moisture. Converted to 15 % moisture, which is higher?",
 o:["Plot A","Plot B","They are equal","They cannot be compared"],a:1,
 m:"Fresh weights can be compared directly.",x:"6.0 × (100 − 25)/(100 − 15) = 5.3 t/ha for plot A, against 5.6 t/ha for plot B. Dry matter is conserved, water is not."},
{law:"yieldmeas",sec:"watch",q:"A yield-monitor map shows low yields over the first 10–20 m of every pass, wherever the pass starts. What is the most likely cause?",
 o:["Compacted soil at every pass start","Fill-up time and flow delay in the combine: a measurement artefact","Lower fertiliser rates at the edges","Poor GPS reception"],a:1,
 m:"A yield map is a direct picture of the crop.",x:"Grain takes several seconds to travel from the header to the mass-flow sensor. Without lag correction and removal of pass-start data, the map records the machine, not the field."},
{law:"harvestindex",sec:"watch",q:"Two barley crops both yield 5 t/ha of grain dry matter. One has a harvest index of 0.5, the other 0.4. Which produced more above-ground biomass?",
 o:["They are the same","The crop with HI 0.4: 12.5 t/ha against 10 t/ha","The crop with HI 0.5","It cannot be known without flux data"],a:1,
 m:"Equal yields mean equal carbon uptake.",x:"Biomass = yield / HI. Harvest index differs with variety, nitrogen and drought, so converting yields to carbon needs crop-specific values."},
{law:"nee",sec:"watch",q:"Eddy covariance gives a cereal field an annual NEE of −300 g C/m² (net uptake), and the harvest removed 350 g C/m². Ignoring other inputs and losses, what happened to the field's carbon?",
 o:["It gained 300 g C/m²","It lost about 50 g C/m²","It gained 650 g C/m²","Nothing, because NEE already includes the harvest"],a:1,
 m:"A net CO₂ sink is a soil carbon sink.",x:"NEE measures only the CO₂ exchange with the air above the field. The net ecosystem carbon balance subtracts carbon exported in the harvest: 300 − 350 = −50 g C/m²."},
{law:"nee",sec:"field",q:"In the usual micrometeorological sign convention, what does a negative NEE mean?",
 o:["Net CO₂ release from the ecosystem","Net CO₂ uptake by the ecosystem","A measurement error","Night-time conditions"],a:1,
 m:"Negative means a loss.",x:"Fluxes are signed from the atmosphere's point of view: negative is a flux downward into the ecosystem. Ecological studies often use NEP = −NEE, where positive means uptake."},
{law:"inversion",sec:"field",q:"A crop model is inverted to estimate seasonal GPP from final yield alone. What is the main limitation?",
 o:["Yield constrains the cumulative carbon gain, but many seasonal patterns and partitionings give the same yield","Inversion cannot use yield data","Yield measures GPP directly","There is no limitation if the model fits"],a:0,
 m:"If the model reproduces the yield, it has the season right.",x:"One number cannot pin down a time series. Adding satellite vegetation indices, weather and flux data constrains the timing and split of the carbon gain."},
{law:"inversion",sec:"origin",q:"Why is regularisation added to an ill-posed inversion?",
 o:["To speed up the computation","To make the solution unique and stable against small changes in the data, by pulling it toward prior expectations","To remove model error","To make the fit to the data as close as possible"],a:1,
 m:"The best solution is the one that fits the data most closely.",x:"Fitting noisy data perfectly gives wildly varying, unstable solutions. Tikhonov's penalty trades a little misfit for a stable, plausible answer."},
{law:"equifinality",sec:"watch",q:"Two parameter sets fit soil outflow data equally well but give very different saturated hydraulic conductivities. What does this show?",
 o:["The data do not constrain conductivity; more data or prior information is needed","The set with fewer parameters must be right","The model is necessarily wrong","Averaging them gives the exact answer"],a:0,
 m:"A good fit identifies the true parameters.",x:"When several parameter sets give the same fit, the data do not contain the information to distinguish them. Report the range, and design measurements that do discriminate."},
{law:"bayes",sec:"watch",q:"A soil test detects 95 % of pathogen-infested fields, and falsely flags 5 % of clean ones. 2 % of fields are infested. A field tests positive. About how likely is it to be infested?",
 o:["95 %","About 28 %","5 %","50 %"],a:1,
 m:"A 95 % accurate test means a positive result is 95 % certain.",x:"Out of 1000 fields, 19 infested fields test positive and 49 clean ones do too: 19 / 68 ≈ 28 %. With a rare condition the prior matters a great deal."},
{law:"errorprop",sec:"watch",q:"A soil carbon stock estimate has a 3 % error in carbon concentration and a 12 % error in bulk density. Which single improvement reduces the total uncertainty most?",
 o:["Better carbon analysis","Better bulk density measurement","Both help equally","Neither, the errors cancel"],a:1,
 m:"Better laboratory analysis is the best way to improve a stock estimate.",x:"√(3² + 12²) ≈ 12.4 %. Perfect carbon analysis would leave 12 %; cutting the bulk density error to 3 % would bring the total to about 4 %."},
/* ---- From Bohn, McNeal & O'Connor (2001) Soil Chemistry, 3rd ed. ---- */
{law:"nernst",sec:"field",src:"Bohn et al. 2001, pp. 115, 125–126",q:"A platinum electrode reads +450 mV in a well-aerated field soil. What does the reading represent?",
 o:["The exact equilibrium potential of the O₂/H₂O couple","A poorly defined mixed potential, a weighted average of many couples that are not in equilibrium","The nitrate concentration","The soil's oxygen content in per cent"],a:1,
 m:"An Eh reading is a precise thermodynamic measurement in any soil.",x:"Soil redox couples are not at equilibrium with each other, and the electrode responds unequally to them. Readings are most meaningful in reduced, flooded soils, where reversible Fe²⁺ dominates the electrode."},
{law:"henry",sec:"field",src:"Bohn et al. 2001, p. 200",q:"Calcareous soil measured in the laboratory has pH about 8.3. Why is its pH in the field usually lower?",
 o:["Field thermometers are colder","Soil air holds 10–100 times more CO₂ than the atmosphere, and the extra dissolved CO₂ forms carbonic acid","Rain is acidic","Lab samples gain calcium during drying"],a:1,
 m:"Soil pH is a fixed property of the soil sample.",x:"Root and microbial respiration raise the soil's CO₂ partial pressure to about 0.003–0.03 atm, and by Henry's law more CO₂ dissolves. pH 8.3 holds only for equilibrium with atmospheric CO₂."},
{law:"henry",sec:"field",src:"Bohn et al. 2001, p. 200",q:"Soil solution is extracted from a flooded soil and its pH is measured the next day. What error does the delay introduce?",
 o:["None, pH is stable once extracted","pH rises as dissolved CO₂ escapes to the air, and carbonates and metal hydroxides may precipitate","pH falls as the solution oxidises","Only the temperature changes"],a:1,
 m:"An extracted solution keeps the chemistry it had in the soil.",x:"In flooded soil, CO₂ can reach a partial pressure near 0.2 atm. Out of the soil it degasses over several hours, so the pH of alkaline and flooded soil extracts should be measured immediately."},
{law:"massaction",sec:"field",src:"Bohn et al. 2001, p. 86",q:"A phosphate sorption reaction is written soil-OH + H₂PO₄⁻ ⇌ soil-H₂PO₄ + OH⁻ with a constant Kᵣ. What is Kᵣ?",
 o:["A true thermodynamic equilibrium constant","An empirical reaction coefficient: the equation looks like an equilibrium, but soil phosphate is not at equilibrium and surface activities cannot be defined","The solubility product of apatite","A rate constant"],a:1,
 m:"Any equation with a K in it describes an equilibrium.",x:"Phosphate is spread over many sites of different strength and keeps redistributing slowly. Such coefficients describe an ongoing process and change with conditions, so they cannot be carried from soil to soil like true constants."},
{law:"massaction",sec:"field",src:"Bohn et al. 2001, p. 76",q:"Why are equilibrium constants written with activities rather than concentrations?",
 o:["Activities are easier to measure","Ions interact with each other and with water, so their effective concentration (activity) is lower than the analytical one, especially in salty solutions","Concentrations have no units","Activities are always higher than concentrations"],a:1,
 m:"Concentration and activity are the same thing in soil solution.",x:"Activity a = γ·c, where the activity coefficient γ falls as ionic strength rises. Solubility and exchange calculations that ignore γ go wrong in fertilised, saline or high-calcium solutions."},
{law:"shelford",sec:"field",src:"Bohn et al. 2001, p. 27",q:"Which statement about 'essential' and 'toxic' elements is correct?",
 o:["Essential elements are harmless at any concentration","Each essential element has a beneficial range: below it there is deficiency, and well above it the same element becomes toxic","Arsenic has no biological role at any concentration","Toxicity depends only on the element, not its concentration"],a:1,
 m:"Elements are either good or bad.",x:"Bohn's point is Shelford's law in chemistry: oxygen, copper, selenium and even arsenic are beneficial in a range and harmful above it, and the range varies by organism."},
{law:"elements",sec:"field",src:"Bohn et al. 2001, p. 27",q:"A soil over a natural lead–zinc ore body has very high total Pb and Zn. Are the plants and groundwater necessarily contaminated?",
 o:["Yes, total content determines the risk","Not necessarily; what matters is availability to plants and mobility to groundwater, which soil reactions often keep low","Yes, ore metals are always soluble","No, natural metals are never toxic"],a:1,
 m:"High total element content means a contaminated, hazardous soil.",x:"Risk follows availability, not total content. This is why contaminated-land assessment uses leaching tests and bioavailability as well as total concentrations."},
{law:"lyotropic",sec:"field",src:"Bohn et al. 2001, pp. 212–213",q:"Mg²⁺ is a smaller ion than Ca²⁺. Which one does montmorillonite hold more tightly?",
 o:["Mg²⁺, because a smaller ion can approach the surface more closely","Ca²⁺, because the small Mg²⁺ binds water strongly and has the larger hydrated radius","Both equally, since the charge is the same","Neither, divalent ions are not exchangeable"],a:1,
 m:"Smaller ions are always held more tightly.",x:"Within one valence, a smaller bare ion has a higher charge density, holds a thicker hydration shell and is held less tightly. The same logic puts Na⁺ below K⁺ in the series."},
{law:"lyotropic",sec:"field",src:"Bohn et al. 2001, p. 213",q:"A clay is washed with acid to make it 'hydrogen-saturated'. What does it become within a short time?",
 o:["A stable H-clay","An aluminium-saturated clay, as H⁺ attacks the clay structure and releases Al³⁺","A calcium clay","A sodium clay"],a:1,
 m:"Acid soils hold mainly exchangeable H⁺.",x:"H-clays are unstable and decompose to Al-saturated clays, which is why exchangeable acidity in mineral soils is mostly aluminium and why 'H⁺' in the lyotropic series behaves like a trivalent ion."},
{law:"ph",sec:"field",src:"Bohn et al. 2001, pp. 260–261",q:"On limed agricultural land, which is usually the larger source of soil acidification?",
 o:["Acid rain","Ammonium and phosphate fertilisers, severalfold more than acid rain","Root exudates","Lime itself"],a:1,
 m:"Acid rain is the main cause of soil acidification.",x:"Nitrification of ammonium and the reactions of phosphate fertilisers release far more H⁺ per hectare than present-day deposition. Acid rain matters relatively more on unlimed forest soils."},
{law:"cec",sec:"field",src:"Bohn et al. 2001, p. 266",q:"A mineral soil has pH 6.2. Which form of acidity dominates?",
 o:["Exchangeable H⁺","Exchangeable Al³⁺","Non-exchangeable acidity, mainly hydroxy-aluminium polymers on surfaces","There is no acidity left to neutralise"],a:2,
 m:"Any acid soil holds its acidity as exchangeable H⁺ and Al³⁺.",x:"Exchangeable Al is significant mainly below pH about 5.5, and exchangeable H⁺ only below about pH 4. Between pH 5.5 and 7 the acidity is titratable but not exchangeable, which is why a KCl extract underestimates lime requirement there."},
{law:"doublelayer",sec:"field",src:"Bohn et al. 2001, pp. 239, 242",q:"Why does nitrate leach so readily from most soils?",
 o:["It is strongly adsorbed and then released suddenly","It is barely retained and is even repelled from the diffuse double layer of negatively charged particles","It forms insoluble salts","It is converted to sulfate"],a:1,
 m:"Soil holds nitrate like it holds ammonium.",x:"Negatively charged surfaces repel anions, so nitrate and chloride are concentrated in the free water that moves. Anion exclusion can even make nitrate travel slightly faster than the average water."},
{law:"doublelayer",sec:"field",q:"An irrigated soil with moderate exchangeable sodium infiltrates well until a heavy rain, after which it seals and ponds. Why?",
 o:["Rain adds sodium","Low-salt rainwater expands the double layers, so sodium-rich clay disperses and clogs the pores","Rain cools the soil","Rain dissolves the clay"],a:1,
 m:"If irrigation water was fine, rain cannot be worse.",x:"The diffuse layer thickness grows as ionic strength falls (κ⁻¹ ∝ 1/√I). Salty irrigation water kept the clay flocculated; dilute rain lets it disperse at the same ESP."},
/* ---- Economics ---- */
{law:"marginal",sec:"watch",q:"Going from 120 to 140 kg N/ha raises yield, but by less than going from 100 to 120 did. Is the 140 kg rate therefore unprofitable?",
 o:["Yes, diminishing returns mean the extra N is wasted","Not necessarily; it depends on whether the extra grain is worth more than the extra nitrogen","Yes, because yield must have peaked","No, more yield is always more profit"],a:1,
 m:"Diminishing returns mean an input has stopped paying.",x:"Each increment adds less, but it can still add more value than it costs. Profitability is decided by comparing the marginal value of yield with the marginal cost of the input."},
{law:"optimum",sec:"math",q:"Grain yield peaks at 150 kg N/ha. Where is the profit-maximising rate?",
 o:["At 150 kg N/ha","Below 150, where the extra grain from the last kilogram of N is worth exactly its price","Above 150, to be safe","Wherever yield is 95 % of maximum"],a:1,
 m:"The economic optimum is the rate that maximises yield.",x:"At the yield peak the last kilogram of N adds nothing, so it cannot pay for itself. Profit peaks earlier, where the slope of the response curve equals the price ratio."},
{law:"optimum",sec:"math",q:"Yield follows Y = 3000 + 30N − 0.1N² (kg/ha). One kilogram of N costs as much as 5 kg of grain. What is the economic optimum?",
 o:["150 kg N/ha","125 kg N/ha","100 kg N/ha","75 kg N/ha"],a:1,
 m:"The optimum is where the curve flattens out.",x:"Set the slope 30 − 0.2N equal to the price ratio 5: N* = 25/0.2 = 125 kg N/ha. Yield peaks at 150 kg N/ha."},
{law:"optimum",sec:"limits",q:"The same nitrogen trial data are fitted with a quadratic curve and with a quadratic-plateau curve. What typically happens to the estimated optimum rate?",
 o:["Both models give the same optimum","The quadratic model usually gives a higher optimum rate","The quadratic model always gives a lower rate","The choice of model only affects yield, not the optimum"],a:1,
 m:"The economic optimum is a property of the field, not of the model.",x:"A quadratic curve forces a gradual approach to the maximum, which pushes the optimum to higher rates than a curve that reaches a plateau. The response model is a major source of uncertainty in recommendations."},
{law:"flatpay",sec:"watch",q:"With Y = 3000 + 30N − 0.1N² and a price ratio of 5, the optimum is 125 kg N/ha. About how much profit is lost by applying 100 kg instead?",
 o:["The value of about 60 kg grain per hectare, around 1 % of yield value","About 20 % of profit","About half the profit","Nothing at all"],a:0,
 m:"Missing the optimum by 25 kg costs a lot of money.",x:"Yield falls by 187.5 kg but 25 kg N (worth 125 kg grain) is saved, a net loss of 62.5 kg grain per hectare. Profit is flat near the optimum."},
{law:"voi",sec:"watch",q:"A soil test costs €30/ha. Whatever the result, the farmer will apply the same lime rate. What is the decision value of the test?",
 o:["€30/ha, its cost","Zero, because no result could change the decision","Equal to the value of the lime","It depends on the laboratory's accuracy"],a:1,
 m:"Accurate data is always valuable.",x:"Information has decision value only through the decisions it can change. Here the test may still be useful for monitoring, but not for this liming decision."},
{law:"voi",sec:"field",q:"When is denser soil sampling within a field most valuable?",
 o:["Always, the more samples the better","When the soil varies a lot within the field and rates can be varied to match, with clear profit or loss differences between rates","When the field is uniform","Only when the samples are analysed quickly"],a:1,
 m:"Sampling density should be as high as the budget allows.",x:"Value of information is high when uncertainty is large, the decision can respond to the information, and the payoff differs between choices. On a uniform field, or with a flat payoff, it is low."},
{law:"induced",sec:"field",q:"Why did Japan develop fertiliser-responsive rice varieties early, while the United States emphasised farm machinery?",
 o:["Cultural preference","Different relative scarcities: land was scarce and labour plentiful in Japan, land plentiful and labour scarce in the US","Japan had better scientists","Machinery was banned in Japan"],a:1,
 m:"Technology follows its own logic, independent of prices.",x:"Hayami and Ruttan showed that innovation saves the factor that is relatively expensive. Biological and chemical technology saves land; mechanical technology saves labour."},
{law:"thunen",sec:"field",q:"Before rail and road transport, why was ground limestone used mainly near quarries?",
 o:["Farmers far away did not know about liming","Moving a bulky, low-value input cost more than the extra yield was worth beyond a short distance","Distant soils were not acid","It was illegal to transport lime"],a:1,
 m:"If a practice works, it spreads wherever the soil needs it.",x:"Transport cost per tonne-kilometre limits how far a low-value input can travel. Infrastructure and transport costs, not just agronomic benefit, decide where such practices spread."},
{law:"thunen",sec:"watch",q:"In von Thünen's model, which land use lies nearest the market?",
 o:["Whatever grows best on the best soil","Products that are expensive to transport relative to their value, such as fresh milk, vegetables or firewood","Grain, because it is the staple","Extensive grazing"],a:1,
 m:"The best soils always get the most intensive use.",x:"Rent depends on transport cost as well as yield. Perishable and bulky products must be produced close to the market, even on average soil."},
{law:"ricardo",sec:"watch",q:"A new subsidy of €100 per hectare is paid to whoever farms the land. Over several years, who tends to capture much of it?",
 o:["The tenant farmer","The landowner, through higher rents and land prices","Consumers, through lower food prices","Nobody, it disappears"],a:1,
 m:"A payment per hectare stays with the person farming.",x:"Anything that raises the return to land raises what farmers will pay to rent or buy it. Studies of EU direct payments find a substantial share capitalised into rents."},
{law:"king",sec:"watch",q:"The national harvest is 10 % above normal and the price elasticity of demand is about −0.4. What happens to total farm revenue?",
 o:["It rises by about 10 %","It falls, because the price drops by about 25 %","It is unchanged","It rises by about 35 %"],a:1,
 m:"A bigger harvest means more income for farmers as a whole.",x:"A 10 % rise in quantity needs a price fall of roughly 10/0.4 = 25 % to be sold. Revenue becomes about 1.10 × 0.75 ≈ 0.83 of normal."},
{law:"engel",sec:"watch",q:"As Finnish incomes rose over the 20th century, the share of household spending on food fell sharply. What does that imply?",
 o:["People spent less money on food","Total food spending could still rise, but it grew more slowly than income","Food quality declined","Food prices rose"],a:1,
 m:"A falling food share means less food is bought.",x:"Engel's law concerns the share. Income elasticity of food demand below one means food spending grows, but less than proportionally to income."},
{law:"cobweb",sec:"watch",q:"Pig prices are high this year, and many farmers expand their herds. What typically happens one to two years later?",
 o:["Prices stay high","Supply rises together, and prices fall, often below the original level","Demand rises to match","Feed prices fall"],a:1,
 m:"Today's high price shows where to invest.",x:"With a production lag, everyone responds to the same past price, overshooting the equilibrium. The resulting oscillation is the hog cycle."},
{law:"treadmill",sec:"watch",q:"A new variety raises yields by 10 % for every adopter. Once nearly all farms have adopted it, who gains most?",
 o:["Every farm equally, through 10 % more income","Consumers, through lower prices; early adopters gained only temporarily and late adopters lose","Seed companies only","Nobody"],a:1,
 m:"Higher yields raise every farmer's income.",x:"When all output rises and demand is inelastic, prices fall. Cochrane's treadmill rewards early adoption and pushes out those who adopt last."},
{law:"pigou",sec:"field",q:"A charge equal to the downstream damage of surplus nitrogen is added to the fertiliser price. What happens to the economic optimum N rate?",
 o:["It rises","It falls, because the price ratio p_N/p_Y increases","It is unchanged","It goes to zero"],a:1,
 m:"Environmental costs and farm economics are separate questions.",x:"A Pigouvian charge makes the private price reflect the social cost. The optimum moves to where the extra yield also covers the external damage."},
{law:"coase",sec:"watch",q:"Why is private bargaining rarely a practical solution for farm runoff into a lake?",
 o:["Lake users have no legal standing","Many polluters and many affected users, with damage hard to trace to individual fields, make transaction costs very high","Bargaining is illegal","Runoff causes no damage"],a:1,
 m:"Coase showed that pollution can be solved by negotiation.",x:"Coase's result needs low transaction costs. Diffuse pollution has the opposite, which is why regulation, taxes or payments are used instead."},
{law:"mac",sec:"watch",q:"Farm A can cut 1 kg of phosphorus load for €20, farm B for €200. Requiring both to cut by the same amount, compared with letting A do more of the cutting, is:",
 o:["Equally cost-effective","More expensive for the same total reduction","Cheaper","Only a matter of fairness, not cost"],a:1,
 m:"Equal cuts for everyone is the efficient approach.",x:"Total cost is lowest when marginal abatement costs are equal across sources. Targeting cheap reductions first achieves the same water-quality gain for less money."},
{law:"carboncred",sec:"watch",q:"A farmer who has used no-till for 15 years applies for soil carbon credits for continuing it. Which test does the claim fail?",
 o:["Permanence","Additionality: the practice would have continued anyway","Leakage","None"],a:1,
 m:"Any practice that stores carbon deserves credits.",x:"A credit must represent a change against what would have happened without it. Rewarding existing practice pays for no new reduction."},
{law:"carboncred",sec:"field",q:"Soil carbon is credited on a field, which is then ploughed and drained five years later. Which principle is at stake?",
 o:["Additionality","Permanence: the stored carbon can be released again","Leakage","Baseline"],a:1,
 m:"Once carbon is in the soil, it stays there.",x:"Soil carbon is reversible. Standards deal with this through long contract periods, buffer pools of withheld credits and liability for reversals."},
{law:"carboncred",sec:"field",q:"Peat fields are rewetted for climate credits, and the lost production moves to newly cleared land elsewhere. What is this called?",
 o:["Additionality","Leakage","Permanence","Rebound"],a:1,
 m:"Emission cuts at a site count fully toward the climate.",x:"Leakage is an increase in emissions outside the project caused by the project. Credits must be reduced by the estimated leakage."},
{law:"npv",sec:"math",src:"Paasonen-Kivekäs et al. 2016, p. 419",q:"Subsurface drainage costs €1800/ha, written off over 30 years at 5 % interest. What is the annual capital cost by the annuity method?",
 o:["€60/ha","About €117/ha","About €90/ha","€180/ha"],a:1,
 m:"Annual cost is just the investment divided by its lifetime.",x:"1800/30 = €60 ignores interest. The annuity factor 0.05·1.05³⁰/(1.05³⁰ − 1) ≈ 0.065 gives about €117/ha per year."},
{law:"npv",sec:"intuition",q:"What is €100 received in 30 years worth today at a 5 % discount rate?",
 o:["About €85","About €50","About €23","€100"],a:2,
 m:"Discounting changes values only a little.",x:"100 / 1.05³⁰ ≈ 100 / 4.32 ≈ €23. Long-lived investments such as drainage or soil carbon are very sensitive to the discount rate."},
{law:"npv",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 416",q:"In a drainage profitability calculation, the discount rate is raised from 3 % to 7 %. What happens?",
 o:["The annual cost falls","The annual cost (annuity) rises, making the long-lived investment look less profitable","Nothing, because the investment cost is the same","Only the yield benefit changes"],a:1,
 m:"The interest rate is a minor detail in investment decisions.",x:"A higher rate gives a larger annuity for the same investment. Because the rate is a choice, calculations should show how sensitive the answer is to it."},
{law:"npv",sec:"limits",src:"Paasonen-Kivekäs et al. 2016, p. 418",q:"Poorly working drains cause one total crop failure from wetness in ten years, and normal yields otherwise. What is the average annual yield loss?",
 o:["Negligible, since nine years are normal","About 10 %","About 1 %","100 %"],a:1,
 m:"Rare bad years do not matter much for profitability.",x:"One total loss in ten years is a 10 % average loss per year. Drainage also reduces year-to-year yield variation, which has value of its own."},
{law:"npv",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 421",q:"Besides raising production, why did the Finnish state support drainage investments from the 1920s?",
 o:["To employ forestry workers","Farmers lacked access to credit, so many profitable drainage investments would not otherwise have been made","To reduce nutrient runoff","To lower food prices for export"],a:1,
 m:"Subsidies are justified only when an investment is unprofitable.",x:"Support also corrected a capital-market failure. Environmental motives for drainage support appeared only in the 1990s."},
{law:"malthus",sec:"watch",q:"World food production per person has risen since 1960 although population more than doubled. What does this show?",
 o:["Malthus was right","That intensification raised output, as Boserup described; it does not show that environmental limits are absent","That population growth has stopped","That food output is unlimited"],a:1,
 m:"Rising food per person proves there are no limits.",x:"Output grew through fertiliser, irrigation, breeding and more land. These moved the pressure to nitrogen and phosphorus cycles, water and biodiversity."},
{law:"tfp",sec:"watch",q:"Over a decade, a region's crop output rises by 30 % while the combined index of all inputs rises by 40 %. What happened to total factor productivity?",
 o:["It rose by 30 %","It fell by about 7 %","It rose by 10 %","It is unchanged"],a:1,
 m:"Rising yields show rising efficiency.",x:"TFP = 1.30 / 1.40 ≈ 0.93, a fall of about 7 %. Yield per hectare is only a partial productivity measure."},
/* ---- From Hillel (1998) Environmental Soil Physics ---- */
{law:"darcy",sec:"field",src:"Hillel 1998, pp. 178–179",q:"In which direction does water flow in a saturated soil?",
 o:["Always downward, with gravity","From wetter to drier soil","From higher to lower total hydraulic head (pressure head plus elevation)","From larger to smaller pores"],a:2,
 m:"Water simply flows downhill, or from wet to dry.",x:"Darcy's law makes flux proportional to the gradient of total head. Water can flow upward or sideways when the pressure head gradient outweighs elevation, as around drains and under artesian conditions."},
{law:"darcy",sec:"field",src:"Hillel 1998, p. 184",q:"A drain-water flux of 1 cm/h is measured through a soil column. How fast does an average water parcel actually travel in the pores?",
 o:["Exactly 1 cm/h","Faster than 1 cm/h, because only the pore fraction carries flow and the paths are tortuous","Slower than 1 cm/h","It cannot move faster than the flux"],a:1,
 m:"Darcy flux is the speed of the water.",x:"Flux q is volume per total cross-section per time. Water moves only through pores, so the average pore velocity is about q divided by the water-filled porosity, and the actual path is longer than the column."},
{law:"darcy",sec:"limits",src:"Hillel 1998, pp. 175, 188",q:"When does Darcy's linear law stop holding?",
 o:["In all unsaturated soils","At high flow velocities in coarse material, where flow becomes non-laminar and inertia matters","In clay soils only","Whenever the soil contains air"],a:1,
 m:"Darcy's law holds for any flow through soil.",x:"The law assumes laminar, viscous flow. It holds in silts and finer soils for normal gradients, but can fail in gravel, around wells and in large macropores. Unsaturated flow is covered by extending it, with K depending on suction."},
{law:"richards",sec:"field",src:"Hillel 1998, p. 208",q:"A sandy soil has a much higher saturated hydraulic conductivity than a clay soil. What happens as both dry out?",
 o:["The sand stays more conductive at all wetnesses","The sand's conductivity falls far more steeply, and in fairly dry soil it becomes lower than the clay's","Both lose conductivity at the same rate","The clay's conductivity increases"],a:1,
 m:"Sand always conducts water faster than clay.",x:"Sand's large pores empty at low suction, leaving few continuous water paths. Clay keeps its fine pores full to much higher suction, so in dry conditions it can conduct more water than sand."},
{law:"richards",sec:"field",src:"Hillel 1998, pp. 464–465",q:"What does Hillel conclude about 'field capacity'?",
 o:["It is a fixed physical constant of each soil","It is an arbitrary, static description of a continuous process; drainage keeps going and depends on how and when it is measured","It is reached exactly 48 hours after rain in all soils","It equals the water content at −33 kPa everywhere"],a:1,
 m:"Field capacity is an intrinsic soil property.",x:"Redistribution has no break or static level. The working definition ignores initial wetness, amount applied, layering and water table depth. The concept fits coarse soils best and medium and fine soils worst."},
{law:"richards",sec:"field",src:"Hillel 1998, p. 465",q:"A deeply wetted loess silt loam in the Negev was covered to stop evaporation. Its water content at 0.6–0.9 m was 18.7 % after 2 days. What happened next?",
 o:["It stayed at 18.7 %, its field capacity","It kept falling: 17.5 % after a week and 13.6 % after 156 days","It rose again as water moved up","It dropped to wilting point within a week"],a:1,
 m:"Drainage effectively stops after two or three days.",x:"The rate of drainage decreases steadily but does not stop. In medium- and fine-textured soils, redistribution continues at an appreciable rate for weeks to months."},
{law:"richards",sec:"field",src:"Hillel 1998, p. 464",q:"Irrigation amounts were long calculated by filling each layer's 'deficit to field capacity' before water passes to the layer below. What is wrong with this bucket model?",
 o:["Nothing, it describes infiltration exactly","Soil water moves continuously by unsaturated flow; layers do not fill and overflow in sequence, and water moves below the 'filled' depth","Buckets should be filled from the bottom","It only fails in frozen soil"],a:1,
 m:"Soil layers fill like buckets before draining.",x:"Unsaturated flow follows potential gradients and conductivity, not storage thresholds. Bucket models are useful approximations for water budgets but misrepresent timing and depth of wetting."},
{law:"richards",sec:"math",src:"Hillel 1998, p. 402",q:"Under ponded water, what does the infiltration rate approach after a long time in a uniform soil?",
 o:["Zero","Roughly the saturated hydraulic conductivity of the soil","The rainfall rate","It keeps increasing"],a:1,
 m:"A soil keeps absorbing water at its initial rate.",x:"Philip's equation i = ½ s t^(−½) + K: the suction-driven sorptivity term dominates early and fades, leaving a gravity-driven rate near Ks. That is why infiltration starts high and declines."},
{law:"capillarity",sec:"field",src:"Hillel 1998, pp. 46–47",q:"Water rises 10 cm in a capillary tube. If the tube is cut off at 5 cm, will water overflow from the top and run continuously (a perpetual motion machine)?",
 o:["Yes, the capillary pull keeps lifting water","No; the meniscus at the cut flattens until its curvature balances the 5 cm column, and flow stops","Only if the tube is glass","Only at high temperature"],a:1,
 m:"Capillarity can pump water upward continuously.",x:"Capillary rise is an equilibrium between surface tension and the weight of the column. A shorter tube simply holds a less curved meniscus. No energy is available to drive a steady flow."},
{law:"capillarity",sec:"field",src:"Hillel 1998, pp. 159–161",q:"Two layers of identical soil are in hydraulic equilibrium with each other. Must they have the same water content?",
 o:["Yes, equal potential means equal water content","No; because of hysteresis, a layer that reached that potential by drying holds more water than one that reached it by wetting","Only if they are at the same depth","No, because water always moves between them"],a:1,
 m:"Matric potential fixes water content uniquely.",x:"The retention curve differs between wetting and drying (the ink-bottle effect, contact angle differences and trapped air). Hysteresis matters most during redistribution, when parts of a profile wet while others dry."},
{law:"stokes",sec:"field",src:"Hillel 1998, p. 69",q:"A hydrometer analysis gives a clay particle a 'diameter' of 1 µm. What is that number?",
 o:["The particle's measured width","An equivalent settling diameter: the size of a smooth sphere of assumed density that would settle at the same speed","Its thickness","Its length"],a:1,
 m:"Sedimentation measures true particle size.",x:"Stokes' law assumes smooth, rigid spheres of one density. Clay particles are platy and minerals differ in density, so sieve and sedimentation results do not match exactly."},
{law:"fourier",sec:"field",src:"Hillel 1998, pp. 325–326",q:"In a soil where the daily temperature wave falls to 37 % of its surface amplitude at 0.12 m, how deep does the annual wave reach the same reduction?",
 o:["Also at 0.12 m","At about 2.3 m, since damping depth scales with the square root of the period","At about 44 m (365 × 0.12 m)","It never decreases"],a:1,
 m:"All temperature waves penetrate to the same depth.",x:"Damping depth d = √(2D/ω). The annual period is 365 times longer, so d is √365 ≈ 19 times greater. The annual wave also lags the surface by months at depth, which is why frost can linger in spring."},
{law:"richards",sec:"field",src:"Hillel 1998, pp. 518, 526",q:"A wet bare soil starts drying under steady sunny weather. Why does the evaporation rate first stay nearly constant, then drop abruptly?",
 o:["The sun's energy varies","At first steepening moisture gradients make up for falling conductivity near the surface; once the surface is air-dry, gradients cannot steepen further and the soil limits the rate","The soil runs out of water at once","Wind stops in the afternoon"],a:1,
 m:"A soil keeps evaporating at the weather's rate until it is dry.",x:"In the first stage the atmosphere sets the rate; in the second the soil's ability to conduct water does. A dry surface layer acts as a self-mulch, which is why soils wet quickly but dry slowly. Hillel notes the neat three-stage picture is blurred in the field by day–night cycles."},
{law:"th1",sec:"field",src:"Hillel 1998, p. 600",q:"What happens to the Bowen ratio (sensible heat ÷ latent heat) as an irrigated field dries and the crop comes under water stress?",
 o:["It stays constant","It rises from below about 0.2 to large values, as more energy heats the surface and air","It falls toward zero","It always equals 1"],a:1,
 m:"Net radiation is split between heat and evaporation in a fixed proportion.",x:"Wet surfaces put most energy into evaporation. Under stress, stomata close and the surface warms. With advection of warm dry air over a wet field, the Bowen ratio can even turn negative."},
{law:"th1",sec:"field",src:"Hillel 1998, p. 598",q:"Over a full 24 hours, how large is the soil heat storage term compared with net radiation?",
 o:["Usually the largest term","Usually small, about 5–15 %, because nighttime losses offset daytime gains","Always zero","Equal to latent heat"],a:1,
 m:"The soil stores most of the day's radiation.",x:"Ground heat flux can be large at midday, but it reverses at night. Over days, most net radiation goes to evaporation and sensible heat; the soil term matters more seasonally, in spring warming and autumn cooling."},
{law:"stefan",sec:"field",src:"Hillel 1998, pp. 595, 598",q:"Why is the net radiation over a field usually negative at night?",
 o:["The soil absorbs moonlight","The surface emits more long-wave radiation (εσT⁴) than it receives from the sky","Evaporation stops","Clouds reflect heat away"],a:1,
 m:"With no sunlight there is no radiation exchange at night.",x:"Every surface radiates in proportion to T⁴. A clear sky returns less long-wave radiation than the warm ground emits, so the surface cools; clouds reduce the loss, which is why clear nights bring frost."},
{law:"wien",sec:"field",src:"Hillel 1998, p. 595",q:"Using Wien's law (λmax·T ≈ 2900 µm·K), where do the sun (about 6000 K) and the soil surface (about 300 K) emit most strongly?",
 o:["Both around 10 µm","Sun near 0.5 µm (visible), soil near 10 µm (thermal infrared)","Sun near 10 µm, soil near 0.5 µm","Both in the visible range"],a:1,
 m:"Hot and cool bodies emit at the same wavelengths, only more or less strongly.",x:"Peak wavelength is inversely proportional to temperature. The separation into short-wave solar and long-wave terrestrial radiation is what makes the greenhouse effect, and thermal remote sensing, possible."},
/* ---- Filling the remaining laws ---- */
{law:"beer",sec:"field",q:"A cereal canopy has a light extinction coefficient k = 0.5. Leaf area index rises from 3 to 6. What happens to the share of light intercepted?",
 o:["It doubles","It rises from about 78 % to about 95 %","It rises from 50 % to 100 %","It stays the same"],a:1,
 m:"Twice the leaf area intercepts twice the light.",x:"Transmission is e^(−k·LAI): e^(−1.5) ≈ 22 % and e^(−3) ≈ 5 %. Interception saturates, which is also why NDVI saturates in dense canopies."},
{law:"beer",sec:"field",q:"A spectrophotometric phosphate analysis gives an absorbance far above the calibration range. What should be done?",
 o:["Extrapolate the calibration line","Dilute the sample into the linear range and correct for the dilution","Report the maximum standard","Measure at a different temperature"],a:1,
 m:"Absorbance stays proportional to concentration at any level.",x:"Beer–Lambert linearity holds only over a limited range; at high absorbance, stray light and chemical effects bend the curve. Dilution brings the reading back into the calibrated range."},
{law:"planck",sec:"field",q:"A thermal camera views a dry soil and a plastic sheet at exactly the same temperature. Why can they show different temperatures?",
 o:["The camera measures air temperature","They have different emissivities, so they emit different radiance at the same temperature","Plastic is always hotter","Thermal cameras measure reflected sunlight"],a:1,
 m:"A thermal camera reads temperature directly.",x:"The camera measures emitted radiance and converts it with Planck's law, assuming an emissivity. A wrong emissivity setting gives a wrong temperature, and reflected sky radiation adds further error."},
{law:"ohm",sec:"field",src:"Brady & Weil, p. 454",q:"An apparent electrical conductivity (ECa) survey shows a high-EC zone in a non-saline Finnish clay field. What does it most likely reflect?",
 o:["Salinity, as in arid regions","Higher clay and water content; ECa integrates salts, clay and moisture","Higher organic matter only","Metal pipes in all cases"],a:1,
 m:"High soil EC always means salinity.",x:"In saline regions ECa tracks salt content closely. Where soils are not saline, current flows mainly through water films and clay surfaces, so ECa maps texture and wetness, and must be calibrated with soil samples."},
{law:"gibbs",sec:"field",q:"A reaction has a positive standard free energy change, ΔG° > 0. Can it run in the soil?",
 o:["Never","Yes, if products are kept at low concentration so that ΔG = ΔG° + RT ln Q becomes negative","Only if heated above 100 °C","Only with an enzyme"],a:1,
 m:"A positive ΔG° means a reaction is impossible.",x:"ΔG° refers to standard conditions. In soil, plant uptake, leaching or degassing can keep products scarce enough to drive the reaction forward, as with mineral dissolution in leached soils."},
{law:"hess",sec:"field",q:"A straw sample releases 17 MJ/kg when burned in a bomb calorimeter. How much heat is released when the same straw decomposes slowly to CO₂ and water in soil over two years?",
 o:["Much less, because slow reactions release less energy","About the same in total, because enthalpy change depends only on start and end states","Twice as much","None, decomposition is not exothermic"],a:1,
 m:"Slow processes release less energy than fast ones.",x:"By Hess's law, the total enthalpy change is path-independent. Decomposition releases the energy slowly, and some of it is retained in microbial biomass and humus, which are not fully oxidised end products."},
{law:"hh",sec:"field",q:"Slurry pH rises from 7 to 8. By about how much does the share of ammonium present as volatile NH₃ (pKa 9.25) increase?",
 o:["By about 10 %","About tenfold, from roughly 0.6 % to 5 %","It doubles","It does not change"],a:1,
 m:"One pH unit is a small change.",x:"Well below the pKa, the NH₃ fraction rises about tenfold per pH unit. Slurry acidification and rapid incorporation reduce ammonia losses for this reason."},
{law:"hh",sec:"field",q:"The carbonic acid / bicarbonate pair has pKa about 6.35. Where does it resist pH change most strongly?",
 o:["At pH 4","Near pH 6.35, where both forms are present in similar amounts","At pH 9","At every pH equally"],a:1,
 m:"A buffer works the same at any pH.",x:"Buffer capacity peaks where pH = pKa. Soils have several buffer systems, carbonates, exchange sites and aluminium, each strongest in its own pH range."},
{law:"isotherms",sec:"field",src:"Paasonen-Kivekäs et al. 2016, p. 185",q:"Years of phosphorus fertilisation have partly filled a soil's Al and Fe oxide surfaces. How does that affect newly applied fertiliser P?",
 o:["It is bound even more tightly","It is held less tightly, so a larger share stays available to the crop","It is unaffected","It is all leached at once"],a:1,
 m:"Every soil binds new phosphorus equally strongly.",x:"As sorption sites fill, binding strength falls, as the curvature of a Langmuir isotherm describes. Build-up improves later fertiliser efficiency, but also raises the loss potential."},
{law:"isotherms",sec:"field",q:"A pesticide has a very high sorption coefficient (Koc). Which statement is correct?",
 o:["It cannot reach water bodies","It leaches little to groundwater, but can reach surface waters bound to eroded soil particles","It degrades faster because it is sorbed","Sorption makes it non-toxic"],a:1,
 m:"Strongly sorbed compounds stay put.",x:"Sorption slows movement with water but ties the compound to particles. Erosion and surface runoff then become the main transport route, as with phosphorus."},
{law:"michaelis",sec:"field",q:"A root's nitrate uptake follows Michaelis–Menten kinetics with Km = 50 µM. Soil solution nitrate rises from 1000 to 2000 µM. What happens to uptake rate?",
 o:["It doubles","It rises only slightly, because uptake is already near saturation","It falls","It rises tenfold"],a:1,
 m:"Uptake rises in proportion to concentration.",x:"At 1000 µM the rate is already 1000/1050 ≈ 95 % of Vmax; at 2000 µM it is about 98 %. Far above Km, extra supply does little for uptake, but raises leaching risk."},
{law:"isotope",sec:"field",q:"Groundwater nitrate has a high δ¹⁵N of +15 ‰. Does that prove the nitrate came from manure?",
 o:["Yes, manure is the only source with high δ¹⁵N","No; denitrification also enriches the remaining nitrate in ¹⁵N, so mixing and fractionation must both be considered","Yes, if the field received manure once","No, δ¹⁵N says nothing about sources"],a:1,
 m:"An isotope value is a unique fingerprint of the source.",x:"Fractionation changes isotope ratios along the way. Dual isotopes (δ¹⁵N with δ¹⁸O of nitrate) and mixing models are used to separate source from process."},
{law:"isotope",sec:"field",q:"Maize (a C4 plant, δ¹³C ≈ −12 ‰) is grown for years on a soil formed under C3 vegetation (≈ −27 ‰). What does the soil carbon δ¹³C allow you to estimate?",
 o:["Nothing, isotopes mix completely","The share of soil carbon derived from maize, and so the turnover of old and new carbon","The soil's nitrogen content","The soil's age"],a:1,
 m:"New and old soil carbon cannot be told apart.",x:"The natural ¹³C difference between C3 and C4 plants acts as a label. A two-source mixing model gives the fraction of new carbon at each depth."},
{law:"clorpt",sec:"field",src:"Brady & Weil, p. 59",q:"Two soils developed from the same granite. One is a deep red, clay-rich soil, the other a thin, sandy, little-weathered one. Which factors best explain the difference?",
 o:["Parent material alone","Climate, organisms, relief and time, the other state factors in Jenny's model","Only fertiliser history","Measurement error"],a:1,
 m:"Parent material decides what soil forms.",x:"Jenny's S = f(cl, o, r, p, t) treats parent material as one factor among five. Warm humid climate and long time produce deep weathered soils from the same rock that stays shallow and sandy in cold, young landscapes."},
{law:"clorpt",sec:"field",src:"Paasonen-Kivekäs et al. 2016, pp. 19–20",q:"Why do Finnish soils contain so much unweathered mineral material compared with tropical soils?",
 o:["Finnish rocks are harder","They are young, formed from glacial deposits since the last ice age about 10 000 years ago, in a cold climate","Acid rain stopped weathering","They contain no feldspar"],a:1,
 m:"All old-looking soils are old.",x:"Time and climate are slow factors. Finnish soils formed on fresh till and sediments after deglaciation, so primary minerals such as feldspars, biotite and apatite are still abundant."},
